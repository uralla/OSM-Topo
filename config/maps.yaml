schema_version: 1

# Migrated mechanically from scripts/*.sh on 2026-08-25.
# ZIP archives are intentionally not used as inputs.

defaults:
  enabled: true
  priority: 100
  update_interval_days: null
  product_id: 1
  code_page: 1251
  style: styles/uralla
  typ: styles/uralla.txt
  mkgmap_args: styles/uralla.args
  preprocessor:
    blacklist: config/preprocessor-blacklist.yaml
    source_profiles:
      russia:
        - ru-political-parties
      crimea:
        - ru-political-parties
      northwestern:
        - ru-political-parties
  bounds: input/bounds-latest.zip
  sea: input/sea-latest.zip
  splitter:
    output: pbf
    keep_complete: true
    wanted_admin_level: 8
  areas:
    mode: managed
    root: build-state/areas

sources:
  armenia:
    path: input/armenia-latest.osm.pbf
  belarus:
    path: input/belarus-latest.osm.pbf
  crimea:
    path: input/crimean-fed-district-latest.osm.pbf
  georgia:
    path: input/georgia-latest.osm.pbf
  kazakhstan:
    path: input/kazakhstan-latest.osm.pbf
  kyrgyzstan:
    path: input/kyrgyzstan-latest.osm.pbf
  mongolia:
    path: input/mongolia-latest.osm.pbf
  northwestern:
    path: input/northwestern-fed-district-latest.osm.pbf
  russia:
    path: input/russia-latest.osm.pbf
  turkey:
    path: input/turkey-latest.osm.pbf

