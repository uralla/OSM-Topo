name: Add education long-name fallbacks

on:
  push:
    paths:
      - '.github/workflows/add-education-long-name-fallbacks.yml'

permissions:
  contents: write

jobs:
  mutate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply long-name fallbacks
        shell: python
        run: |
          from pathlib import Path

          path = Path('styles/uralla/points')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'amenity=college [0x2c05 resolution 24]': "amenity=college & uralla:long_name=yes { name 'колледж' } [0x2c05 resolution 24]\namenity=college [0x2c05 resolution 24]",
              'amenity=kindergarten [0x2c05 resolution 24]': "amenity=kindergarten & uralla:long_name=yes { name 'детский сад' } [0x2c05 resolution 24]\namenity=kindergarten [0x2c05 resolution 24]",
              'amenity=school [0x2c05 resolution 24]': "amenity=school & uralla:long_name=yes { name 'школа' } [0x2c05 resolution 24]\namenity=school [0x2c05 resolution 24]",
              'amenity=university [0x2c05 resolution 24]': "amenity=university & uralla:long_name=yes { name 'университет' } [0x2c05 resolution 24]\namenity=university [0x2c05 resolution 24]",
          }

          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_education_long_name_labels.py')
          test.write_text("""from pathlib import Path\n\n\ndef test_education_long_name_fallbacks_precede_normal_rules():\n    text = Path('styles/uralla/points').read_text(encoding='utf-8')\n    pairs = [\n        (\"amenity=college & uralla:long_name=yes { name 'колледж' } [0x2c05 resolution 24]\", \"amenity=college [0x2c05 resolution 24]\"),\n        (\"amenity=kindergarten & uralla:long_name=yes { name 'детский сад' } [0x2c05 resolution 24]\", \"amenity=kindergarten [0x2c05 resolution 24]\"),\n        (\"amenity=school & uralla:long_name=yes { name 'школа' } [0x2c05 resolution 24]\", \"amenity=school [0x2c05 resolution 24]\"),\n        (\"amenity=university & uralla:long_name=yes { name 'университет' } [0x2c05 resolution 24]\", \"amenity=university [0x2c05 resolution 24]\"),\n    ]\n    for fallback, normal in pairs:\n        assert fallback in text\n        assert normal in text\n        assert text.index(fallback) < text.index(normal)\n""", encoding='utf-8')

      - name: Remove one-shot workflow
        run: rm .github/workflows/add-education-long-name-fallbacks.yml
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/points tests/test_education_long_name_labels.py .github/workflows/add-education-long-name-fallbacks.yml
          git commit -m "Add education long-name POI labels"
          git pull --rebase origin main
          git push origin main
