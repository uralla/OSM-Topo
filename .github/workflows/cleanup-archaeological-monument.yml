name: Cleanup archaeological site and monument rules

on:
  push:
    paths:
      - '.github/workflows/cleanup-archaeological-monument.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Merge archaeological site and monument rules
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('styles/uralla/points')
          s = p.read_text()
          archaeological = "historic=archaeological_site [0x2c04 resolution 24]\n"
          monument = "historic=monument [0x2c04 resolution 24]\n"
          unified = "(historic=archaeological_site | historic=monument) [0x2c04 resolution 24]\n"
          assert s.count(archaeological) == 1
          assert s.count(monument) == 1
          s = s.replace(archaeological, unified, 1)
          s = s.replace(monument, '', 1)
          p.write_text(s)
          PY
      - name: Commit cleanup and remove workflow
        run: |
          rm .github/workflows/cleanup-archaeological-monument.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/points .github/workflows/cleanup-archaeological-monument.yml
          git commit -m "Unify archaeological site and monument POI rule"
          git push
