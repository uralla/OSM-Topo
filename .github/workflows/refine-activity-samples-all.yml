name: Refine activity sample diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-activity-samples-all.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep all activity samples and add POI kind
        run: |
          python - <<'PY'
          from pathlib import Path

          poi = Path('uralla_build/poi_context.py')
          text = poi.read_text(encoding='utf-8')
          old = '''    return result, changed, {\n        "id": int(getattr(item, "id", 0)),\n        "name": result.get("name"),\n        "priority": result.get(POI_PRIORITY_TAG),\n        "activity_500m": activity_500m,\n        "activity_2km": activity_2km,\n        "activity_10km": activity_10km,\n        "lat": lat,\n        "lon": lon,\n    }\n'''
          new = '''    if is_food_shop(result):\n        poi_kind = "food"\n    elif is_accommodation(result):\n        poi_kind = "accommodation"\n    elif is_transit_stop(result):\n        poi_kind = "transit"\n    else:\n        poi_kind = "other"\n    return result, changed, {\n        "id": int(getattr(item, "id", 0)),\n        "name": result.get("name"),\n        "kind": poi_kind,\n        "priority": result.get(POI_PRIORITY_TAG),\n        "activity_500m": activity_500m,\n        "activity_2km": activity_2km,\n        "activity_10km": activity_10km,\n        "lat": lat,\n        "lon": lon,\n    }\n'''
          if old not in text:
              raise SystemExit('activity sample return block not found')
          poi.write_text(text.replace(old, new, 1), encoding='utf-8')

          pre = Path('uralla_build/preprocessor.py')
          text = pre.read_text(encoding='utf-8')
          old = '''                    if activity_sample is not None and len(activity_context_samples) < 200:\n                        activity_context_samples.append(activity_sample)\n'''
          new = '''                    if activity_sample is not None:\n                        activity_context_samples.append(activity_sample)\n'''
          if old not in text:
              raise SystemExit('activity sample cap not found')
          text = text.replace(old, new, 1)

          text = text.replace(
              '''                        f"name={sample.get('name')!r}; "\n                        f"priority={sample.get('priority')}; "\n''',
              '''                        f"name={sample.get('name')!r}; "\n                        f"kind={sample.get('kind')}; "\n                        f"priority={sample.get('priority')}; "\n'''
          )
          pre.write_text(text, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python -m py_compile uralla_build/poi_context.py uralla_build/preprocessor.py
          python -m unittest tests.test_poi_context -v
          grep -q '"kind": poi_kind' uralla_build/poi_context.py
          grep -q 'activity_context_samples.append(activity_sample)' uralla_build/preprocessor.py
          grep -q "kind={sample.get('kind')}" uralla_build/preprocessor.py

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/poi_context.py uralla_build/preprocessor.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Refine activity context sample diagnostics'
            git push
          fi
