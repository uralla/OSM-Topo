name: One-shot outdoor adaptive LOD
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-outdoor-adaptive-lod.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/add-outdoor-adaptive-lod.py
      - name: Validate
        run: |
          python3 -m py_compile uralla_build/poi_context.py uralla_build/preprocessor.py
          python3 -m unittest tests.test_poi_context tests.test_poi_lod -v
          git diff --check
          grep -q 'uralla:poi_lod_class=H & tourism=picnic_site' styles/uralla/points
          grep -q 'uralla:poi_lod_class=H & (amenity=bench | leisure=picnic_table) \[0x4a01 resolution 23\]' styles/uralla/points
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/poi_context.py uralla_build/preprocessor.py styles/uralla/points tests/test_poi_context.py
          git commit -m 'Add outdoor POIs to adaptive LOD'
          git push
