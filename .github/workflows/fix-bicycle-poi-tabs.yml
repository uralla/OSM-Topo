name: Fix bicycle POI palette tabs

"on":
  push:
    paths:
      - ".github/workflows/fix-bicycle-poi-tabs.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Fix palette separators in bicycle POI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('styles/uralla.txt')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'(?ms)^\[_point\]\nType=0x115\nSubType=0x0a\n.*?^\[end\]')
          matches = list(pattern.finditer(s))
          assert len(matches) == 1, f'expected one 0x1150a block, found {len(matches)}'
          m = matches[0]
          block = m.group(0)
          assert block.count('\\\\tc ') == 3, repr(block)
          fixed = block.replace('\\\\tc ', '\tc ')
          assert '\\\\tc ' not in fixed
          assert fixed.count('\tc ') == 3
          p.write_text(s[:m.start()] + fixed + s[m.end():], encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/fix-bicycle-poi-tabs.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla.txt .github/workflows/fix-bicycle-poi-tabs.yml
          git commit -m "Fix bicycle POI palette tabs"
          git push
