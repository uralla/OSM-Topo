name: Restore single splitter pipeline
'on':
  push:
    paths:
      - '.github/workflows/restore-single-splitter.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Restore safe pipeline
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('uralla_build/build_plan.py')
          s = p.read_text()

          s = s.replace('        splitter_input = extract_output\n', '        preprocess_input = extract_output\n', 1)
          s = s.replace('        splitter_input = source_path\n', '        preprocess_input = source_path\n', 1)

          anchor = '''    elevation_value = product.get("elevation")\n\n    areas_root = repo_path(repo, _text(areas.get("root"), "defaults.areas.root"))\n'''
          replacement = '''    semantic_input = build_root / "preprocess" / "preprocessed.osm.pbf"\n    preprocess_command = [\n        sys.executable,\n        "-m",\n        "uralla_build",\n        "preprocess",\n        "--input",\n        str(preprocess_input),\n        "--output",\n        "preprocessed.osm.pbf",\n        "--config",\n        str(blacklist),\n        "--report",\n        "report.json",\n    ]\n    for profile in profiles:\n        preprocess_command.extend(("--profile", profile))\n    stages.append(\n        PipelineStage(\n            "preprocess",\n            tuple(preprocess_command),\n            ("preprocessed.osm.pbf", "report.json"),\n            environment=(("PYTHONPATH", str(repo)),),\n        )\n    )\n    if "ru-political-parties" in profiles:\n        warnings.append(\n            "semantic preprocessing: landmarks + Russian political blacklist"\n        )\n    else:\n        warnings.append("semantic preprocessing: static peak + river landmarks")\n\n    elevation_value = product.get("elevation")\n    if elevation_value is not None:\n        elevation = data_path(\n            host,\n            _text(elevation_value, f"products.{product_key}.elevation"),\n        )\n        splitter_input = build_root / "merge" / "enriched.osm.pbf"\n        stages.append(\n            PipelineStage(\n                "merge",\n                (\n                    "osmium",\n                    "merge",\n                    "-O",\n                    "--progress",\n                    str(semantic_input),\n                    str(elevation),\n                    "-o",\n                    "enriched.osm.pbf",\n                ),\n                ("enriched.osm.pbf",),\n            )\n        )\n    else:\n        splitter_input = semantic_input\n\n    areas_root = repo_path(repo, _text(areas.get("root"), "defaults.areas.root"))\n'''
          assert anchor in s
          s = s.replace(anchor, replacement, 1)

          start = s.index('    elevation_tiles: Path | None = None\n')
          end = s.index('    garmin = build_root / "mkgmap" / "garmin"\n', start)
          s = s[:start] + s[end:]

          p.write_text(s)
          PY
      - name: Verify structure
        run: |
          python -m py_compile uralla_build/build_plan.py
          python - <<'PY'
          from pathlib import Path
          s = Path('uralla_build/build_plan.py').read_text()
          assert '"preprocess"' in s
          assert '"merge"' in s
          assert '"splitter-elevation"' not in s
          assert '"prepare-tiles"' not in s
          assert 'uralla_build.tile_preprocess' not in s
          assert s.index('"preprocess"') < s.index('"splitter"')
          print('single-splitter structure OK')
          PY
      - name: Commit restore
        run: |
          rm .github/workflows/restore-single-splitter.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Restore single-splitter build pipeline"
          git push
