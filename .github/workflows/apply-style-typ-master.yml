name: Apply style and TYP master decisions

on:
  push:
    branches:
      - main
    paths:
      - scripts/apply_style_typ_master.py
      - .github/workflows/apply-style-typ-master.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply agreed style and TYP decisions
        run: python3 scripts/apply_style_typ_master.py

      - name: Commit direct source changes and remove one-shot helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla/lines styles/uralla.txt
          git rm scripts/apply_style_typ_master.py .github/workflows/apply-style-typ-master.yml
          git commit -m "Apply agreed style and TYP decisions"
          git push origin HEAD:main
