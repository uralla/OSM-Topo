name: Remove bus station parking polygon

"on":
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-bus-station-parking-polygon.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove bus station parking polygon and add regression test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          polygons = Path('styles/uralla/polygons')
          text = polygons.read_text()
          target = 'amenity=bus_station [0x05 resolution 22]\n'
          if target not in text:
              raise SystemExit('target bus_station polygon rule not found')
          text = text.replace(target, '', 1)
          polygons.write_text(text)

          test = Path('tests/test_bus_station_polygon_style.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_bus_station_does_not_use_parking_polygon_type():\n    polygons = Path("styles/uralla/polygons").read_text()\n    assert "amenity=bus_station [0x05" not in polygons\n    assert "amenity=parking | parking=surface [0x05 resolution 24]" in polygons\n''')
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/remove-bus-station-parking-polygon.yml
          git add styles/uralla/polygons tests/test_bus_station_polygon_style.py .github/workflows/remove-bus-station-parking-polygon.yml
          git commit -m 'Remove bus station parking polygon mapping'
          git pull --rebase origin main
          git push origin main
