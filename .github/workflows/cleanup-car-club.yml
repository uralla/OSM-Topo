name: Cleanup legacy car club rule

on:
  push:
    paths:
      - '.github/workflows/cleanup-car-club.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy car club rule
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('styles/uralla/points')
          text = path.read_text(encoding='utf-8')
          needle = 'amenity=car_club [0x2f0d resolution 24]\n'
          count = text.count(needle)
          if count != 1:
              raise SystemExit(f'expected exactly one legacy car_club rule, found {count}')
          path.write_text(text.replace(needle, ''), encoding='utf-8')
          PY
          rm .github/workflows/cleanup-car-club.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles/uralla/points .github/workflows/cleanup-car-club.yml
          git commit -m 'Remove legacy car club POI rule'
          git push
