name: Check external workspace setup once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-external-workspace-once.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate setup shell
        run: bash -n setup.sh

      - name: Install project tests
        run: python -m pip install -e . pytest

      - name: Run host pointer tests
        run: pytest -q tests/test_host.py

      - name: Run full suite
        run: pytest -q

      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/check-external-workspace-once.yml
          git commit -m "Complete external workspace setup validation"
          git push origin HEAD:main
