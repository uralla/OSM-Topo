name: Apply long-name monument test

on:
  push:
    paths:
      - '.github/workflows/apply-long-name-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply patch
        run: python3 .github/long_name_patch.py
      - name: Validate targeted tests
        run: |
          python -m pip install -e . pytest
          pytest -q tests/test_preprocessor.py tests/test_archaeological_monument_style.py
      - name: Remove one-shot files
        run: rm .github/workflows/apply-long-name-test.yml .github/long_name_patch.py
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uralla_build/preprocessor.py styles/uralla/points tests/test_preprocessor.py tests/test_archaeological_monument_style.py .github/workflows/apply-long-name-test.yml .github/long_name_patch.py
          git commit -m "Mark long names and simplify monument map labels"
          git pull --rebase origin main
          git push
