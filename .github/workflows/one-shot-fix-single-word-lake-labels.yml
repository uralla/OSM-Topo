name: One-shot fix single-word lake labels

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-single-word-lake-labels.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix lake label compaction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('uralla_build/preprocessor.py')
          text = path.read_text(encoding='utf-8')
          old = '''    size_abbreviated = False\n    # Compact directional/size adjectives on ordinary natural features and lakes.\n    # Prominent peak/volcano landmarks keep their full display names.\n    if (label_class == "lake" or natural is not None) and result.get(PEAK_LANDMARK_TAG) != "yes":\n        for pattern, prefix in _GEOGRAPHIC_LEADING_ABBREVIATIONS:\n            match = pattern.fullmatch(label)\n            if not match:\n                continue\n            tail = match.group(1).strip()\n            if tail:\n                label = prefix + tail\n                size_abbreviated = True\n            break\n\n    # When a lake name already contains an explicitly generic size/directional\n    # adjective, the trailing type word is redundant with water=lake.  Keep the\n    # suffix for ordinary proper names such as "Черное Озеро".\n    if label_class == "lake" and size_abbreviated:\n        lake_suffix_match = re.fullmatch(r"(.+?)\\s+озеро\\s*", label, re.IGNORECASE)\n        if lake_suffix_match:\n            stripped = lake_suffix_match.group(1).strip()\n            if stripped:\n                label = stripped\n'''
          new = '''    # For lakes, a lowercase trailing ``озеро`` is a generic type marker.\n    # Strip it before abbreviation so a one-word name such as ``Верхнее озеро``\n    # becomes ``Верхнее`` rather than the meaningless ``В.``.  Capitalized\n    # ``Озеро`` is deliberately preserved as part of the proper name.\n    if label_class == "lake":\n        lake_suffix_match = re.fullmatch(r"(.+?)\\s+озеро\\s*", label)\n        if lake_suffix_match:\n            stripped = lake_suffix_match.group(1).strip()\n            if stripped:\n                label = stripped\n\n    # Compact directional/size adjectives on ordinary natural features and lakes.\n    # Prominent peak/volcano landmarks keep their full display names.  The regexes\n    # require a remaining second word, so single-word lake labels stay intact.\n    if (label_class == "lake" or natural is not None) and result.get(PEAK_LANDMARK_TAG) != "yes":\n        for pattern, prefix in _GEOGRAPHIC_LEADING_ABBREVIATIONS:\n            match = pattern.fullmatch(label)\n            if not match:\n                continue\n            tail = match.group(1).strip()\n            if tail:\n                label = prefix + tail\n            break\n'''
          if old not in text:
              raise SystemExit('target lake compaction block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_semantic_lake_labels.py')
          tests = test_path.read_text(encoding='utf-8')
          tests = tests.replace(
              'from uralla_build.semantic_apply import _respect_lake_suffix_capitalization\n',
              'from uralla_build.preprocessor import enrich_geographic_label_tags\nfrom uralla_build.semantic_apply import _respect_lake_suffix_capitalization\n',
              1,
          )
          marker = '''    def test_lowercase_type_suffix_is_removed(self) -> None:\n'''
          additions = '''    def test_single_word_directional_lake_names_are_not_abbreviated(self) -> None:\n        cases = {\n            "Верхнее озеро": "Верхнее",\n            "Нижнее озеро": "Нижнее",\n            "Большое озеро": "Большое",\n        }\n        for name, expected in cases.items():\n            with self.subTest(name=name):\n                tags, changed = enrich_geographic_label_tags(\n                    {"water": "lake", "name": name}\n                )\n                self.assertTrue(changed)\n                self.assertEqual(tags["uralla:label"], expected)\n\n    def test_multiword_size_lake_name_is_still_compacted(self) -> None:\n        tags, changed = enrich_geographic_label_tags(\n            {"water": "lake", "name": "Большое Катасьминское озеро"}\n        )\n        self.assertTrue(changed)\n        self.assertEqual(tags["uralla:label"], "Бол. Катасьминское")\n\n'''
          if additions not in tests:
              if marker not in tests:
                  raise SystemExit('test insertion marker not found')
              tests = tests.replace(marker, additions + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Run focused tests
        run: python -m unittest tests.test_semantic_lake_labels -v

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+uralla@users.noreply.github.com"
          git add uralla_build/preprocessor.py tests/test_semantic_lake_labels.py
          git commit -m "Keep single-word lake labels readable"
          git push
