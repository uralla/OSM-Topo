name: One-shot splitter resume
on:
  push:
    paths:
      - '.github/workflows/one-shot-splitter-resume.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch splitter polygon switch and resume path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # build_plan.py: make splitter polygon optional per product.
          p = Path('uralla_build/build_plan.py')
          s = p.read_text(encoding='utf-8')
          old = '''        f"--description={_text(names.get('description'), f'products.{product_key}.names.description')}",\n        f"--polygon-file={polygon}",\n        f"--precomp-sea={sea}",\n'''
          new = '''        f"--description={_text(names.get('description'), f'products.{product_key}.names.description')}",\n        f"--precomp-sea={sea}",\n'''
          if old in s:
              s = s.replace(old, new, 1)
          anchor = '''    max_threads = splitter.get("max_threads")\n'''
          insert = '''    if splitter.get("use_polygon", True):\n        splitter_command.append(f"--polygon-file={polygon}")\n    max_threads = splitter.get("max_threads")\n'''
          if insert not in s:
              if anchor not in s:
                  raise SystemExit('build_plan splitter anchor not found')
              s = s.replace(anchor, insert, 1)
          p.write_text(s, encoding='utf-8')

          # incremental.py: add resume from latest successful merge checkpoint.
          p = Path('uralla_build/incremental.py')
          s = p.read_text(encoding='utf-8')
          helper_anchor = '''def rebuild_from_mkgmap(\n'''
          helper = '''def _latest_failed_merge_checkpoint(\n    history: HistoryStore,\n    builds_root: Path,\n    product: str,\n) -> tuple[str, Path]:\n    with history.connect() as connection:\n        rows = connection.execute(\n            \"\"\"SELECT build_id FROM builds\n               WHERE product = ? AND status IN ('failed', 'interrupted')\n               ORDER BY created_at DESC\"\"\",\n            (product,),\n        ).fetchall()\n    for row in rows:\n        build_id = str(row[\"build_id\"])\n        attempts = history.attempts(build_id)\n        if not any(\n            attempt.get(\"stage_name\") == \"merge\" and attempt.get(\"status\") == \"success\"\n            for attempt in attempts\n        ):\n            continue\n        checkpoint = builds_root / build_id / \"merge\" / \"enriched.osm.pbf\"\n        if checkpoint.is_file() and checkpoint.stat().st_size > 0:\n            return build_id, checkpoint\n    raise StageError(\n        f\"no failed build with reusable merge checkpoint exists for {product!r}\"\n    )\n\n\ndef rebuild_from_splitter(\n    manifest: Mapping[str, object],\n    host: HostConfig,\n    *,\n    product_key: str,\n    repo_root: str | Path,\n    manifest_path: str | Path,\n    tools_lock_path: str | Path,\n    build_id: str | None = None,\n) -> dict[str, object]:\n    \"\"\"Run splitter and later stages using the latest failed build's merge checkpoint.\"\"\"\n    products = manifest.get(\"products\")\n    product = products.get(product_key) if isinstance(products, Mapping) else None\n    if not isinstance(product, Mapping):\n        raise StageError(f\"unknown product: {product_key}\")\n\n    runner = StageRunner(host.paths.work_root)\n    previous_id, previous_merge = _latest_failed_merge_checkpoint(\n        runner.history, runner.builds_root, product_key\n    )\n    metadata = {\n        \"mode\": \"from-stage:splitter\",\n        \"reused_build_id\": previous_id,\n        \"reused_merge\": str(previous_merge),\n    }\n    if build_id is None:\n        identifier = runner.create_build(product_key, metadata)\n    else:\n        identifier = runner.history.create_build(product_key, metadata, build_id=build_id)\n\n    build = runner.history.get_build(identifier)\n    if build is None:\n        raise StageError(f\"unknown build id after creation: {identifier}\")\n    created = date.fromisoformat(str(build[\"created_at\"])[:10])\n    lock = load_tools_lock(tools_lock_path)\n    plan = plan_product_build(\n        manifest, host, lock, product_key=product_key, build_id=identifier,\n        repo_root=repo_root, manifest_path=manifest_path, build_date=created,\n    )\n    names = [stage.name for stage in plan.stages]\n    if \"splitter\" not in names:\n        runner.history.set_build_status(identifier, \"failed\")\n        raise StageError(\"build plan contains no splitter stage\")\n    start = names.index(\"splitter\")\n    resumed = list(plan.stages[start:])\n    current_input = runner.builds_root / identifier / \"merge\" / \"enriched.osm.pbf\"\n    splitter_stage = resumed[0]\n    command = tuple(\n        str(previous_merge) if argument == str(current_input) else argument\n        for argument in splitter_stage.command\n    )\n    if command == splitter_stage.command:\n        runner.history.set_build_status(identifier, \"failed\")\n        raise StageError(\"could not substitute previous merge checkpoint into splitter command\")\n    resumed[0] = PipelineStage(\n        splitter_stage.name, command, splitter_stage.expected_outputs,\n        splitter_stage.prepare_directories, splitter_stage.environment, splitter_stage.resume_key,\n    )\n\n    def finalize(_build_id: str) -> object:\n        artifacts = publish_product(host, product, plan.img_source, plan.gmapi_source)\n        return [artifact.to_dict() for artifact in artifacts]\n\n    result = PipelineRunner(runner).run(\n        product=product_key, stages=tuple(resumed), build_id=identifier,\n        metadata=None, resume=False, finalize=finalize,\n    )\n    return {\n        \"mode\": \"apply\", \"from_stage\": \"splitter\",\n        \"reused_build_id\": previous_id, \"reused_merge\": str(previous_merge),\n        \"result\": result.to_dict(),\n    }\n\n\n'''
          if 'def rebuild_from_splitter(' not in s:
              if helper_anchor not in s:
                  raise SystemExit('incremental anchor not found')
              s = s.replace(helper_anchor, helper + helper_anchor, 1)
          p.write_text(s, encoding='utf-8')

          # cli.py: wire --from-stage splitter/mkgmap and skip source refresh for resumed builds.
          p = Path('uralla_build/cli.py')
          s = p.read_text(encoding='utf-8')
          import_anchor = 'from .host import load_host_config, validate_host_config\n'
          import_line = 'from .incremental import rebuild_from_mkgmap, rebuild_from_splitter\n'
          if import_line not in s:
              s = s.replace(import_anchor, import_anchor + import_line, 1)
          s = s.replace('if args.apply and getattr(args, "from_stage", None) != "mkgmap":',
                        'if args.apply and getattr(args, "from_stage", None) is None:', 1)
          apply_anchor = '''        else:\n            runner = StageRunner(host.paths.work_root)\n'''
          dispatch = '''        else:\n            from_stage = getattr(args, "from_stage", None)\n            if from_stage == "splitter":\n                payload = rebuild_from_splitter(\n                    manifest, host, product_key=args.product, repo_root=args.repo_root,\n                    manifest_path=args.manifest, tools_lock_path=args.tools_lock, build_id=args.build_id,\n                )\n                result_status = payload.get("result", {}).get("status") if isinstance(payload.get("result"), dict) else None\n                status = 0 if result_status == "success" else 1\n                if args.json:\n                    print(json.dumps({"ok": status == 0, "report": payload}, ensure_ascii=False, indent=2))\n                else:\n                    print(json.dumps(payload, ensure_ascii=False, indent=2))\n                return status\n            if from_stage == "mkgmap":\n                payload = rebuild_from_mkgmap(\n                    manifest, host, product_key=args.product, repo_root=args.repo_root,\n                    manifest_path=args.manifest, tools_lock_path=args.tools_lock, build_id=args.build_id,\n                )\n                result_status = payload.get("result", {}).get("status") if isinstance(payload.get("result"), dict) else None\n                status = 0 if result_status == "success" else 1\n                if args.json:\n                    print(json.dumps({"ok": status == 0, "report": payload}, ensure_ascii=False, indent=2))\n                else:\n                    print(json.dumps(payload, ensure_ascii=False, indent=2))\n                return status\n            runner = StageRunner(host.paths.work_root)\n'''
          if dispatch not in s:
              if apply_anchor not in s:
                  raise SystemExit('cli apply anchor not found')
              s = s.replace(apply_anchor, dispatch, 1)
          parser_anchor = '    product_parser.add_argument("--no-resume", action="store_true")\n'
          parser_new = parser_anchor + '    product_parser.add_argument("--from-stage", choices=("splitter", "mkgmap"))\n'
          if '--from-stage", choices=(' not in s:
              s = s.replace(parser_anchor, parser_new, 1)
          p.write_text(s, encoding='utf-8')

          # interactive.py: expose splitter resume in the product menu.
          p = Path('uralla_build/interactive.py')
          s = p.read_text(encoding='utf-8')
          old_sig = 'def _command(repo_root: Path, host_path: Path, manifest_path: Path, product: str, *, mkgmap_only: bool) -> list[str]:\n'
          new_sig = 'def _command(repo_root: Path, host_path: Path, manifest_path: Path, product: str, *, from_stage: str | None = None) -> list[str]:\n'
          s = s.replace(old_sig, new_sig, 1)
          s = s.replace('    if mkgmap_only:\n        command.extend(("--from-stage", "mkgmap"))\n',
                        '    if from_stage is not None:\n        command.extend(("--from-stage", from_stage))\n', 1)
          old_menu = '''        print("\\n  1. Full build")\n        print("  2. mkgmap only (reuse prepared splitter data)")\n        print("  3. History / stage timings")\n        print("  4. Edit map configuration  [next GUI phase]")\n        print("  5. Delete map configuration [next GUI phase]")\n        print("  0. Back")\n'''
          new_menu = '''        print("\\n  1. Full build")\n        print("  2. Continue from splitter (reuse latest merge checkpoint)")\n        print("  3. mkgmap only (reuse prepared splitter data)")\n        print("  4. History / stage timings")\n        print("  5. Edit map configuration  [next GUI phase]")\n        print("  6. Delete map configuration [next GUI phase]")\n        print("  0. Back")\n'''
          if old_menu in s:
              s = s.replace(old_menu, new_menu, 1)
          old_choices = '''        if choice == "1":\n            _run(_command(repo_root, host_path, manifest_path, key, mkgmap_only=False), repo_root)\n        elif choice == "2":\n            _run(_command(repo_root, host_path, manifest_path, key, mkgmap_only=True), repo_root)\n        elif choice == "3":\n            _history(history, key)\n        elif choice in {"4", "5"}:\n'''
          new_choices = '''        if choice == "1":\n            _run(_command(repo_root, host_path, manifest_path, key), repo_root)\n        elif choice == "2":\n            _run(_command(repo_root, host_path, manifest_path, key, from_stage="splitter"), repo_root)\n        elif choice == "3":\n            _run(_command(repo_root, host_path, manifest_path, key, from_stage="mkgmap"), repo_root)\n        elif choice == "4":\n            _history(history, key)\n        elif choice in {"5", "6"}:\n'''
          if old_choices in s:
              s = s.replace(old_choices, new_choices, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify syntax and focused behavior
        run: |
          python3 -m py_compile uralla_build/build_plan.py uralla_build/incremental.py uralla_build/cli.py uralla_build/interactive.py
          grep -n "use_polygon" uralla_build/build_plan.py config/maps.yaml
          grep -n "from-stage" uralla_build/cli.py uralla_build/interactive.py
          git diff --check
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uralla_build/build_plan.py uralla_build/incremental.py uralla_build/cli.py uralla_build/interactive.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add splitter resume and optional polygon clipping'
          git push
