name: One-shot Nordic path and cache TTL fix

on:
  push:
    paths:
      - '.github/workflows/one-shot-nordic-path-and-cache-ttl.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Physical highway class wins over seasonal nordic piste tagging.
          path = Path('styles/uralla/inc/water_lines')
          text = path.read_text(encoding='utf-8')
          old = '''# Nordic ski routes use the same visual class as skitour, but only when the way\n# is not a real motor-road. highway=unclassified/service/track/etc. keeps its road visual;\n# piste:type describes seasonal winter use there rather than the physical way class.\npiste:type=nordic & (highway!=* | highway=path | highway=footway | highway=cycleway | highway=bridleway | highway=pedestrian | highway=steps) & is_closed()=false & area!=yes [0x10101 resolution 22]\n'''
          new = '''# Nordic ski routes use the same visual class as skitour only when there is no\n# physical highway classification. If highway=* exists (including path/footway/\n# cycleway/track), the physical way class owns the Garmin visual and piste:type\n# remains seasonal metadata only.\npiste:type=nordic & highway!=* & is_closed()=false & area!=yes [0x10101 resolution 22]\n'''
          if old not in text:
              raise SystemExit('nordic rule target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Align the early cleanup policy with the same rule: every real highway wins.
          path = Path('styles/uralla/lines')
          text = path.read_text(encoding='utf-8')
          old = '''# A real motor-road classification wins over seasonal piste tagging.\n# Keep piste semantics for path/footway/cycleway/bridleway/pedestrian ways,\n# but do not let piste:type=nordic replace roads such as unclassified/track/service.\nhighway=* & highway!=path & highway!=footway & highway!=cycleway & highway!=bridleway & highway!=pedestrian & highway!=steps & piste:type=*\n{ delete piste:type; delete piste:grooming }\n'''
          new = '''# A physical highway classification wins over seasonal piste tagging.\n# This includes path/footway/cycleway/bridleway as well as motor roads: piste:type\n# describes seasonal winter use and must not replace the physical way visual.\nhighway=* & piste:type=*\n{ delete piste:type; delete piste:grooming }\n'''
          if old not in text:
              raise SystemExit('piste cleanup target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 2) Reusable spatial analysis cache gets a 30-day max age.
          path = Path('uralla_build/preprocess_fast.py')
          text = path.read_text(encoding='utf-8')
          old = '''ANALYSIS_MANIFEST = "analysis-manifest.json"\nANALYSIS_MANIFEST_SCHEMA = 6\n'''
          new = '''ANALYSIS_MANIFEST = "analysis-manifest.json"\nANALYSIS_MANIFEST_SCHEMA = 6\nANALYSIS_CACHE_MAX_AGE_DAYS = 30\n'''
          if old not in text:
              raise SystemExit('cache constant target not found')
          text = text.replace(old, new, 1)

          old = '''def _validate_reusable_analysis(\n    analysis_dir: Path,\n    source: Path,\n) -> dict[str, object]:\n'''
          new = '''def _validate_analysis_cache_age(manifest_path: Path, *, now: float | None = None) -> None:\n    current = time.time() if now is None else float(now)\n    age_seconds = max(0.0, current - manifest_path.stat().st_mtime)\n    max_age_seconds = ANALYSIS_CACHE_MAX_AGE_DAYS * 24 * 60 * 60\n    if age_seconds >= max_age_seconds:\n        age_days = age_seconds / (24 * 60 * 60)\n        raise StageError(\n            f"reusable analysis cache is {age_days:.1f} days old; "\n            f"maximum is {ANALYSIS_CACHE_MAX_AGE_DAYS} days"\n        )\n\n\ndef _validate_reusable_analysis(\n    analysis_dir: Path,\n    source: Path,\n) -> dict[str, object]:\n'''
          if old not in text:
              raise SystemExit('cache validator insertion target not found')
          text = text.replace(old, new, 1)

          old = '''    for path in (area_artifact, road_artifact, poi_artifact, manifest_path):\n        if not path.is_file() or path.stat().st_size == 0:\n            raise StageError(f"reusable analysis is incomplete: missing {path}")\n    try:\n'''
          new = '''    for path in (area_artifact, road_artifact, poi_artifact, manifest_path):\n        if not path.is_file() or path.stat().st_size == 0:\n            raise StageError(f"reusable analysis is incomplete: missing {path}")\n    _validate_analysis_cache_age(manifest_path)\n    try:\n'''
          if old not in text:
              raise SystemExit('cache age check target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Focused regression tests.
          test = Path('tests/test_nordic_path_priority.py')
          test.write_text('''from pathlib import Path\nimport unittest\n\n\nclass NordicPathPriorityTests(unittest.TestCase):\n    def test_nordic_visual_requires_absent_highway(self) -> None:\n        text = Path("styles/uralla/inc/water_lines").read_text(encoding="utf-8")\n        self.assertIn(\n            "piste:type=nordic & highway!=* & is_closed()=false & area!=yes [0x10101 resolution 22]",\n            text,\n        )\n        self.assertNotIn("highway=path | highway=footway", text)\n\n    def test_any_physical_highway_strips_piste_visual_override(self) -> None:\n        text = Path("styles/uralla/lines").read_text(encoding="utf-8")\n        self.assertIn("highway=* & piste:type=*\\n{ delete piste:type; delete piste:grooming }", text)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          test = Path('tests/test_analysis_cache_ttl.py')
          test.write_text('''from __future__ import annotations\n\nimport os\nfrom pathlib import Path\nimport tempfile\nimport unittest\n\nfrom uralla_build.errors import StageError\nfrom uralla_build.preprocess_fast import (\n    ANALYSIS_CACHE_MAX_AGE_DAYS,\n    _validate_analysis_cache_age,\n)\n\n\nclass AnalysisCacheTtlTests(unittest.TestCase):\n    def test_cache_max_age_is_30_days(self) -> None:\n        self.assertEqual(ANALYSIS_CACHE_MAX_AGE_DAYS, 30)\n\n    def test_cache_younger_than_30_days_is_valid(self) -> None:\n        with tempfile.TemporaryDirectory() as tmp:\n            path = Path(tmp) / "analysis-manifest.json"\n            path.write_text("{}", encoding="utf-8")\n            now = 2_000_000_000.0\n            age = (30 * 24 * 60 * 60) - 1\n            os.utime(path, (now - age, now - age))\n            _validate_analysis_cache_age(path, now=now)\n\n    def test_cache_at_30_days_is_expired(self) -> None:\n        with tempfile.TemporaryDirectory() as tmp:\n            path = Path(tmp) / "analysis-manifest.json"\n            path.write_text("{}", encoding="utf-8")\n            now = 2_000_000_000.0\n            age = 30 * 24 * 60 * 60\n            os.utime(path, (now - age, now - age))\n            with self.assertRaises(StageError):\n                _validate_analysis_cache_age(path, now=now)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Run focused tests
        run: python -m unittest tests.test_nordic_path_priority tests.test_analysis_cache_ttl -v

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+uralla@users.noreply.github.com"
          git add styles/uralla/inc/water_lines styles/uralla/lines uralla_build/preprocess_fast.py tests/test_nordic_path_priority.py tests/test_analysis_cache_ttl.py
          git commit -m "Prefer physical paths over Nordic piste tags and expire analysis cache"
          git push
