name: Update refresh summary

on:
  push:
    paths:
      - '.github/workflows/update-refresh-summary.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add unchanged count to refresh summary
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('uralla_build/cli.py')
          s = p.read_text()
          old = '''        updated = sum(result.status == "updated" for result in results)\n        warnings = sum(result.status == "warning" for result in results)\n        errors = sum(result.status == "error" for result in results)\n        print(f"Updated: {updated}  Warnings: {warnings}  Errors: {errors}")\n'''
          new = '''        updated = sum(result.status == "updated" for result in results)\n        unchanged = sum(result.status == "unchanged" for result in results)\n        warnings = sum(result.status == "warning" for result in results)\n        errors = sum(result.status == "error" for result in results)\n        print(f"Updated: {updated}  Unchanged: {unchanged}  Warnings: {warnings}  Errors: {errors}")\n'''
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit update and remove workflow
        run: |
          rm .github/workflows/update-refresh-summary.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uralla_build/cli.py .github/workflows/update-refresh-summary.yml
          git commit -m "Show unchanged supplemental data in summary"
          git push
