name: Remove stale shelter comments

"on":
  push:
    paths:
      - ".github/workflows/remove-stale-shelter-comments.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove detached shelter comments
        shell: python
        run: |
          from pathlib import Path

          path = Path("styles/uralla/points")
          text = path.read_text(encoding="utf-8")
          stale = (
              "# amenity=shelter is the standard OSM tag for small weather shelters;\n"
              "# shelter_type=* refines lean-to/basic hut/picnic/weather shelter.\n"
              "# Keep legacy tourism=lean_to as a compatibility fallback.\n"
          )
          if stale not in text:
              raise SystemExit("stale shelter comment block not found")
          text = text.replace(stale, "", 1)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/remove-stale-shelter-comments.yml").unlink()
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/points .github/workflows/remove-stale-shelter-comments.yml
          git commit -m "Remove stale shelter comments"
          git pull --rebase origin main
          git push
