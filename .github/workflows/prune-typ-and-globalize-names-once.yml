name: Prune unused TYP and globalize names once

on:
  push:
    branches: [main]
    paths:
      - scripts/prune_typ_and_globalize_names.py
      - .github/workflows/prune-typ-and-globalize-names-once.yml

permissions:
  contents: write

jobs:
  prune-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply global names and strict TYP pruning
        run: python3 scripts/prune_typ_and_globalize_names.py

      - name: Add permanent TYP closure regression tests
        run: |
          cat > tests/test_typ_usage.py <<'PY'
          from pathlib import Path
          import re
          import unittest


          ROOT = Path(__file__).resolve().parents[1]
          STYLE = ROOT / "styles" / "uralla"
          TYP = ROOT / "styles" / "uralla.txt"
          TYPE_RE = re.compile(r"\[\s*(0x[0-9a-fA-F]+)\b")
          INCLUDE_RE = re.compile(r"^\s*include\s+'([^']+)'\s*;", re.MULTILINE)
          SECTION_RE = re.compile(
              r"(?ims)^\[(?P<kind>_point|_line|_polygon)\]\s*\r?\n.*?^\[end\]\s*(?:\r?\n)?"
          )
          DRAW_RE = re.compile(r"(?ims)^\[_drawOrder\]\s*\r?\n.*?^\[end\]\s*(?:\r?\n)?")


          def active_source(text: str) -> str:
              result = []
              for line in text.splitlines():
                  if line.lstrip().startswith("#"):
                      continue
                  result.append(line.split("#", 1)[0])
              return "\n".join(result)


          def closure(entry: Path) -> list[Path]:
              result = []
              seen = set()

              def visit(path: Path) -> None:
                  path = path.resolve()
                  if path in seen:
                      return
                  if not path.is_file():
                      raise AssertionError(f"missing style include: {path}")
                  seen.add(path)
                  result.append(path)
                  active = active_source(path.read_text(encoding="utf-8"))
                  for rel in INCLUDE_RE.findall(active):
                      visit(STYLE / rel)

              visit(entry)
              return result


          def used(entry: str) -> set[int]:
              result = set()
              for path in closure(STYLE / entry):
                  active = active_source(path.read_text(encoding="utf-8"))
                  result.update(int(value, 16) for value in TYPE_RE.findall(active))
              return result


          def typ_text() -> str:
              raw = TYP.read_bytes()
              try:
                  return raw.decode("utf-8")
              except UnicodeDecodeError:
                  return raw.decode("cp1251")


          def section_code(kind: str, section: str) -> int:
              tm = re.search(r"(?im)^Type\s*=\s*0x([0-9a-f]+)\b", section)
              assert tm is not None
              value = int(tm.group(1), 16)
              if kind == "_point":
                  sm = re.search(r"(?im)^SubType\s*=\s*0x([0-9a-f]+)\b", section)
                  if sm:
                      value = (value << 8) | int(sm.group(1), 16)
              return value


          class TypUsageTests(unittest.TestCase):
              def test_global_name_rules_are_shared_by_all_object_kinds(self) -> None:
                  for entry in ("points", "lines", "polygons"):
                      text = (STYLE / entry).read_text(encoding="utf-8")
                      self.assertIn("include 'inc/name';", text, entry)
                  lines = (STYLE / "lines").read_text(encoding="utf-8")
                  self.assertNotIn("сокращаем статусные части названий улиц", lines)
                  name = (STYLE / "inc" / "name").read_text(encoding="utf-8")
                  for fragment in (
                      "subst:улица=> ул.",
                      "subst:переулок=> пер.",
                      "subst:проспект=> пр-т",
                      "subst:Беседка=>Бес.",
                      "subst:беседка=>бес.",
                  ):
                      self.assertIn(fragment, name)

              def test_typ_has_no_graphic_sections_unused_by_production_style(self) -> None:
                  expected = {
                      "_point": used("points"),
                      "_line": used("lines"),
                      "_polygon": used("polygons"),
                  }
                  leftovers = []
                  for match in SECTION_RE.finditer(typ_text()):
                      kind = match.group("kind").lower()
                      code = section_code(kind, match.group(0))
                      if code not in expected[kind]:
                          leftovers.append(f"{kind}:0x{code:x}")
                  self.assertEqual([], leftovers)

              def test_draw_order_contains_only_used_polygon_types(self) -> None:
                  text = typ_text()
                  matches = list(DRAW_RE.finditer(text))
                  self.assertEqual(1, len(matches))
                  used_polygons = used("polygons")
                  leftovers = []
                  for line in matches[0].group(0).splitlines():
                      tm = re.match(r"(?i)^\s*Type\s*=\s*0x([0-9a-f]+)\s*,", line)
                      if tm and int(tm.group(1), 16) not in used_polygons:
                          leftovers.append(line)
                  self.assertEqual([], leftovers)


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Download pinned mkgmap r4924
        run: |
          curl -fsSLO https://www.mkgmap.org.uk/download/mkgmap-r4924.zip
          echo 'b2170799b61a95d4fc258e8e4fb4e21396809e0390789178f94c77109f8e0d84  mkgmap-r4924.zip' | sha256sum -c -
          unzip -q mkgmap-r4924.zip

      - name: Check production style with zero warnings
        run: |
          set -o pipefail
          java -jar mkgmap-r4924/mkgmap.jar --style-file=styles/uralla --check-styles 2>&1 | tee /tmp/style-check.log
          grep -q 'finished check-styles' /tmp/style-check.log
          if grep -q '^Warning:' /tmp/style-check.log; then
            echo 'mkgmap style warnings found'
            exit 1
          fi

      - name: Compile pruned authoritative TYP
        run: |
          set -o pipefail
          mkdir -p /tmp/typ-check
          (
            cd /tmp/typ-check
            java -jar "$GITHUB_WORKSPACE/mkgmap-r4924/mkgmap.jar" "$GITHUB_WORKSPACE/styles/uralla.txt" 2>&1 | tee /tmp/typ-check.log
          )
          if grep -q '^Warning:' /tmp/typ-check.log; then
            echo 'mkgmap TYP warnings found'
            exit 1
          fi
          test -n "$(find /tmp/typ-check -maxdepth 1 -name '*.typ' -print -quit)"

      - name: Run TYP closure and full regression tests
        run: |
          python -m pip install -e . pytest
          pytest -q tests/test_typ_usage.py
          pytest -q

      - name: Commit direct sources and remove one-shot helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla/lines styles/uralla/polygons styles/uralla/inc/name styles/uralla.txt tests/test_typ_usage.py
          git rm scripts/prune_typ_and_globalize_names.py .github/workflows/prune-typ-and-globalize-names-once.yml
          git commit -m "Prune unused TYP entries and globalize name abbreviations"
          git push origin HEAD:main
