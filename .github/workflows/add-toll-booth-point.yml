name: Product-store search carrier migration

on:
  push:
    paths:
      - '.github/workflows/add-toll-booth-point.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add native Garmin product-store search carrier
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          expected = {
              'styles/uralla/inc/priority_points': '00c4738826f4d50bfd40ae98f584c188651e703c',
              'styles/uralla.txt': 'b45042f79115563eb55e790e59933e7379bfce0f',
          }
          for path, sha in expected.items():
              got = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if got != sha:
                  raise SystemExit(f'{path}: expected {sha}, got {got}; aborting')

          p = Path('styles/uralla/inc/priority_points')
          s = p.read_text(encoding='utf-8')
          fuel_old = "uralla:fuel_rendered=yes & amenity=fuel & shop=convenience { name '${name} (продукты)' } [0x6504 resolution 24 continue]\n"
          fuel_native = "uralla:fuel_rendered=yes & amenity=fuel & shop=convenience { name '${name} (продукты)' } [0x2e02 resolution 24 continue]\n"
          if s.count(fuel_old) != 1:
              raise SystemExit('fuel convenience product-store rule changed unexpectedly')
          if fuel_native in s:
              raise SystemExit('fuel convenience native search carrier already present')
          s = s.replace(fuel_old, fuel_native + fuel_old, 1)

          anchor = '# Unnamed convenience shops stay visually unlabeled but expose "магазинчик" on hover.\n'
          product_native = '# Native Garmin product-store search carrier. Its TYP icon is transparent; continue lets\n# the same OSM object reach the visible custom 0x6504 LOD rules below.\n' + "(shop=supermarket | amenity=supermarket | shop=bakers | shop=bakery | shop=butcher | shop=convenience | shop=general | shop=grocery | shop=organic) { name '${name}' | 'продукты' } [0x2e02 resolution 24 continue]\n"
          if s.count(anchor) != 1:
              raise SystemExit('product-store insertion anchor changed unexpectedly')
          s = s.replace(anchor, anchor + product_native, 1)
          p.write_text(s, encoding='utf-8')

          typ_path = Path('styles/uralla.txt')
          typ = typ_path.read_text(encoding='utf-8')
          block_re = re.compile(r'(?ms)^\[_point\]\nType=0x02e\nSubType=0x02\n.*?^\[end\]')
          matches = list(block_re.finditer(typ))
          if len(matches) != 1:
              raise SystemExit(f'expected one 0x02e/0x02 TYP block, found {len(matches)}')
          block = matches[0].group(0)
          old_xpm = 'DayXpm="11 11 4 1"   Colormode=16\n"!\tc #FFFFFF"\n"#\tc #0000FF"\n"%\tc #000000"\n"  \tc none"\n"        !! "\n" !!!!!!!##!"\n"!#########!"\n"!#!#!#!#!! "\n"!#!#!#!#!  "\n"!#!#!#!#!  "\n"!#######!  "\n"!!!!!!!#!  "\n"!%%%%%%%%! "\n"!%%!!!!%%! "\n" !!    !!  "'
          new_xpm = 'DayXpm="1 1 1 1"   Colormode=16\n"  \tc none"\n" "'
          if block.count(old_xpm) != 1:
              raise SystemExit('0x2e02 product-store XPM changed unexpectedly')
          new_block = block.replace(old_xpm, new_xpm, 1)
          if 'String1=0x19,продукты' not in new_block or 'String2=0x04,grocery' not in new_block:
              raise SystemExit('0x2e02 search strings must be preserved')
          if 'FontStyle=NoLabel (invisible)' not in new_block:
              raise SystemExit('0x2e02 must remain NoLabel')
          typ = typ[:matches[0].start()] + new_block + typ[matches[0].end():]
          typ_path.write_text(typ, encoding='utf-8')

          out = p.read_text(encoding='utf-8')
          if out.count('[0x2e02 resolution 24 continue]') != 2:
              raise SystemExit('expected exactly two native 0x2e02 search-carrier rules')
          if out.count('0x6504') < 10:
              raise SystemExit('existing custom 0x6504 rendering rules appear damaged')
          typ_out = typ_path.read_text(encoding='utf-8')
          m = block_re.search(typ_out)
          if not m or 'DayXpm="1 1 1 1"' not in m.group(0):
              raise SystemExit('transparent 0x2e02 TYP bitmap not installed')
          if 'String1=0x19,продукты' not in m.group(0) or 'String2=0x04,grocery' not in m.group(0):
              raise SystemExit('native 0x2e02 search identity was damaged')
          print('product-store search-carrier checks passed')
          PY
      - name: Verify diff
        run: |
          git diff --check
          git diff --stat
          git status --short
      - name: Commit
        run: |
          git config user.name 'Alexey Klyanin'
          git config user.email '42924160+uralla@users.noreply.github.com'
          git add styles/uralla/inc/priority_points styles/uralla.txt
          git commit -m 'Restore Garmin product-store search with hidden native carrier'
          git push
