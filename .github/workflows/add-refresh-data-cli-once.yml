name: Add refresh-data CLI once

on:
  push:
    paths:
      - scripts/tools/add_refresh_data_cli_once.py
      - .github/workflows/add-refresh-data-cli-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wire refresh-data CLI
        run: python scripts/tools/add_refresh_data_cli_once.py
      - name: Run refresh-data tests
        run: |
          python -m pip install -e .
          python -m unittest tests.test_external_data -v
      - name: Commit CLI wiring
        shell: bash
        run: |
          if git diff --quiet -- uralla_build/cli.py; then
            echo "No CLI changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uralla_build/cli.py
          git commit -m "Expose supplemental data refresh command"
          git push origin HEAD:main
