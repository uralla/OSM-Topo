name: Run incremental regression tests once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-incremental-tests-once.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and pytest
        run: python -m pip install -e . pytest
      - name: Run incremental tests and full suite
        run: |
          pytest -q tests/test_incremental.py
          pytest -q
      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-incremental-tests-once.yml
          git commit -m "Complete incremental regression validation"
          git push origin HEAD:main
