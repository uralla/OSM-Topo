name: Remove dead embassy comment

"on":
  push:
    paths:
      - '.github/workflows/remove-dead-embassy-comment.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove dead embassy comment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('styles/uralla/points')
          text = p.read_text(encoding='utf-8')
          old = "#amenity=embassy & country=* { set name='${country} ${name|def:}' } [0x3003 resolution 24]\n"
          if old not in text:
              raise SystemExit('target embassy comment not found')
          p.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          rm .github/workflows/remove-dead-embassy-comment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla/points .github/workflows/remove-dead-embassy-comment.yml
          git commit -m "Remove dead embassy label comment"
          git pull --rebase origin main
          git push origin HEAD:main
