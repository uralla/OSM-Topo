name: Add long-name subtype breakdowns

on:
  push:
    paths:
      - '.github/workflows/add-long-name-subtype-breakdowns.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch audit and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('uralla_build/long_names_audit.py')
          text = path.read_text(encoding='utf-8')

          old = '''    examples_by_tag: dict[str, list[dict[str, object]]] = field(default_factory=lambda: defaultdict(list))\n    words: TermStats = field(default_factory=TermStats)\n'''
          new = '''    examples_by_tag: dict[str, list[dict[str, object]]] = field(default_factory=lambda: defaultdict(list))\n    memorial_by_type: Counter[str] = field(default_factory=Counter)\n    place_of_worship_by_religion: Counter[str] = field(default_factory=Counter)\n    examples_by_memorial_type: dict[str, list[dict[str, object]]] = field(default_factory=lambda: defaultdict(list))\n    examples_by_religion: dict[str, list[dict[str, object]]] = field(default_factory=lambda: defaultdict(list))\n    words: TermStats = field(default_factory=TermStats)\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    examples = state.examples_by_tag[tag]\n    if len(examples) < example_limit:\n        examples.append({"type": kind, "id": object_id, "length": len(name), "name": name})\n\n    words = significant_words(name)\n'''
          new = '''    example = {"type": kind, "id": object_id, "length": len(name), "name": name}\n    examples = state.examples_by_tag[tag]\n    if len(examples) < example_limit:\n        examples.append(example)\n\n    if tags.get("historic") == "memorial":\n        memorial_type = tags.get("memorial") or "<missing>"\n        state.memorial_by_type[memorial_type] += 1\n        subtype_examples = state.examples_by_memorial_type[memorial_type]\n        if len(subtype_examples) < example_limit:\n            subtype_examples.append(example)\n\n    if tags.get("amenity") == "place_of_worship":\n        religion = tags.get("religion") or "<missing>"\n        state.place_of_worship_by_religion[religion] += 1\n        religion_examples = state.examples_by_religion[religion]\n        if len(religion_examples) < example_limit:\n            religion_examples.append(example)\n\n    words = significant_words(name)\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''        "linear_by_tag": dict(state.linear_by_tag.most_common()),\n        "top_words": _term_rows(state.words, top),\n'''
          new = '''        "linear_by_tag": dict(state.linear_by_tag.most_common()),\n        "memorial_by_type": dict(state.memorial_by_type.most_common()),\n        "place_of_worship_by_religion": dict(state.place_of_worship_by_religion.most_common()),\n        "examples_by_memorial_type": dict(state.examples_by_memorial_type),\n        "examples_by_religion": dict(state.examples_by_religion),\n        "top_words": _term_rows(state.words, top),\n'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''    sections = ("by_kind", "by_geometry", "by_length", "by_primary_tag", "linear_by_tag")\n'''
          new = '''    sections = (\n        "by_kind", "by_geometry", "by_length", "by_primary_tag", "linear_by_tag",\n        "memorial_by_type", "place_of_worship_by_religion",\n    )\n'''
          assert old in text
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_long_names_audit.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = '''    def test_short_name_is_ignored(self) -> None:\n'''
          addition = '''    def test_tracks_memorial_subtype_and_religion_breakdowns(self) -> None:\n        state = AuditState()\n        memorial_name = "Мемориальный комплекс защитникам города в годы Великой Отечественной войны"\n        worship_name = "Храм во имя святого благоверного великого князя Александра Невского"\n        missing_name = "Очень длинное наименование памятного объекта без указанного подтипа"\n\n        add_name_to_state(\n            state,\n            name=memorial_name,\n            tags={"historic": "memorial", "memorial": "war_memorial", "name": memorial_name},\n            kind="node",\n            geometry="-",\n            object_id=10,\n        )\n        add_name_to_state(\n            state,\n            name=worship_name,\n            tags={"amenity": "place_of_worship", "religion": "christian", "name": worship_name},\n            kind="node",\n            geometry="-",\n            object_id=11,\n        )\n        add_name_to_state(\n            state,\n            name=missing_name,\n            tags={"historic": "memorial", "name": missing_name},\n            kind="node",\n            geometry="-",\n            object_id=12,\n        )\n\n        self.assertEqual(state.memorial_by_type["war_memorial"], 1)\n        self.assertEqual(state.memorial_by_type["<missing>"], 1)\n        self.assertEqual(state.place_of_worship_by_religion["christian"], 1)\n        self.assertEqual(state.examples_by_memorial_type["war_memorial"][0]["id"], 10)\n        self.assertEqual(state.examples_by_religion["christian"][0]["id"], 11)\n\n'''
          assert marker in tests
          tests = tests.replace(marker, addition + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

          python -m unittest tests.test_long_names_audit
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/add-long-name-subtype-breakdowns.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uralla_build/long_names_audit.py tests/test_long_names_audit.py .github/workflows/add-long-name-subtype-breakdowns.yml
          git commit -m "Add long-name subtype breakdowns"
          git pull --rebase origin main
          git push origin main
