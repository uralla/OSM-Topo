name: One-shot lake label abbreviation
on:
  push:
    paths:
      - '.github/workflows/one-shot-lake-label-abbrev.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('uralla_build/preprocessor.py')
          s = p.read_text()

          marker = '''_GEOGRAPHIC_PREFIX_PATTERNS: dict[str, tuple[re.Pattern[str], ...]] = {\n'''
          insert = '''_LAKE_LEADING_ABBREVIATIONS: tuple[tuple[re.Pattern[str], str], ...] = (\n    (re.compile(r"^(?:Большое|Большая|Большой|Большие)\\s+(.+?)$", re.IGNORECASE), "Бол. "),\n)\n\n\n'''
          assert marker in s
          s = s.replace(marker, insert + marker, 1)

          old = '''    for pattern in _GEOGRAPHIC_PREFIX_PATTERNS[label_class]:\n        match = pattern.fullmatch(label)\n        if not match:\n            continue\n        stripped = match.group(1).strip()\n        if stripped:\n            label = stripped\n        break\n\n    if label == name:\n'''
          new = '''    for pattern in _GEOGRAPHIC_PREFIX_PATTERNS[label_class]:\n        match = pattern.fullmatch(label)\n        if not match:\n            continue\n        stripped = match.group(1).strip()\n        if stripped:\n            label = stripped\n        break\n\n    if label_class == "lake":\n        for pattern, prefix in _LAKE_LEADING_ABBREVIATIONS:\n            match = pattern.fullmatch(label)\n            if not match:\n                continue\n            tail = match.group(1).strip()\n            if tail:\n                label = prefix + tail\n            break\n\n    if label == name:\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

          python3 - <<'PY'
          from uralla_build.preprocessor import enrich_geographic_label_tags

          cases = [
              ({'water': 'lake', 'name': 'озеро Большое Какашево'}, 'Бол. Какашево'),
              ({'water': 'lake', 'name': 'Большая Имандра'}, 'Бол. Имандра'),
              ({'water': 'reservoir', 'name': 'оз. Большой Кисегач'}, 'Бол. Кисегач'),
              ({'water': 'lake', 'name': 'озеро Светлое'}, 'Светлое'),
              ({'natural': 'peak', 'name': 'гора Большая Иремель'}, 'Большая Иремель'),
          ]
          for tags, expected in cases:
              result, _ = enrich_geographic_label_tags(tags)
              actual = result.get('uralla:label', tags['name'])
              assert actual == expected, (tags, actual, expected)
          PY
          python -m py_compile uralla_build/preprocessor.py
          git diff --check
          git diff -- uralla_build/preprocessor.py
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uralla_build/preprocessor.py
          git commit -m 'Abbreviate leading Большое in lake labels'
          git push
