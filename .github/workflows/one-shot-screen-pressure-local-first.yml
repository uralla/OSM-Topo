name: One-shot screen pressure local-first

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-screen-pressure-local-first.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch classifier and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('uralla_build/poi_context.py')
          s = p.read_text(encoding='utf-8')
          old = '''    if pressure_2km <= local_p25 and pressure_10km <= background_p25:\n        return "low"\n    if pressure_2km >= local_p75 and pressure_10km >= background_p75:\n        return "high"\n'''
          new = '''    # Screen pressure is intentionally local-first: the 2 km neighborhood\n    # represents immediate visual competition. The 10 km background is only a\n    # guard against calling a locally sparse pocket \"low\" inside an already\n    # very dense wider area.\n    if pressure_2km <= local_p25 and pressure_10km < background_p75:\n        return "low"\n    if pressure_2km >= local_p75 and pressure_10km >= background_p75:\n        return "high"\n'''
          assert old in s and new not in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('tests/test_poi_context.py')
          s = p.read_text(encoding='utf-8')
          old = '''        self.assertEqual(classify_screen_pressure(pressure_2km=10, pressure_10km=100, **kwargs), "low")\n        self.assertEqual(classify_screen_pressure(pressure_2km=50, pressure_10km=500, **kwargs), "medium")\n        self.assertEqual(classify_screen_pressure(pressure_2km=150, pressure_10km=1500, **kwargs), "high")\n'''
          new = '''        self.assertEqual(classify_screen_pressure(pressure_2km=10, pressure_10km=100, **kwargs), "low")\n        self.assertEqual(classify_screen_pressure(pressure_2km=10, pressure_10km=900, **kwargs), "low")\n        self.assertEqual(classify_screen_pressure(pressure_2km=10, pressure_10km=1000, **kwargs), "medium")\n        self.assertEqual(classify_screen_pressure(pressure_2km=50, pressure_10km=500, **kwargs), "medium")\n        self.assertEqual(classify_screen_pressure(pressure_2km=150, pressure_10km=1500, **kwargs), "high")\n        # Ai-Petri control shape: locally below p25, broad background below p75.\n        self.assertEqual(\n            classify_screen_pressure(\n                pressure_2km=131, pressure_10km=6793,\n                local_p25=207, local_p75=1343,\n                background_p25=2117, background_p75=7735,\n            ),\n            "low",\n        )\n'''
          assert old in s and 'Ai-Petri control shape' not in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python -m py_compile uralla_build/poi_context.py uralla_build/poi_lod.py uralla_build/preprocessor.py
          python -m unittest tests.test_poi_context tests.test_poi_lod -v
          git diff --check

      - name: Commit production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/poi_context.py tests/test_poi_context.py
          git commit -m 'Make screen pressure local-first'
          git push
