name: Cleanup address comments and oneway overlay

"on":
  push:
    paths:
      - ".github/workflows/cleanup-address-and-oneway.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('styles/uralla/points')
          s = p.read_text(encoding='utf-8')
          pattern = r'(?ms)^# ### Точки зданий с адресом для поиска\n.*?^# ###\n\n'
          s2, n = re.subn(pattern, '', s, count=1)
          assert n == 1, f'address comment block count={n}'
          p.write_text(s2, encoding='utf-8')

          p = Path('styles/uralla/lines')
          s = p.read_text(encoding='utf-8')
          old = "#####\n# дополнительный тип односторонних дорог со стрелками\nhighway=* & oneway=yes & highway!=construction & highway!=proposed [0x10f11 resolution 24 continue]\n\n"
          assert s.count(old) == 1, s.count(old)
          s = s.replace(old, '', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/cleanup-address-and-oneway.yml
      - name: Commit and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/points styles/uralla/lines .github/workflows/cleanup-address-and-oneway.yml
          git commit -m "Remove dead address rules and oneway overlay"
          git pull --rebase origin main
          git push
