name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Remove orphan POI TYP sections
        run: |
          python scripts/remove_unused_poi_typ_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles/uralla.txt
          git commit -m 'Remove unused nursing home and legacy cairn TYP points' || exit 0
          git push

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Audit style against TYP
        run: python scripts/tools/style-typ-audit.py
