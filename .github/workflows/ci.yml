name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply one-time embankment label patch
        run: |
          if [ -f scripts/typ_embankment_label_once.py ]; then
            python scripts/typ_embankment_label_once.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add styles/uralla.txt tests/test_typ_embankment_label.py
            git commit -m "Fix embankment TYP label"
            git push
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Audit style against TYP
        run: python scripts/tools/style-typ-audit.py
