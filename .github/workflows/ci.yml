name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync overlay regression expectations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python scripts/overlay_regression_fix_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_line_fallback_cleanup.py tests/test_tunnel_overlay_order.py
          git commit -m "Sync overlay regressions with ownership rules"
          git push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Audit style against TYP
        run: python scripts/tools/style-typ-audit.py
