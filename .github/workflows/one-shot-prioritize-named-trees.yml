name: One-shot prioritize named trees
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-prioritize-named-trees.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch named tree rules
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('styles/uralla/inc/priority_points')
          s = p.read_text(encoding='utf-8')
          old = '''# Unnamed trees/shrubs are map clutter; named ones continue to the existing rules.
natural=tree & name!=* { delete natural }
natural=shrub & name!=* { delete natural }
'''
          new = '''# Trees: a named tree is already a landmark in its own right, so its tree type wins
# over secondary tags such as tourism=attraction. Needle-leaved named trees use the
# conifer icon; broad-leaved or otherwise unspecified named trees use the tree icon.
# Unnamed trees stay completely out of POI rendering, including attraction fallback.
natural=tree & name=* & leaf_type=needleleaved { name '${name}' } [0x2c09 resolution 24]
natural=tree & name=* { name '${name}' } [0x2c08 resolution 24]
natural=tree & name!=* { delete natural; delete tourism }
natural=shrub & name!=* { delete natural }
'''
          assert old in s, 'expected tree block not found'
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          grep -q "natural=tree & name=\* & leaf_type=needleleaved.*0x2c09" styles/uralla/inc/priority_points
          grep -q "natural=tree & name=\*.*0x2c08" styles/uralla/inc/priority_points
          grep -q "natural=tree & name!=\* { delete natural; delete tourism }" styles/uralla/inc/priority_points
      - name: Commit production change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles/uralla/inc/priority_points
          git commit -m 'Prioritize named tree POIs over attractions'
          git push
