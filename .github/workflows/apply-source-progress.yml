name: Apply source progress
on:
  push:
    paths:
      - '.github/workflows/apply-source-progress.yml'
      - '.github/source_progress_patch.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply patch
        run: python .github/source_progress_patch.py
      - name: Validate agreed source progress change
        run: |
          python -m py_compile uralla_build/source.py
          python - <<'PY'
          from pathlib import Path
          text = Path('uralla_build/source.py').read_text(encoding='utf-8')
          assert '_DOWNLOAD_ATTEMPTS = 4' in text
          assert '_DOWNLOAD_BACKOFF_SECONDS = (5, 15, 30)' in text
          assert '_DOWNLOAD_TIMEOUT_SECONDS = 300' in text
          assert '_DOWNLOAD_READ_BLOCK = 1 * _MIB' in text
          assert 'connecting; server-response timeout' in text
          assert 'connected in {connected_after:.1f} s; remote size:' in text
          assert 'downloaded {_format_size(copied)} / {_format_size(expected)}' in text
          assert 'avg {_format_size(int(rate))}/s' in text
          assert 'max(4 * _MIB, expected // 20)' in text
          PY
      - name: Remove one-shot files
        run: rm .github/source_progress_patch.py .github/workflows/apply-source-progress.yml
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Improve source download progress logging'
          git push origin main
