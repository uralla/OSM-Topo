name: Fix TYP dummy line

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-dummy-line-typ.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace dummy line block
        shell: python
        run: |
          from pathlib import Path

          p = Path('styles/uralla.txt')
          s = p.read_text(encoding='utf-8')

          old = '''[_line]
          Type=0x1b
          ; Invisible routable carrier for abandoned/disused paved runways.
          UseOrientation=N
          Xpm="0 0 1 0"
          "1 c none"
          String1=0x19,заброшенная ВПП
          String2=0x04,abandoned runway routing
          ExtendedLabels=N
          [end]'''.replace('          ', '')

          new = '''[_line]
          Type=0x1b
          ;GRMN_TYPE: Roads/FERRY/Water or rail ferry/Non NT, NT
          UseOrientation=N
          LineWidth=1
          Xpm="0 0 1 0"
          "1 c #E6E6E6"
          String1=0x19,dummy line
          String2=0x04,dummy line
          ExtendedLabels=N
          [end]'''.replace('          ', '')

          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one target block, found {s.count(old)}')

          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-dummy-line-typ.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla.txt .github/workflows/fix-dummy-line-typ.yml
          git commit -m "Fix TYP dummy line definition"
          git pull --rebase origin main
          git push origin HEAD:main
