name: Add place anchor diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-place-anchor-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add settlement anchor diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          poi = Path('uralla_build/poi_context.py')
          text = poi.read_text(encoding='utf-8')

          text = text.replace(
              'TRANSIT_STOP_HIGHWAYS = frozenset({"bus_stop"})\n',
              'TRANSIT_STOP_HIGHWAYS = frozenset({"bus_stop"})\nSETTLEMENT_PLACE_VALUES = frozenset({"city", "town", "village", "hamlet"})\n'
          )

          marker = '''@dataclass(slots=True)\nclass ContextIndexes:\n    food: FoodShopIndex\n    accommodation: FoodShopIndex\n    transit: FoodShopIndex\n    activity: FoodShopIndex\n'''
          replacement = '''@dataclass(slots=True)\nclass PlaceAnchorIndex:\n    cells: dict[tuple[int, int], list[tuple[float, float, str, str | None]]]\n    anchor_count: int = 0\n\n    @classmethod\n    def empty(cls) -> "PlaceAnchorIndex":\n        return cls(defaultdict(list), 0)\n\n    @staticmethod\n    def _cell(lat: float, lon: float) -> tuple[int, int]:\n        return floor(lat / GRID_DEGREES), floor(lon / GRID_DEGREES)\n\n    def add(self, lat: float, lon: float, place_type: str, name: str | None) -> None:\n        self.cells[self._cell(lat, lon)].append((lat, lon, place_type, name))\n        self.anchor_count += 1\n\n    def nearest_within(\n        self, lat: float, lon: float, radius_km: float\n    ) -> tuple[float, str, str | None] | None:\n        lat_delta = radius_km / 110.574\n        lon_scale = max(111.320 * abs(cos(radians(lat))), 1.0)\n        lon_delta = radius_km / lon_scale\n        min_y = floor((lat - lat_delta) / GRID_DEGREES)\n        max_y = floor((lat + lat_delta) / GRID_DEGREES)\n        min_x = floor((lon - lon_delta) / GRID_DEGREES)\n        max_x = floor((lon + lon_delta) / GRID_DEGREES)\n        nearest: tuple[float, str, str | None] | None = None\n        for y in range(min_y, max_y + 1):\n            for x in range(min_x, max_x + 1):\n                for candidate_lat, candidate_lon, place_type, name in self.cells.get((y, x), ()):\n                    distance = _haversine_km(lat, lon, candidate_lat, candidate_lon)\n                    if distance <= radius_km and (nearest is None or distance < nearest[0]):\n                        nearest = (distance, place_type, name)\n        return nearest\n\n\n@dataclass(slots=True)\nclass ContextIndexes:\n    food: FoodShopIndex\n    accommodation: FoodShopIndex\n    transit: FoodShopIndex\n    activity: FoodShopIndex\n    places: PlaceAnchorIndex\n'''
          if marker not in text:
              raise SystemExit('ContextIndexes marker not found')
          text = text.replace(marker, replacement, 1)

          text = text.replace(
              '    activity = FoodShopIndex.empty()\n    for item in osmium.FileProcessor(source):',
              '    activity = FoodShopIndex.empty()\n    places = PlaceAnchorIndex.empty()\n    for item in osmium.FileProcessor(source):'
          )
          text = text.replace(
              '        if is_transit_stop(tags):\n            transit.add(*location)\n    return ContextIndexes(food, accommodation, transit, activity)\n',
              '        if is_transit_stop(tags):\n            transit.add(*location)\n        place_type = tags.get("place")\n        if place_type in SETTLEMENT_PLACE_VALUES:\n            places.add(*location, place_type, tags.get("name") or tags.get("name:ru"))\n    return ContextIndexes(food, accommodation, transit, activity, places)\n'
          )

          text = text.replace(
              '    index: FoodShopIndex,\n) -> tuple[dict[str, str], bool, dict[str, object] | None]:\n    """Attach general human-activity density diagnostics to context-aware POIs."""',
              '    index: FoodShopIndex,\n    places: PlaceAnchorIndex,\n) -> tuple[dict[str, str], bool, dict[str, object] | None]:\n    """Attach general human-activity density diagnostics to context-aware POIs."""',
              1
          )
          text = text.replace(
              '    activity_10km = index.count_cells_within_circle(lat, lon, 10.0)\n',
              '    activity_10km = index.count_cells_within_circle(lat, lon, 10.0)\n    nearest_place = places.nearest_within(lat, lon, 10.0)\n',
              1
          )
          text = text.replace(
              '        "activity_10km": activity_10km,\n        "lat": lat,\n',
              '        "activity_10km": activity_10km,\n        "place_distance_km": nearest_place[0] if nearest_place is not None else None,\n        "place_type": nearest_place[1] if nearest_place is not None else None,\n        "place_name": nearest_place[2] if nearest_place is not None else None,\n        "lat": lat,\n',
              1
          )
          poi.write_text(text, encoding='utf-8')

          pre = Path('uralla_build/preprocessor.py')
          text = pre.read_text(encoding='utf-8')
          text = text.replace(
              '    activity_index = context_indexes.activity\n',
              '    activity_index = context_indexes.activity\n    place_anchor_index = context_indexes.places\n'
          )
          text = text.replace(
              '        f"activity {activity_index.shop_count:,}; "\n',
              '        f"activity {activity_index.shop_count:,}; "\n        f"places {place_anchor_index.anchor_count:,}; "\n'
          )
          text = text.replace(
              '                    item, final_tags, activity_index\n',
              '                    item, final_tags, activity_index, place_anchor_index\n'
          )

          matrix_marker = '''            for context in ("remote", "settlement", "urban"):\n                _emit_progress(\n                    "POI activity matrix: "\n                    f"context={context}; "\n                    f"food={activity_kind_counts[(context, 'food')]:,}; "\n                    f"accommodation={activity_kind_counts[(context, 'accommodation')]:,}; "\n                    f"transit={activity_kind_counts[(context, 'transit')]:,}; "\n                    f"other={activity_kind_counts[(context, 'other')]:,}"\n                )\n\n'''
          addition = matrix_marker + '''            remote_place_bands: Counter[str] = Counter()\n            for sample in activity_context_samples:\n                context = classify_activity_context(\n                    activity_2km=int(sample["activity_2km"]),\n                    activity_10km=int(sample["activity_10km"]),\n                    local_p25=activity_2km_p25,\n                    local_p75=activity_2km_p75,\n                    background_p25=activity_10km_p25,\n                    background_p75=activity_10km_p75,\n                )\n                if context != "remote":\n                    continue\n                distance = sample.get("place_distance_km")\n                if distance is None:\n                    band = ">10km"\n                elif float(distance) <= 0.5:\n                    band = "<=0.5km"\n                elif float(distance) <= 1.0:\n                    band = "<=1km"\n                elif float(distance) <= 2.0:\n                    band = "<=2km"\n                elif float(distance) <= 5.0:\n                    band = "<=5km"\n                else:\n                    band = "<=10km"\n                remote_place_bands[band] += 1\n            _emit_progress(\n                "POI remote place proximity: "\n                f"<=0.5km={remote_place_bands['<=0.5km']:,}; "\n                f"<=1km={remote_place_bands['<=1km']:,}; "\n                f"<=2km={remote_place_bands['<=2km']:,}; "\n                f"<=5km={remote_place_bands['<=5km']:,}; "\n                f"<=10km={remote_place_bands['<=10km']:,}; "\n                f">10km={remote_place_bands['>10km']:,}"\n            )\n\n'''
          if matrix_marker not in text:
              raise SystemExit('activity matrix marker not found')
          text = text.replace(matrix_marker, addition, 1)

          text = text.replace(
              '''                            f"10km={sample.get('activity_10km')}"\n''',
              '''                            f"10km={sample.get('activity_10km')}; "\n                            f"place={sample.get('place_name')!r}; "\n                            f"place_type={sample.get('place_type')}; "\n                            f"place_km={float(sample['place_distance_km']):.2f if sample.get('place_distance_km') is not None else 'n/a'}"\n'''
          )
          # Python f-string format conditional above is invalid; use a helper-free expression.
          text = text.replace(
              '''f"place_km={float(sample['place_distance_km']):.2f if sample.get('place_distance_km') is not None else 'n/a'}"''',
              '''f"place_km={format(float(sample['place_distance_km']), '.2f') if sample.get('place_distance_km') is not None else 'n/a'}"'''
          )
          pre.write_text(text, encoding='utf-8')

          script = Path('scripts/test-poi-context.sh')
          s = script.read_text(encoding='utf-8')
          if 'POI remote place proximity:' not in s:
              s = s.replace('POI activity matrix:|POI activity sample:', 'POI activity matrix:|POI remote place proximity:|POI activity sample:')
          script.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python -m py_compile uralla_build/poi_context.py uralla_build/preprocessor.py
          python -m unittest tests.test_poi_context -v
          grep -q 'SETTLEMENT_PLACE_VALUES' uralla_build/poi_context.py
          grep -q 'POI remote place proximity:' uralla_build/preprocessor.py
          grep -q 'place_km=' uralla_build/preprocessor.py
          bash -n scripts/test-poi-context.sh

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/poi_context.py uralla_build/preprocessor.py scripts/test-poi-context.sh
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Add place anchor diagnostics for remote POIs'
            git push
          fi
