name: Cleanup unreachable line fallbacks once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-line-fallbacks-once.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch proven line fallbacks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('styles/uralla/lines')
          s = p.read_text(encoding='utf-8')

          legacy_pier = "# Legacy pier rule is kept as a fallback; inc/water_lines consumes normal pier tags first.\nman_made=pier { name 'пирс' } [0x10f07 resolution 24 continue]\n\n"
          if s.count(legacy_pier) != 1:
              raise SystemExit(f'legacy pier block count={s.count(legacy_pier)}')
          s = s.replace(legacy_pier, '', 1)

          old_narrow = """## недейств. ужд
          railway=narrow_gauge & disused=yes { name '${name} (недейств. ужд)' | 'недейств. ужд' }

          ## узкоколейка
          railway=narrow_gauge { name '${name} (ужд)' | 'ужд' }

          ## Разделяем ЖД с трамваями и выносим их в кастомные типы
          railway=abandoned | railway=disused | railway=* & disused=yes [0x1011a resolution 23-24]
          """.replace('          ', '')
          new_narrow = """## недейств. ужд
          railway=narrow_gauge & (disused=yes | abandoned=yes) { name '${name} (недейств. ужд)' | 'недейств. ужд' }

          ## Разделяем ЖД с трамваями и выносим их в кастомные типы
          railway=abandoned | railway=disused | railway=* & disused=yes | railway=* & abandoned=yes [0x1011a resolution 23-24]
          """.replace('          ', '')
          if old_narrow not in s:
              raise SystemExit('expected narrow-gauge legacy block not found')
          s = s.replace(old_narrow, new_narrow, 1)

          old_comment = '# cable_car is consumed in inc/water_lines and uses the native 0x2f line type.'
          new_comment = '# cable_car is consumed in inc/water_lines and uses the non-routable aerialway type 0x10f15.'
          if s.count(old_comment) != 1:
              raise SystemExit(f'old cable_car comment count={s.count(old_comment)}')
          s = s.replace(old_comment, new_comment, 1)

          p.write_text(s, encoding='utf-8', newline='')
          PY

      - name: Add regression tests
        run: |
          cat > tests/test_line_fallback_cleanup.py <<'PY'
          from pathlib import Path
          import unittest


          ROOT = Path(__file__).resolve().parents[1]
          STYLE = ROOT / 'styles' / 'uralla'
          LINES = STYLE / 'lines'
          WATER_LINES = STYLE / 'inc' / 'water_lines'


          class LineFallbackCleanupTests(unittest.TestCase):
              def test_pier_is_owned_only_by_water_lines(self) -> None:
                  lines = LINES.read_text(encoding='utf-8')
                  water = WATER_LINES.read_text(encoding='utf-8')
                  self.assertNotIn("man_made=pier { name 'пирс' } [0x10f07", lines)
                  self.assertIn("man_made=pier & is_closed()=false", water)
                  self.assertIn("[0x10f07 resolution 24 continue]", water)

              def test_active_narrow_gauge_is_owned_by_early_rule(self) -> None:
                  lines = LINES.read_text(encoding='utf-8')
                  water = WATER_LINES.read_text(encoding='utf-8')
                  self.assertIn(
                      "railway=narrow_gauge & disused!=yes & abandoned!=yes",
                      water,
                  )
                  self.assertNotIn(
                      "railway=narrow_gauge { name '${name} (ужд)' | 'ужд' }",
                      lines,
                  )

              def test_disused_and_abandoned_narrow_gauge_keep_specific_label(self) -> None:
                  lines = LINES.read_text(encoding='utf-8')
                  self.assertIn(
                      "railway=narrow_gauge & (disused=yes | abandoned=yes) { name '${name} (недейств. ужд)' | 'недейств. ужд' }",
                      lines,
                  )
                  self.assertIn("railway=* & abandoned=yes [0x1011a resolution 23-24]", lines)

              def test_cable_car_comment_matches_actual_type(self) -> None:
                  lines = LINES.read_text(encoding='utf-8')
                  water = WATER_LINES.read_text(encoding='utf-8')
                  self.assertIn('uses the non-routable aerialway type 0x10f15', lines)
                  self.assertIn('aerialway=cable_car', water)
                  self.assertIn('[0x10f15 resolution 22]', water)


          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Download pinned mkgmap r4924
        run: |
          curl -fsSLO https://www.mkgmap.org.uk/download/mkgmap-r4924.zip
          echo 'b2170799b61a95d4fc258e8e4fb4e21396809e0390789178f94c77109f8e0d84  mkgmap-r4924.zip' | sha256sum -c -
          unzip -q mkgmap-r4924.zip

      - name: Check style with zero warnings
        run: |
          set -o pipefail
          java -jar mkgmap-r4924/mkgmap.jar --style-file=styles/uralla --check-styles 2>&1 | tee /tmp/style.log
          grep -q 'finished check-styles' /tmp/style.log
          if grep -q '^Warning:' /tmp/style.log; then exit 1; fi

      - name: Run targeted and full tests
        run: |
          python -m pip install -e . pytest
          pytest -q tests/test_line_fallback_cleanup.py tests/test_water_structures_style.py tests/test_typ_usage.py
          pytest -q

      - name: Commit direct source and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla/lines tests/test_line_fallback_cleanup.py
          git rm .github/workflows/cleanup-line-fallbacks-once.yml
          git commit -m "Remove unreachable line fallbacks"
          git push origin HEAD:main
