name: Fix TYP transparent color

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-typ-transparent-color.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix transparent color definition
        shell: python
        run: |
          from pathlib import Path
          p = Path('styles/uralla.txt')
          s = p.read_text(encoding='utf-8')
          marker = 'Type=0x115\nSubType=0x0a\n'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('bicycle TYP block not found')
          end = s.find('[end]', start)
          if end < 0:
              raise SystemExit('bicycle TYP block end not found')
          block = s[start:end]
          old = '"  \tc none"'
          new = '" \tc none"'
          if block.count(old) != 1:
              raise SystemExit(f'expected one target in bicycle block, found {block.count(old)}')
          block = block.replace(old, new, 1)
          p.write_text(s[:start] + block + s[end:], encoding='utf-8')
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-typ-transparent-color.yml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla.txt .github/workflows/fix-typ-transparent-color.yml
          git commit -m "Fix TYP transparent color definition"
          git pull --rebase origin main
          git push origin HEAD:main
