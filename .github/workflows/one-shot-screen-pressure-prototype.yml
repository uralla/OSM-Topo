name: One-shot screen pressure prototype
on:
  push:
    paths:
      - '.github/workflows/one-shot-screen-pressure-prototype.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch prototype and test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('uralla_build/poi_context.py')
          s = p.read_text()
          s = s.replace(
              'POI_ACTIVITY_CONTEXT_TAG = "uralla:poi_activity_context"\n',
              'POI_ACTIVITY_CONTEXT_TAG = "uralla:poi_activity_context"\n'
              'POI_SCREEN_PRESSURE_TAG = "uralla:poi_screen_pressure"\n'
              'POI_SCREEN_PRESSURE_2KM_TAG = "uralla:poi_screen_pressure_2km"\n'
              'POI_SCREEN_PRESSURE_10KM_TAG = "uralla:poi_screen_pressure_10km"\n'
              'SCREEN_PRESSURE_PRIMARY_KEYS = frozenset({"amenity", "tourism", "shop", "historic", "natural", "man_made", "leisure", "highway", "railway", "aeroway", "craft", "emergency", "power", "barrier", "traffic_sign", "whitewater", "office", "landuse", "military", "sport", "place"})\n'
          )
          marker = '\ndef is_food_shop(tags: Mapping[str, str] | object) -> bool:\n'
          insert = '''\ndef screen_pressure_weight(tags: Mapping[str, str] | object) -> int:\n    """Approximate how much a node competes for Garmin screen space.\n\n    This deliberately ignores address/metadata-only nodes. A generic render-like POI\n    weighs 1, a named POI weighs 2, and settlement place labels weigh 4. The style\n    does not consume this signal yet; it is diagnostic while we validate the model.\n    """\n    items = tags.items() if isinstance(tags, Mapping) else iter(tags)  # type: ignore[arg-type]\n    values = {str(key): str(value) for key, value in items}\n    if not any(values.get(key) for key in SCREEN_PRESSURE_PRIMARY_KEYS):\n        return 0\n    if values.get("place") in SETTLEMENT_PLACE_VALUES:\n        return 4\n    return 2 if (values.get("name") or values.get("name:ru")) else 1\n\n\ndef classify_screen_pressure(\n    *,\n    pressure_2km: int,\n    pressure_10km: int,\n    local_p25: int,\n    local_p75: int,\n    background_p25: int,\n    background_p75: int,\n) -> str:\n    if pressure_2km <= local_p25 and pressure_10km <= background_p25:\n        return "low"\n    if pressure_2km >= local_p75 and pressure_10km >= background_p75:\n        return "high"\n    return "medium"\n\n'''
          assert marker in s
          s = s.replace(marker, insert + marker, 1)

          marker = '\n@dataclass(slots=True)\nclass PlaceAnchorIndex:'
          weighted = '''\n@dataclass(slots=True)\nclass WeightedPointIndex:\n    cells: dict[tuple[int, int], list[tuple[float, float, int]]]\n    point_count: int = 0\n    total_weight: int = 0\n\n    @classmethod\n    def empty(cls) -> "WeightedPointIndex":\n        return cls(defaultdict(list), 0, 0)\n\n    @staticmethod\n    def _cell(lat: float, lon: float) -> tuple[int, int]:\n        return floor(lat / GRID_DEGREES), floor(lon / GRID_DEGREES)\n\n    def add(self, lat: float, lon: float, weight: int) -> None:\n        if weight <= 0:\n            return\n        self.cells[self._cell(lat, lon)].append((lat, lon, int(weight)))\n        self.point_count += 1\n        self.total_weight += int(weight)\n\n    def score_within(self, lat: float, lon: float, radius_km: float) -> int:\n        lat_delta = radius_km / 110.574\n        lon_scale = max(111.320 * abs(cos(radians(lat))), 1.0)\n        lon_delta = radius_km / lon_scale\n        min_y = floor((lat - lat_delta) / GRID_DEGREES)\n        max_y = floor((lat + lat_delta) / GRID_DEGREES)\n        min_x = floor((lon - lon_delta) / GRID_DEGREES)\n        max_x = floor((lon + lon_delta) / GRID_DEGREES)\n        total = 0\n        for y in range(min_y, max_y + 1):\n            for x in range(min_x, max_x + 1):\n                for candidate_lat, candidate_lon, weight in self.cells.get((y, x), ()):\n                    if _haversine_km(lat, lon, candidate_lat, candidate_lon) <= radius_km:\n                        total += weight\n        return total\n\n    def score_cells_within_circle(self, lat: float, lon: float, radius_km: float) -> int:\n        lat_delta = radius_km / 110.574\n        lon_scale = max(111.320 * abs(cos(radians(lat))), 1.0)\n        lon_delta = radius_km / lon_scale\n        min_y = floor((lat - lat_delta) / GRID_DEGREES)\n        max_y = floor((lat + lat_delta) / GRID_DEGREES)\n        min_x = floor((lon - lon_delta) / GRID_DEGREES)\n        max_x = floor((lon + lon_delta) / GRID_DEGREES)\n        total = 0\n        for y in range(min_y, max_y + 1):\n            center_lat = (y + 0.5) * GRID_DEGREES\n            for x in range(min_x, max_x + 1):\n                center_lon = (x + 0.5) * GRID_DEGREES\n                if _haversine_km(lat, lon, center_lat, center_lon) <= radius_km:\n                    total += sum(weight for _lat, _lon, weight in self.cells.get((y, x), ()))\n        return total\n\n'''
          assert marker in s
          s = s.replace(marker, weighted + marker, 1)

          s = s.replace(
              '    activity: FoodShopIndex\n    places: PlaceAnchorIndex\n',
              '    activity: FoodShopIndex\n    screen_pressure: WeightedPointIndex\n    places: PlaceAnchorIndex\n',
              1,
          )
          s = s.replace(
              '    activity = FoodShopIndex.empty()\n    places = PlaceAnchorIndex.empty()\n',
              '    activity = FoodShopIndex.empty()\n    screen_pressure = WeightedPointIndex.empty()\n    places = PlaceAnchorIndex.empty()\n',
              1,
          )
          s = s.replace(
              '        if is_meaningful_context_node(tags):\n            activity.add(*location)\n',
              '        if is_meaningful_context_node(tags):\n            activity.add(*location)\n        pressure_weight = screen_pressure_weight(tags)\n        if pressure_weight:\n            screen_pressure.add(*location, pressure_weight)\n',
              1,
          )
          s = s.replace(
              '    return ContextIndexes(food, accommodation, transit, activity, places, adaptive_candidates)\n',
              '    return ContextIndexes(food, accommodation, transit, activity, screen_pressure, places, adaptive_candidates)\n',
              1,
          )

          old_sig = '''    index: FoodShopIndex,\n    places: PlaceAnchorIndex,\n    thresholds: Mapping[str, int] | None = None,\n) -> tuple[dict[str, str], bool, dict[str, object] | None]:'''
          new_sig = '''    index: FoodShopIndex,\n    places: PlaceAnchorIndex,\n    thresholds: Mapping[str, int] | None = None,\n    screen_index: WeightedPointIndex | None = None,\n    screen_thresholds: Mapping[str, int] | None = None,\n) -> tuple[dict[str, str], bool, dict[str, object] | None]:'''
          assert old_sig in s
          s = s.replace(old_sig, new_sig, 1)
          old = '        desired[POI_ACTIVITY_CONTEXT_TAG] = final_context\n    changed = any(result.get(key) != value for key, value in desired.items())\n'
          new = '''        desired[POI_ACTIVITY_CONTEXT_TAG] = final_context\n    screen_2km = None\n    screen_10km = None\n    screen_context = None\n    if screen_index is not None:\n        screen_2km = screen_index.score_within(lat, lon, 2.0)\n        screen_10km = screen_index.score_cells_within_circle(lat, lon, 10.0)\n        desired[POI_SCREEN_PRESSURE_2KM_TAG] = str(screen_2km)\n        desired[POI_SCREEN_PRESSURE_10KM_TAG] = str(screen_10km)\n        if screen_thresholds is not None:\n            screen_context = classify_screen_pressure(\n                pressure_2km=screen_2km,\n                pressure_10km=screen_10km,\n                local_p25=int(screen_thresholds["2km_p25"]),\n                local_p75=int(screen_thresholds["2km_p75"]),\n                background_p25=int(screen_thresholds["10km_p25"]),\n                background_p75=int(screen_thresholds["10km_p75"]),\n            )\n            desired[POI_SCREEN_PRESSURE_TAG] = screen_context\n    changed = any(result.get(key) != value for key, value in desired.items())\n'''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace(
              '        "activity_10km": activity_10km,\n',
              '        "activity_10km": activity_10km,\n        "screen_pressure_2km": screen_2km,\n        "screen_pressure_10km": screen_10km,\n        "screen_pressure": screen_context,\n',
              1,
          )
          p.write_text(s)

          p = Path('uralla_build/preprocessor.py')
          s = p.read_text()
          s = s.replace(
              '    classify_activity_context_with_place_guard,\n',
              '    classify_activity_context_with_place_guard,\n    classify_screen_pressure,\n',
              1,
          )
          s = s.replace(
              '    activity_index = context_indexes.activity\n    place_anchor_index = context_indexes.places\n',
              '    activity_index = context_indexes.activity\n    screen_pressure_index = context_indexes.screen_pressure\n    place_anchor_index = context_indexes.places\n',
              1,
          )
          old = '''    activity_thresholds = {\n        "2km_p25": _activity_percentile(candidate_activity_2km, 0.25),\n        "2km_p75": _activity_percentile(candidate_activity_2km, 0.75),\n        "10km_p25": _activity_percentile(candidate_activity_10km, 0.25),\n        "10km_p75": _activity_percentile(candidate_activity_10km, 0.75),\n    }\n'''
          new = old + '''    candidate_screen_2km: list[int] = []\n    candidate_screen_10km: list[int] = []\n    for _candidate_id, candidate_lat, candidate_lon in context_indexes.adaptive_candidates:\n        candidate_screen_2km.append(screen_pressure_index.score_within(candidate_lat, candidate_lon, 2.0))\n        candidate_screen_10km.append(screen_pressure_index.score_cells_within_circle(candidate_lat, candidate_lon, 10.0))\n    screen_thresholds = {\n        "2km_p25": _activity_percentile(candidate_screen_2km, 0.25),\n        "2km_p75": _activity_percentile(candidate_screen_2km, 0.75),\n        "10km_p25": _activity_percentile(candidate_screen_10km, 0.25),\n        "10km_p75": _activity_percentile(candidate_screen_10km, 0.75),\n    }\n'''
          assert old in s
          s = s.replace(old, new, 1)
          marker = '    _emit_progress(\n        "POI context: one-pass index complete; "\n'
          insert = '''    _emit_progress(\n        "POI screen pressure thresholds ready before writer; "\n        f"samples {len(context_indexes.adaptive_candidates):,}; "\n        f"2km p25={screen_thresholds['2km_p25']} p75={screen_thresholds['2km_p75']}; "\n        f"10km p25={screen_thresholds['10km_p25']} p75={screen_thresholds['10km_p75']}"\n    )\n'''
          assert marker in s
          s = s.replace(marker, insert + marker, 1)
          s = s.replace(
              '        f"activity {activity_index.shop_count:,}; "\n        f"places {place_anchor_index.anchor_count:,}; "\n',
              '        f"activity {activity_index.shop_count:,}; "\n        f"screen {screen_pressure_index.point_count:,}/{screen_pressure_index.total_weight:,}w; "\n        f"places {place_anchor_index.anchor_count:,}; "\n',
              1,
          )
          s = s.replace(
              '                    item, final_tags, activity_index, place_anchor_index, activity_thresholds\n',
              '                    item, final_tags, activity_index, place_anchor_index, activity_thresholds, screen_pressure_index, screen_thresholds\n',
              1,
          )
          old = '''                        solnyshko_accommodation_sample["activity_10km"] = activity_sample["activity_10km"]\n'''
          new = old + '''                        solnyshko_accommodation_sample["screen_pressure_2km"] = activity_sample["screen_pressure_2km"]\n                        solnyshko_accommodation_sample["screen_pressure_10km"] = activity_sample["screen_pressure_10km"]\n                        solnyshko_accommodation_sample["screen_pressure"] = activity_sample["screen_pressure"]\n'''
          assert old in s
          s = s.replace(old, new, 1)

          marker = '        if activity_500m_values:\n'
          insert = '''        if candidate_screen_2km:\n            screen_counts = Counter(\n                classify_screen_pressure(\n                    pressure_2km=p2, pressure_10km=p10,\n                    local_p25=screen_thresholds["2km_p25"], local_p75=screen_thresholds["2km_p75"],\n                    background_p25=screen_thresholds["10km_p25"], background_p75=screen_thresholds["10km_p75"],\n                )\n                for p2, p10 in zip(candidate_screen_2km, candidate_screen_10km)\n            )\n            _emit_progress(\n                "POI screen pressure: "\n                f"samples {len(candidate_screen_2km):,}; "\n                f"2km p25={screen_thresholds['2km_p25']} p50={_activity_percentile(candidate_screen_2km, 0.50)} p75={screen_thresholds['2km_p75']} p90={_activity_percentile(candidate_screen_2km, 0.90)}; "\n                f"10km p25={screen_thresholds['10km_p25']} p50={_activity_percentile(candidate_screen_10km, 0.50)} p75={screen_thresholds['10km_p75']} p90={_activity_percentile(candidate_screen_10km, 0.90)}; "\n                f"low={screen_counts['low']:,}; medium={screen_counts['medium']:,}; high={screen_counts['high']:,}"\n            )\n            if solnyshko_accommodation_sample is not None:\n                _emit_progress(\n                    "POI screen pressure named check: 'Солнышко'; "\n                    f"id={solnyshko_accommodation_sample.get('id')}; "\n                    f"priority={solnyshko_accommodation_sample.get('priority')}; "\n                    f"2km={solnyshko_accommodation_sample.get('screen_pressure_2km')}; "\n                    f"10km={solnyshko_accommodation_sample.get('screen_pressure_10km')}; "\n                    f"pressure={solnyshko_accommodation_sample.get('screen_pressure')}; "\n                    f"activity2km={solnyshko_accommodation_sample.get('activity_2km')}; "\n                    f"activity10km={solnyshko_accommodation_sample.get('activity_10km')}"\n                )\n\n'''
          assert marker in s
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)

          p = Path('tests/test_poi_context.py')
          s = p.read_text()
          s = s.replace(
              '    FoodShopIndex,\n',
              '    FoodShopIndex,\n    WeightedPointIndex,\n',
              1,
          )
          s = s.replace(
              '    classify_food_shop,\n',
              '    classify_food_shop,\n    classify_screen_pressure,\n',
              1,
          )
          s = s.replace(
              '    is_meaningful_context_node,\n',
              '    is_meaningful_context_node,\n    screen_pressure_weight,\n',
              1,
          )
          marker = '    def test_activity_context_classifier(self) -> None:\n'
          tests = '''    def test_screen_pressure_weights(self) -> None:\n        self.assertEqual(screen_pressure_weight({"addr:housenumber": "3"}), 0)\n        self.assertEqual(screen_pressure_weight({"amenity": "toilets"}), 1)\n        self.assertEqual(screen_pressure_weight({"tourism": "hotel", "name": "Солнышко"}), 2)\n        self.assertEqual(screen_pressure_weight({"place": "village", "name": "Тест"}), 4)\n\n    def test_screen_pressure_classifier(self) -> None:\n        kwargs = dict(local_p25=20, local_p75=100, background_p25=200, background_p75=1000)\n        self.assertEqual(classify_screen_pressure(pressure_2km=10, pressure_10km=100, **kwargs), "low")\n        self.assertEqual(classify_screen_pressure(pressure_2km=50, pressure_10km=500, **kwargs), "medium")\n        self.assertEqual(classify_screen_pressure(pressure_2km=150, pressure_10km=1500, **kwargs), "high")\n\n    def test_weighted_screen_pressure_index(self) -> None:\n        index = WeightedPointIndex.empty()\n        index.add(55.0000, 60.0000, 2)\n        index.add(55.0100, 60.0000, 4)\n        index.add(55.1000, 60.0000, 10)\n        self.assertEqual(index.score_within(55.0000, 60.0000, 2.0), 6)\n\n'''
          assert marker in s
          s = s.replace(marker, tests + marker, 1)
          p.write_text(s)
          PY
          python3 -m py_compile uralla_build/poi_context.py uralla_build/preprocessor.py
          python3 -m unittest tests.test_poi_context -v
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uralla_build/poi_context.py uralla_build/preprocessor.py tests/test_poi_context.py
          git commit -m 'Prototype weighted POI screen pressure'
          git push
