name: Check platform routing once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-platform-routing-once.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned mkgmap r4924
        run: |
          curl -fsSLO https://www.mkgmap.org.uk/download/mkgmap-r4924.zip
          echo 'b2170799b61a95d4fc258e8e4fb4e21396809e0390789178f94c77109f8e0d84  mkgmap-r4924.zip' | sha256sum -c -
          unzip -q mkgmap-r4924.zip

      - name: Check uralla style with no warnings
        run: |
          set -o pipefail
          java -jar mkgmap-r4924/mkgmap.jar --style-file=styles/uralla --check-styles 2>&1 | tee /tmp/check-styles.log
          grep -q 'finished check-styles' /tmp/check-styles.log
          if grep -q '^Warning:' /tmp/check-styles.log; then
            echo 'mkgmap style warnings found'
            exit 1
          fi

      - name: Run targeted and full tests
        run: |
          python -m pip install -e . pytest
          pytest -q tests/test_platform_routing_style.py
          pytest -q

      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/check-platform-routing-once.yml
          git commit -m "Complete platform routing validation"
          git push origin HEAD:main
