name: One-shot clean LOD labels
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-clean-lod-labels.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact patch
        run: python3 scripts/cleanup-lod-debug-labels.py
      - name: Validate
        run: |
          git diff --check
          grep -q "shop=convenience & name!=\*.*label:2='магазинчик'" styles/uralla/inc/priority_points
          ! grep -q "name '\${name} \[H\]'" styles/uralla/inc/priority_points
          ! grep -q "name '\${name} \[M\]'" styles/uralla/inc/priority_points
          ! grep -q "name '\${name} \[L\]'" styles/uralla/inc/priority_points
          ! grep -q "name '\${name} \[H\]'" styles/uralla/points
          ! grep -q "name '\${name} \[M\]'" styles/uralla/points
          ! grep -q "name '\${name} \[L\]'" styles/uralla/points
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles/uralla/inc/priority_points styles/uralla/points
          git commit -m 'Remove LOD debug labels and add convenience hover text'
          git push
