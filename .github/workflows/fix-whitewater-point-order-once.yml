name: Fix whitewater point order once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-whitewater-point-order-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put combined whitewater access point first
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('styles/uralla/points')
          s = p.read_text(encoding='utf-8')
          old = (
              "whitewater=egress\t  [0x6514 resolution 24]\n"
              "whitewater=put_in\t  [0x6515 resolution 24]\n"
              "whitewater=put_in & whitewater=egress [0x6516 resolution 24]\n"
          )
          new = (
              "# Combined access point must precede the single-tag fallbacks.\n"
              "whitewater=put_in & whitewater=egress [0x6516 resolution 24]\n"
              "whitewater=egress\t  [0x6514 resolution 24]\n"
              "whitewater=put_in\t  [0x6515 resolution 24]\n"
          )
          if s.count(old) != 1:
              raise SystemExit(f'expected one whitewater access block, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='')
          PY

      - name: Download pinned mkgmap r4924
        run: |
          curl -fsSLO https://www.mkgmap.org.uk/download/mkgmap-r4924.zip
          echo 'b2170799b61a95d4fc258e8e4fb4e21396809e0390789178f94c77109f8e0d84  mkgmap-r4924.zip' | sha256sum -c -
          unzip -q mkgmap-r4924.zip

      - name: Check style and tests
        run: |
          set -o pipefail
          java -jar mkgmap-r4924/mkgmap.jar --style-file=styles/uralla --check-styles 2>&1 | tee /tmp/style.log
          grep -q 'finished check-styles' /tmp/style.log
          if grep -q '^Warning:' /tmp/style.log; then exit 1; fi
          python -m pip install -e . pytest
          pytest -q tests/test_whitewater_points_style.py tests/test_typ_usage.py
          pytest -q

      - name: Commit direct style and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla/points tests/test_whitewater_points_style.py
          git rm .github/workflows/fix-whitewater-point-order-once.yml
          git commit -m "Fix combined whitewater point precedence"
          git push origin HEAD:main
