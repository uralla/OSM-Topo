name: Audit railway POI TYP once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-rail-poi-typ-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print railway POI TYP metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          raw = Path('styles/uralla.txt').read_bytes()
          try:
              text = raw.decode('utf-8')
          except UnicodeDecodeError:
              text = raw.decode('cp1251')
          sec_rx = re.compile(r'(?ims)^\[_point\]\s*\n.*?^\[end\]\s*(?:\n|$)')
          targets = {'0x2f17', '0x11601', '0x2f08', '0x1613', '0x1614'}
          for m in sec_rx.finditer(text):
              block = m.group(0)
              tm = re.search(r'(?im)^Type=(0x[0-9a-f]+)\b', block)
              sm = re.search(r'(?im)^SubType=(0x[0-9a-f]+)\b', block)
              if not tm:
                  continue
              typ = tm.group(1).lower()
              combined = typ
              if sm:
                  base = int(typ, 16)
                  combined = f'0x{base:x}{int(sm.group(1),16):02x}'
              if typ not in targets and combined not in targets:
                  continue
              print('---', typ, 'combined', combined)
              for line in block.splitlines():
                  if re.match(r'(?i)^(Type|SubType|String\d*|ExtendedLabels|FontStyle|DayXpm|Xpm)=', line):
                      print(line)
          PY

      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/audit-rail-poi-typ-once.yml
          git commit -m "Remove one-shot railway POI audit"
          git push origin HEAD:main
