name: Check workspace launcher architecture once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-workspace-launcher-once.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate setup shell and pointer removal
        run: |
          bash -n setup.sh
          if grep -R --exclude-dir=.git --exclude=check-workspace-launcher-once.yml -n '\.uralla-host' .; then
            echo 'obsolete .uralla-host reference remains'
            exit 1
          fi

      - name: Install project tests
        run: python -m pip install -e . pytest

      - name: Run launcher and host tests
        run: |
          pytest -q tests/test_workspace_launcher.py tests/test_host.py tests/test_bootstrap.py

      - name: Run full suite
        run: pytest -q

      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/check-workspace-launcher-once.yml
          git commit -m "Complete workspace launcher validation"
          git push origin HEAD:main
