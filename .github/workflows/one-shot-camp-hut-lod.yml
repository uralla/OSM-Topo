name: One-shot camp hover and hut LOD

on:
  push:
    paths:
      - '.github/workflows/one-shot-camp-hut-lod.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply camp and hut fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('styles/uralla/points')
          text = path.read_text(encoding='utf-8')
          old = '''# Camps keep one dedicated icon across the whole useful range. Named camps show\n# their real name; unnamed camps stay visually clean and expose "кемпинг" on hover.\ntourism=camp_site & name=* { name '${name}' } [0x2b03 resolution 22]\ntourism=camp_site & name!=* { set mkgmap:label:1=' '; set mkgmap:label:2='кемпинг' } [0x2b03 resolution 22]\n'''
          new = '''# Camps keep one dedicated NoLabel icon across the whole useful range. The TYP\n# suppresses permanent map text, so an ordinary fallback remains available in\n# Garmin object info/hover for unnamed camps.\ntourism=camp_site { name '${name}' | 'кемпинг' } [0x2b03 resolution 22]\n'''
          if old not in text:
              raise SystemExit('camp_site rule block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('styles/uralla/inc/priority_points')
          text = path.read_text(encoding='utf-8')
          old = '''amenity=shelter & mkgmap:area2poi!=true [0x2b05 resolution 23]\n(tourism=wilderness_hut | tourism=alpine_hut) [0x2b07 resolution 23]\n'''
          new = '''amenity=shelter & mkgmap:area2poi!=true [0x2b05 resolution 23]\nuralla:poi_lod_class=H & (tourism=wilderness_hut | tourism=alpine_hut) { name '${name}' | 'избушка' } [0x2b07 resolution 22]\nuralla:poi_lod_class=M & (tourism=wilderness_hut | tourism=alpine_hut) { name '${name}' | 'избушка' } [0x2b07 resolution 23]\nuralla:poi_lod_class=L & (tourism=wilderness_hut | tourism=alpine_hut) { name '${name}' | 'избушка' } [0x2b07 resolution 24]\n(tourism=wilderness_hut | tourism=alpine_hut) { name '${name}' | 'избушка' } [0x2b07 resolution 23]\n'''
          if old not in text:
              raise SystemExit('hut rule block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('uralla_build/poi_context.py')
          text = path.read_text(encoding='utf-8')
          old = 'ACCOMMODATION_VALUES = frozenset({"hotel", "hostel", "guest_house"})\n'
          new = 'ACCOMMODATION_VALUES = frozenset({"hotel", "hostel", "guest_house", "wilderness_hut", "alpine_hut"})\n'
          if old not in text:
              raise SystemExit('ACCOMMODATION_VALUES target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('uralla_build/poi_context_analysis.py')
          text = path.read_text(encoding='utf-8')
          old = 'SCHEMA_VERSION = 2\n'
          new = 'SCHEMA_VERSION = 3\n'
          if old not in text:
              raise SystemExit('poi context schema target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('uralla_build/preprocess_fast.py')
          text = path.read_text(encoding='utf-8')
          old = 'ANALYSIS_MANIFEST_SCHEMA = 6\n'
          new = 'ANALYSIS_MANIFEST_SCHEMA = 7\n'
          if old not in text:
              raise SystemExit('analysis manifest schema target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_camp_hut_lod.py')
          test.write_text('''from pathlib import Path\nimport unittest\n\nfrom uralla_build.poi_context import ACCOMMODATION_VALUES, is_accommodation\n\n\nclass CampAndHutLodTests(unittest.TestCase):\n    def test_camp_site_uses_hover_fallback_name(self) -> None:\n        text = Path("styles/uralla/points").read_text(encoding="utf-8")\n        self.assertIn("tourism=camp_site { name '${name}' | 'кемпинг' } [0x2b03 resolution 22]", text)\n        self.assertNotIn("mkgmap:label:2='кемпинг'", text)\n\n    def test_huts_are_accommodation_candidates(self) -> None:\n        self.assertIn("wilderness_hut", ACCOMMODATION_VALUES)\n        self.assertIn("alpine_hut", ACCOMMODATION_VALUES)\n        self.assertTrue(is_accommodation({"tourism": "wilderness_hut"}))\n        self.assertTrue(is_accommodation({"tourism": "alpine_hut"}))\n\n    def test_huts_have_hml_style_rules(self) -> None:\n        text = Path("styles/uralla/inc/priority_points").read_text(encoding="utf-8")\n        name_expr = "{ name '$" + "{name}' | 'избушка' }"\n        for lod, resolution in (("H", 22), ("M", 23), ("L", 24)):\n            expected = (\n                f"uralla:poi_lod_class={lod} & (tourism=wilderness_hut | tourism=alpine_hut) "\n                + name_expr\n                + f" [0x2b07 resolution {resolution}]"\n            )\n            self.assertIn(expected, text)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Run focused tests
        run: python -m unittest tests.test_camp_hut_lod -v

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+uralla@users.noreply.github.com"
          git add styles/uralla/points styles/uralla/inc/priority_points uralla_build/poi_context.py uralla_build/poi_context_analysis.py uralla_build/preprocess_fast.py tests/test_camp_hut_lod.py
          git commit -m "Add camp hover fallback and adaptive hut LOD"
          git push
