name: Cleanup legacy information rules
on:
  push:
    paths:
      - .github/workflows/cleanup-information.yml
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy information rules
        shell: python
        run: |
          from pathlib import Path
          path = Path('styles/uralla/points')
          text = path.read_text(encoding='utf-8')
          old = """# Route guideposts are strong navigation anchors; simple route markers stay close-zoom only.\ntourism=information & information=guidepost {name '${name}' | '${ref}' | 'указатель'} [0x4c00 resolution 23]\ntourism=information & (information=route_marker | information=trail_blaze) {name '${name}' | '${ref}' | 'маркер'} [0x4c00 resolution 24]\ntourism=information {name '${name}' | 'информация'} [0x4c00 resolution 24]\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy information block, found {text.count(old)}')
          path.write_text(text.replace(old, ''), encoding='utf-8')
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/cleanup-information.yml
          git add styles/uralla/points
          git commit -m "Remove legacy information POI rules"
          git push
