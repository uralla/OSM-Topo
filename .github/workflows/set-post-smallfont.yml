name: Set post POI SmallFont

on:
  push:
    paths:
      - '.github/workflows/set-post-smallfont.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set 0x2f05 labels to SmallFont
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('styles/uralla.txt')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'(?ms)(^\[_point\]\nType=0x02f\nSubType=0x05\n.*?^FontStyle=)NoLabel \(invisible\)(\n.*?^\[end\])')
          updated, count = pattern.subn(r'\1SmallFont\2', text)
          if count != 1:
              raise SystemExit(f'expected exactly one 0x2f05 NoLabel section, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit TYP update and remove workflow
        run: |
          rm .github/workflows/set-post-smallfont.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles/uralla.txt .github/workflows/set-post-smallfont.yml
          git commit -m 'Show post POI labels with SmallFont'
          git push
