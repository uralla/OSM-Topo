name: Debug Solnyshko neighbors
on:
  push:
    paths:
      - '.github/workflows/debug-solnyshko-neighbors.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('uralla_build/poi_context.py')
          s = p.read_text()
          anchor = '''def enrich_accommodation_context(\n'''
          helper = '''def nearest_accommodation_details(\n    source: str,\n    osmium: Any,\n    lat: float,\n    lon: float,\n    limit: int = 20,\n) -> list[dict[str, object]]:\n    \"\"\"Diagnostic-only full scan returning nearest node accommodations.\"\"\"\n\n    rows: list[dict[str, object]] = []\n    for item in osmium.FileProcessor(source):\n        if not is_accommodation(item.tags):\n            continue\n        location = valid_node_location(item)\n        if location is None:\n            continue\n        candidate_lat, candidate_lon = location\n        distance_km = _haversine_km(lat, lon, candidate_lat, candidate_lon)\n        tags = {str(key): str(value) for key, value in item.tags}\n        rows.append(\n            {\n                \"id\": int(getattr(item, \"id\", 0)),\n                \"name\": tags.get(\"name\"),\n                \"tourism\": tags.get(\"tourism\"),\n                \"lat\": candidate_lat,\n                \"lon\": candidate_lon,\n                \"distance_km\": distance_km,\n            }\n        )\n    rows.sort(key=lambda row: float(row[\"distance_km\"]))\n    return rows[:limit]\n\n\n'''
          if 'def nearest_accommodation_details(' not in s:
              s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s)

          p = Path('uralla_build/preprocessor.py')
          s = p.read_text()
          old_import = '''    enrich_food_shop_context,\n    enrich_transit_stop_context,\n)'''
          new_import = '''    enrich_food_shop_context,\n    enrich_transit_stop_context,\n    nearest_accommodation_details,\n)'''
          s = s.replace(old_import, new_import, 1)

          old = '''        if solnyshko_accommodation_sample is None:\n            _emit_progress(\"POI accommodation check: 'Солнышко' not enriched\")\n        else:\n            _emit_progress(\n                \"POI accommodation check: \"\n                f\"'Солнышко'; id={solnyshko_accommodation_sample['id']}; \"\n                f\"2km={solnyshko_accommodation_sample['objects_2km']}; \"\n                f\"10km={solnyshko_accommodation_sample['objects_10km']}; \"\n                f\"priority={solnyshko_accommodation_sample['priority']}\"\n            )\n'''
          new = '''        if solnyshko_accommodation_sample is None:\n            _emit_progress(\"POI accommodation check: 'Солнышко' not enriched\")\n        else:\n            _emit_progress(\n                \"POI accommodation check: \"\n                f\"'Солнышко'; id={solnyshko_accommodation_sample['id']}; \"\n                f\"lat={float(solnyshko_accommodation_sample['lat']):.6f}; \"\n                f\"lon={float(solnyshko_accommodation_sample['lon']):.6f}; \"\n                f\"2km={solnyshko_accommodation_sample['objects_2km']}; \"\n                f\"10km={solnyshko_accommodation_sample['objects_10km']}; \"\n                f\"priority={solnyshko_accommodation_sample['priority']}\"\n            )\n            _emit_progress(\"POI accommodation check: scanning 20 nearest neighbors\")\n            nearest = nearest_accommodation_details(\n                str(source),\n                osmium,\n                float(solnyshko_accommodation_sample[\"lat\"]),\n                float(solnyshko_accommodation_sample[\"lon\"]),\n                20,\n            )\n            for rank, neighbor in enumerate(nearest, start=1):\n                _emit_progress(\n                    \"POI accommodation neighbor: \"\n                    f\"#{rank}; id={neighbor['id']}; \"\n                    f\"name={neighbor['name']!r}; tourism={neighbor['tourism']}; \"\n                    f\"distance={float(neighbor['distance_km']):.3f}km; \"\n                    f\"lat={float(neighbor['lat']):.6f}; \"\n                    f\"lon={float(neighbor['lon']):.6f}\"\n                )\n'''
          if old not in s:
              raise SystemExit('preprocessor diagnostic anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          python -m py_compile uralla_build/poi_context.py uralla_build/preprocessor.py
          grep -n "nearest_accommodation_details" uralla_build/poi_context.py uralla_build/preprocessor.py
          grep -n "POI accommodation neighbor" uralla_build/preprocessor.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/poi_context.py uralla_build/preprocessor.py
          git commit -m 'Trace nearest accommodation POIs around Solnyshko'
          git push
