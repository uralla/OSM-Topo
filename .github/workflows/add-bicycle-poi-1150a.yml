name: Add bicycle POI 0x1150a

"on":
  push:
    paths:
      - ".github/workflows/add-bicycle-poi-1150a.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Add bicycle POI TYP block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('styles/uralla.txt')
          s = p.read_text(encoding='utf-8')

          existing = re.findall(r'(?ms)^\[_point\]\nType=0x115\nSubType=0x0a\n.*?^\[end\]\n?', s)
          assert not existing, f'0x1150a already exists ({len(existing)} blocks)'

          block = r'''
[_point]
Type=0x115
SubType=0x0a
;GRMN_TYPE: Custom POI/BICYCLE_SERVICE/Shop or repair station
String1=0x19,велосипеды
String2=0x04,bicycle
ExtendedLabels=Y
FontStyle=SmallFont
CustomColor=No
ContourColor=No
DayXpm="11 11 3 1"   Colormode=16
"!\tc #000000"
"#\tc #FFFFFF"
" \tc none"
"   !!!!!   "
"  !#####!  "
" !#######! "
"!#########!"
"!#########!"
"!#########!"
"!#########!"
"!#########!"
" !#######! "
"  !#####!  "
"   !!!!!   "
;12345678901
[end]
'''.lstrip('\n')

          # Keep custom POIs together: insert immediately before the existing 0x11509 chalet block.
          marker = '[_point]\nType=0x115\nSubType=0x09\n'
          assert s.count(marker) == 1, f'expected one chalet marker, found {s.count(marker)}'
          s = s.replace(marker, block + '\n' + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/add-bicycle-poi-1150a.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla.txt .github/workflows/add-bicycle-poi-1150a.yml
          git commit -m "Add dedicated bicycle POI 0x1150a"
          git push
