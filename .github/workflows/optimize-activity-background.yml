name: Optimize activity background lookup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-activity-background.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch 10 km activity background to grid-cell counts
        run: |
          python - <<'PY'
          from pathlib import Path

          poi = Path('uralla_build/poi_context.py')
          text = poi.read_text(encoding='utf-8')

          marker = '''    def count_within(self, lat: float, lon: float, radius_km: float) -> int:\n'''
          if marker not in text:
              raise SystemExit('count_within marker not found')

          insert_after = '''        return total\n\n\n'''
          method = '''    def count_cells_within_bbox(self, lat: float, lon: float, radius_km: float) -> int:\n        \"\"\"Fast approximate wide-area count using whole grid cells.\"\"\"\n        lat_delta = radius_km / 110.574\n        lon_scale = max(111.320 * abs(cos(radians(lat))), 1.0)\n        lon_delta = radius_km / lon_scale\n        min_y = floor((lat - lat_delta) / GRID_DEGREES)\n        max_y = floor((lat + lat_delta) / GRID_DEGREES)\n        min_x = floor((lon - lon_delta) / GRID_DEGREES)\n        max_x = floor((lon + lon_delta) / GRID_DEGREES)\n        return sum(\n            len(self.cells.get((y, x), ()))\n            for y in range(min_y, max_y + 1)\n            for x in range(min_x, max_x + 1)\n        )\n\n\n'''

          count_pos = text.find(marker)
          return_pos = text.find(insert_after, count_pos)
          if return_pos == -1:
              raise SystemExit('count_within end not found')
          return_pos += len(insert_after)
          text = text[:return_pos] + method + text[return_pos:]

          old = '    activity_10km = index.count_within(lat, lon, 10.0)\n'
          new = '    activity_10km = index.count_cells_within_bbox(lat, lon, 10.0)\n'
          if old not in text:
              raise SystemExit('activity 10 km exact count not found')
          poi.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_poi_context.py')
          text = tests.read_text(encoding='utf-8')
          marker = '''    def test_grid_distance_count(self) -> None:\n'''
          addition = '''    def test_grid_bbox_background_count(self) -> None:\n        index = FoodShopIndex.empty()\n        index.add(55.0000, 60.0000)\n        index.add(55.0500, 60.0000)\n        index.add(55.1200, 60.0000)\n        exact = index.count_within(55.0000, 60.0000, 10.0)\n        background = index.count_cells_within_bbox(55.0000, 60.0000, 10.0)\n        self.assertGreaterEqual(background, exact)\n        self.assertEqual(exact, 2)\n\n'''
          if marker not in text:
              raise SystemExit('test marker not found')
          if 'test_grid_bbox_background_count' not in text:
              text = text.replace(marker, addition + marker)
          tests.write_text(text, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python -m py_compile uralla_build/poi_context.py uralla_build/preprocessor.py
          python -m unittest tests.test_poi_context -v
          grep -q 'count_cells_within_bbox' uralla_build/poi_context.py
          grep -q 'activity_10km = index.count_cells_within_bbox' uralla_build/poi_context.py
          bash -n scripts/test-poi-context.sh

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/poi_context.py tests/test_poi_context.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Use grid background for 10 km activity context'
            git push
          fi
