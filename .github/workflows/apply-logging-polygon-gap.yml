name: Apply logging polygon gap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-logging-polygon-gap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch main polygon pre-normalization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('styles/uralla/polygons')
          s = p.read_text(encoding='utf-8')
          old = 'man_made=clearcut {add natural=heath}'
          new = '(man_made=clearcut | landuse=logging) {add natural=heath}'
          if s.count(old) != 1:
              raise SystemExit(f'expected one clearcut pre-rule, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='')
          PY
      - name: Commit direct source and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla/polygons
          git rm .github/workflows/apply-logging-polygon-gap.yml
          git commit -m "Complete landuse logging polygon support"
          git push origin HEAD:main
