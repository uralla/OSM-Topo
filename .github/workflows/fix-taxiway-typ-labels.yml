name: Fix taxiway TYP labels

on:
  push:
    paths:
      - '.github/workflows/fix-taxiway-typ-labels.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Fix taxiway TYP strings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('styles/uralla.txt')
          s = p.read_text()
          m = re.search(r'(\[_line\]\nType=0x10f1c\n.*?\n\[end\])', s, re.S)
          assert m, 'taxiway line type 0x10f1c not found'
          block = m.group(1)
          assert 'String1=0x19,пристань' in block
          assert 'String2=0x04,marina' in block
          fixed = block.replace('String1=0x19,пристань', 'String1=0x19,рулёжная дорожка', 1)
          fixed = fixed.replace('String2=0x04,marina', 'String2=0x04,taxiway', 1)
          p.write_text(s[:m.start(1)] + fixed + s[m.end(1):])
          PY
      - name: Commit and remove workflow
        run: |
          rm .github/workflows/fix-taxiway-typ-labels.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla.txt .github/workflows/fix-taxiway-typ-labels.yml
          git commit -m "Fix taxiway TYP labels"
          git push
