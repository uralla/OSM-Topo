name: Inspect custom line TYP slots once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-uralla-style-once.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect 0x10f00-0x10f1f line slots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          raw = Path('styles/uralla.txt').read_bytes()
          try:
              typ = raw.decode('utf-8')
          except UnicodeDecodeError:
              typ = raw.decode('cp1251')

          style_parts = []
          root = Path('styles/uralla')
          for p in root.rglob('*'):
              if not p.is_file():
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              active = []
              for line in s.splitlines():
                  if line.lstrip().startswith('#'):
                      continue
                  active.append(line.split('#', 1)[0])
              style_parts.append('\n'.join(active))
          style = '\n'.join(style_parts).lower()

          rx = re.compile(r'(?ims)^\[_line\][ \t]*\r?\n.*?^\[end\][ \t]*(?:\r?\n)?')
          sections = list(rx.finditer(typ))

          def code(block):
              m = re.search(r'(?im)^Type=0x([0-9a-f]+)\b', block)
              if not m:
                  return None
              return int(m.group(1), 16)

          by_code = {}
          for m in sections:
              c = code(m.group(0))
              if c is not None:
                  by_code.setdefault(c, []).append(m.group(0))

          print('CODE      TYP  STYLE  LABELS')
          for c in range(0x10f00, 0x10f20):
              blocks = by_code.get(c, [])
              refs = len(re.findall(rf'\[0x{c:x}\b', style))
              labels = []
              for b in blocks:
                  for sm in re.finditer(r'(?im)^String\d*=([^\r\n]+)', b):
                      labels.append(sm.group(1).strip())
              print(f'0x{c:05x}   {len(blocks):>2}    {refs:>2}   ' + ' | '.join(labels[:4]))
          PY
      - name: Remove diagnostic workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/check-uralla-style-once.yml
          git commit -m "Complete custom line slot inspection"
          git push origin HEAD:main
