name: One-shot fix source ownership and summary

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-source-and-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch source ownership and summary parsing
        run: python .github/scripts/one_shot_fix_source_and_summary.py
      - name: Sanity check
        run: |
          python -m py_compile uralla_build/cli.py uralla_build/entrypoint.py
          ! grep -q 'Checking OSM source for' uralla_build/cli.py
          grep -q '_last_json_mapping' uralla_build/entrypoint.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/cli.py uralla_build/entrypoint.py
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Centralize source refresh and preserve human build summary'
          git push
