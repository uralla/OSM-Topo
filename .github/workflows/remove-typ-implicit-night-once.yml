name: Remove implicit TYP night palettes once

on:
  push:
    branches: [main]
    paths:
      - scripts/remove_typ_implicit_night.py
      - .github/workflows/remove-typ-implicit-night-once.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove implicit night palettes while preserving day rendering
        run: python3 scripts/remove_typ_implicit_night.py

      - name: Download pinned mkgmap r4924
        run: |
          curl -fsSLO https://www.mkgmap.org.uk/download/mkgmap-r4924.zip
          echo 'b2170799b61a95d4fc258e8e4fb4e21396809e0390789178f94c77109f8e0d84  mkgmap-r4924.zip' | sha256sum -c -
          unzip -q mkgmap-r4924.zip

      - name: Compile TYP and run regression suite
        run: |
          set -o pipefail
          mkdir -p /tmp/typ-out
          java -jar mkgmap-r4924/mkgmap.jar --output-dir=/tmp/typ-out styles/uralla.txt 2>&1 | tee /tmp/typ.log
          if grep -q '^Warning:' /tmp/typ.log; then exit 1; fi
          test -f /tmp/typ-out/uralla.typ
          java -jar mkgmap-r4924/mkgmap.jar --style-file=styles/uralla --check-styles 2>&1 | tee /tmp/style.log
          grep -q 'finished check-styles' /tmp/style.log
          if grep -q '^Warning:' /tmp/style.log; then exit 1; fi
          python -m pip install -e . pytest
          pytest -q tests/test_typ_night_mode.py tests/test_typ_usage.py
          pytest -q

      - name: Commit direct TYP and remove one-shot helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla.txt tests/test_typ_night_mode.py
          git rm scripts/remove_typ_implicit_night.py .github/workflows/remove-typ-implicit-night-once.yml
          git commit -m "Remove implicit TYP night palettes"
          git push origin HEAD:main
