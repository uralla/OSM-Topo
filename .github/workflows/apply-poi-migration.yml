name: Apply POI migration

on:
  push:
    paths:
      - '.github/workflows/apply-poi-migration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply agreed POI migration
        run: python3 .github/poi_migration_patch.py
      - name: Validate style and TYP
        run: |
          python -m pip install -e . pytest
          pytest -q
      - name: Remove one-shot files
        run: rm .github/workflows/apply-poi-migration.yml .github/poi_migration_patch.py
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/points styles/uralla/inc/priority_points styles/uralla.txt .github/workflows/apply-poi-migration.yml .github/poi_migration_patch.py
          git commit -m "Add safety and cycling POIs and migrate fountain type"
          git pull --rebase origin main
          git push
