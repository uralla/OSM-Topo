name: Apply POI migration

on:
  push:
    paths:
      - '.github/workflows/apply-poi-migration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply agreed POI migration
        run: python3 .github/poi_migration_patch.py
      - name: Validate agreed POI migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('.')
          points = (root/'styles/uralla/points').read_text(encoding='utf-8')
          priority = (root/'styles/uralla/inc/priority_points').read_text(encoding='utf-8')
          typ = (root/'styles/uralla.txt').read_text(encoding='utf-8')
          assert 'amenity=fountain [0x2f19 resolution 23]' in points
          assert 'amenity=fountain [0x11502 resolution 23]' not in points
          assert "amenity=bicycle_rental { name '${name}' | 'прокат велосипедов' } [0x2f18 resolution 24]" in priority
          assert "# amenity=bicycle_parking { name '${name}' | 'велопарковка' } [0x2f18 resolution 24]" in priority
          assert "(emergency=defibrillator | amenity=defibrillator) { name '${name}' | 'дефибриллятор' } [0x3002 resolution 24]" in priority
          assert "emergency=first_aid_kit { name '${name}' | 'аптечка' } [0x3002 resolution 24]" in priority
          new = re.search(r'(?ms)^\[_point\]\nType=0x02f\nSubType=0x19\n.*?^\[end\]', typ)
          assert new
          block = new.group(0)
          assert 'String1=0x19,фонтан' in block
          assert 'String2=0x04,fountain' in block
          assert 'ExtendedLabels=N' in block
          assert 'DayXpm=' in block
          assert not re.search(r'(?ms)^\[_point\]\nType=0x115\nSubType=0x02\n', typ)
          PY
      - name: Remove one-shot files
        run: rm .github/workflows/apply-poi-migration.yml .github/poi_migration_patch.py
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/points styles/uralla/inc/priority_points styles/uralla.txt .github/workflows/apply-poi-migration.yml .github/poi_migration_patch.py
          git commit -m "Add safety and cycling POIs and migrate fountain type"
          git pull --rebase origin main
          git push
