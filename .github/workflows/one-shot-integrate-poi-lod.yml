name: One-shot integrate POI LOD diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-integrate-poi-lod.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch POI LOD integration
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('uralla_build/poi_context.py')
          s = p.read_text(encoding='utf-8')

          old = 'from typing import Any, Iterable, Mapping\n'
          new = 'from typing import Any, Iterable, Mapping\n\nfrom .poi_lod import POI_LOD_CLASS_TAG, classify_poi_lod, intrinsic_floor_for_tags\n'
          assert old in s and new not in s
          s = s.replace(old, new, 1)

          old = '''            desired[POI_SCREEN_PRESSURE_TAG] = screen_context\n    changed = any(result.get(key) != value for key, value in desired.items())\n'''
          new = '''            desired[POI_SCREEN_PRESSURE_TAG] = screen_context\n\n    lod_class = None\n    activity_context = desired.get(POI_ACTIVITY_CONTEXT_TAG) or result.get(POI_ACTIVITY_CONTEXT_TAG)\n    if activity_context and screen_context:\n        lod_class = classify_poi_lod(\n            priority=result.get(POI_PRIORITY_TAG, "common"),\n            activity_context=activity_context,\n            screen_pressure=screen_context,\n            intrinsic_floor=intrinsic_floor_for_tags(result),\n        )\n        desired[POI_LOD_CLASS_TAG] = lod_class\n\n    changed = any(result.get(key) != value for key, value in desired.items())\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        "screen_pressure": screen_context,\n        "place_distance_km": nearest_place[0] if nearest_place is not None else None,\n'''
          new = '''        "screen_pressure": screen_context,\n        "lod_class": lod_class,\n        "intrinsic_floor": intrinsic_floor_for_tags(result),\n        "place_distance_km": nearest_place[0] if nearest_place is not None else None,\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('uralla_build/poi_lod.py')
          s = p.read_text(encoding='utf-8')
          marker = '_CLASS_SCORE = {"L": 0, "M": 1, "H": 2}\n\n\n'
          addition = '''_CLASS_SCORE = {"L": 0, "M": 1, "H": 2}\n\n\ndef intrinsic_floor_for_tags(tags: object) -> str:\n    """Return the category-level minimum LOD class for an adaptive POI."""\n    items = tags.items() if hasattr(tags, "items") else iter(tags)\n    values = {str(key): str(value) for key, value in items}\n    if values.get("shop") == "supermarket" or values.get("amenity") == "supermarket":\n        return "M"\n    return "L"\n\n\n'''
          assert marker in s and 'def intrinsic_floor_for_tags' not in s
          s = s.replace(marker, addition, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('uralla_build/preprocessor.py')
          s = p.read_text(encoding='utf-8')
          old = '''                activity_context_value = final_tags.get(POI_ACTIVITY_CONTEXT_TAG)\n                if activity_context_value in {"remote", "settlement", "urban"}:\n                    counters[f"activity_context_written_{activity_context_value}"] += 1\n'''
          new = '''                activity_context_value = final_tags.get(POI_ACTIVITY_CONTEXT_TAG)\n                if activity_context_value in {"remote", "settlement", "urban"}:\n                    counters[f"activity_context_written_{activity_context_value}"] += 1\n\n                lod_class_value = final_tags.get("uralla:poi_lod_class")\n                if lod_class_value in {"H", "M", "L"}:\n                    counters[f"poi_lod_class_{lod_class_value}"] += 1\n                    if int(getattr(item, "id", 0)) == 4912997022:\n                        _emit_progress(\n                            "POI LOD named check: 'Солнышко' Ai-Petri; "\n                            f"id={int(item.id)}; priority={final_tags.get('uralla:poi_priority')}; "\n                            f"activity={final_tags.get('uralla:poi_activity_context')}; "\n                            f"screen={final_tags.get('uralla:poi_screen_pressure')}; "\n                            f"lod={lod_class_value}; "\n                            f"screen2km={final_tags.get('uralla:poi_screen_pressure_2km')}; "\n                            f"screen10km={final_tags.get('uralla:poi_screen_pressure_10km')}"\n                        )\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        _emit_progress(\n            "POI activity context tags written: "\n            f"remote {counters['activity_context_written_remote']:,}; "\n            f"settlement {counters['activity_context_written_settlement']:,}; "\n            f"urban {counters['activity_context_written_urban']:,}; "\n            f"total {sum(counters[f'activity_context_written_{value}'] for value in ('remote', 'settlement', 'urban')):,}"\n        )\n'''
          new = old + '''        _emit_progress(\n            "POI final LOD diagnostics: "\n            f"H={counters['poi_lod_class_H']:,}; "\n            f"M={counters['poi_lod_class_M']:,}; "\n            f"L={counters['poi_lod_class_L']:,}; "\n            f"total={sum(counters[f'poi_lod_class_{value}'] for value in ('H', 'M', 'L')):,}"\n        )\n'''
          assert old in s and 'POI final LOD diagnostics:' not in s
          s = s.replace(old, new, 1)

          old = '''            "activity_context_enriched": counters["activity_context_enriched"],\n'''
          new = old + '''            "poi_lod_class_H": counters["poi_lod_class_H"],\n            "poi_lod_class_M": counters["poi_lod_class_M"],\n            "poi_lod_class_L": counters["poi_lod_class_L"],\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('tests/test_poi_lod.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('from uralla_build.poi_lod import classify_poi_lod\n', 'from uralla_build.poi_lod import classify_poi_lod, intrinsic_floor_for_tags\n', 1)
          insert = '''\n    def test_intrinsic_floor_from_tags(self) -> None:\n        self.assertEqual(intrinsic_floor_for_tags({"shop": "supermarket"}), "M")\n        self.assertEqual(intrinsic_floor_for_tags({"amenity": "supermarket"}), "M")\n        self.assertEqual(intrinsic_floor_for_tags({"shop": "convenience"}), "L")\n        self.assertEqual(intrinsic_floor_for_tags({"tourism": "hotel"}), "L")\n'''
          marker = '\n\nif __name__ == "__main__":\n'
          assert marker in s and 'test_intrinsic_floor_from_tags' not in s
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          python -m py_compile uralla_build/poi_lod.py uralla_build/poi_context.py uralla_build/preprocessor.py
          python -m unittest tests.test_poi_lod tests.test_poi_context -v
          git diff --check

      - name: Commit production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/poi_lod.py uralla_build/poi_context.py uralla_build/preprocessor.py tests/test_poi_lod.py
          git commit -m 'Integrate final POI LOD diagnostics'
          git push
