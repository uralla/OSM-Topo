name: Fix marked route shift once

on:
  push:
    paths:
      - scripts/tools/fix_marked_route_shift_once.py
      - .github/workflows/fix-marked-route-shift-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch marked route thresholds
        run: python scripts/tools/fix_marked_route_shift_once.py
      - name: Run focused regression
        run: python -m unittest tests.test_marked_route_line_hierarchy -v
      - name: Commit style and test
        shell: bash
        run: |
          if git diff --quiet -- styles/uralla/lines tests/test_marked_route_line_hierarchy.py; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla/lines tests/test_marked_route_line_hierarchy.py
          git commit -m "Shift marked route far and near thresholds"
          git push origin HEAD:main
