name: Remap extended point types to 0x064

on:
  push:
    paths:
      - '.github/workflows/remap-extended-points-to-064.yml'

permissions:
  contents: write

jobs:
  remap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Audit and remap active extended point types
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          STYLE = ROOT / 'styles' / 'uralla'
          POINTS = STYLE / 'points'
          TYP_PATH = ROOT / 'styles' / 'uralla.txt'

          include_re = re.compile(r"^\s*include\s+'([^']+)'\s*;", re.M)
          type_re = re.compile(r'\[(0x[0-9a-fA-F]+)\s+resolution\b')

          files = []
          seen = set()
          def visit(path: Path):
              path = path.resolve()
              if path in seen:
                  return
              seen.add(path)
              files.append(path)
              text = path.read_text(encoding='utf-8')
              for rel in include_re.findall(text):
                  visit(STYLE / rel)
          visit(POINTS)

          active = set()
          for path in files:
              text = path.read_text(encoding='utf-8')
              for raw in type_re.findall(text):
                  value = int(raw, 16)
                  if value >= 0x11600:
                      active.add(value)

          typ = TYP_PATH.read_text(encoding='utf-8')
          # Occupied subtypes in the proven 0x064 point family.
          occupied = {
              int(x, 16)
              for x in re.findall(r'(?ms)^\[_point\]\s*\nType=0x0?64\s*\nSubType=0x([0-9a-fA-F]{2})\b', typ)
          }
          free = [x for x in range(0x00, 0x100) if x not in occupied]
          assert len(free) >= len(active), (len(active), len(free))

          # Every active extended type must have exactly one matching TYP block.
          mapping = {}
          for old, sub in zip(sorted(active), free):
              old_type = old >> 8
              old_sub = old & 0xff
              pat = re.compile(
                  rf'(?ms)^\[_point\]\nType=0x0?{old_type:x}\nSubType=0x{old_sub:02x}\n.*?^\[end\]'
              )
              matches = list(pat.finditer(typ))
              assert len(matches) == 1, f'0x{old:x}: expected one TYP point block, got {len(matches)}'
              mapping[old] = 0x6400 | sub

          # Replace production style references only in the actual point include graph.
          counts = {old: 0 for old in mapping}
          for path in files:
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  old_s = f'0x{old:x}'
                  new_s = f'0x{new:04x}'
                  n = text.lower().count(old_s)
                  if n:
                      counts[old] += n
                      text = re.sub(re.escape(old_s), new_s, text, flags=re.I)
              path.write_text(text, encoding='utf-8')
          assert all(n > 0 for n in counts.values()), counts

          # Move each TYP block intact into Type=0x064, changing only the address.
          for old, new in mapping.items():
              old_type = old >> 8
              old_sub = old & 0xff
              new_sub = new & 0xff
              pat = re.compile(
                  rf'(?ms)^\[_point\]\nType=0x0?{old_type:x}\nSubType=0x{old_sub:02x}\n.*?^\[end\]'
              )
              m = pat.search(typ)
              assert m, f'missing TYP block for 0x{old:x}'
              block = m.group(0)
              block = re.sub(r'^Type=.*$', 'Type=0x064', block, count=1, flags=re.M)
              block = re.sub(r'^SubType=.*$', f'SubType=0x{new_sub:02x}', block, count=1, flags=re.M)
              typ = typ[:m.start()] + block + typ[m.end():]
          TYP_PATH.write_text(typ, encoding='utf-8')

          # Verify there are no active extended point addresses left.
          remaining = set()
          for path in files:
              text = path.read_text(encoding='utf-8')
              for raw in type_re.findall(text):
                  if int(raw, 16) >= 0x11600:
                      remaining.add(int(raw, 16))
          assert not remaining, sorted(hex(x) for x in remaining)

          # Verify all new addresses exist as 0x064 TYP point blocks.
          typ2 = TYP_PATH.read_text(encoding='utf-8')
          for new in mapping.values():
              sub = new & 0xff
              assert re.search(
                  rf'(?ms)^\[_point\]\s*\nType=0x0?64\s*\nSubType=0x{sub:02x}\b.*?^\[end\]',
                  typ2,
              ), hex(new)

          # Keep a current authoritative migration table.
          rows = []
          for old, new in sorted(mapping.items()):
              rows.append(f'| `0x{old:x}` | `0x{new:04x}` |')
          doc = ROOT / 'docs' / 'EXTENDED_POINT_TYPES.md'
          doc.write_text(
              '# Extended point types on Garmin\n\n'
              '## Device rule\n\n'
              'On the target Garmin, custom point families `0x115xx`, `0x116xx` and higher extended point addresses are not considered safe merely because mkgmap/TYP accepts them. Device visibility is the deciding criterion.\n\n'
              'For custom POIs that must be visible, this project uses the device-proven `0x064xx` point family and moves the complete TYP bitmap block together with the style address.\n\n'
              '## Current migration\n\n'
              '| Previous active type | Current `0x064xx` type |\n'
              '| --- | --- |\n' + '\n'.join(rows) + '\n\n'
              'The table contains only extended types that were active in the production point style at migration time. TYP-only historical blocks are not treated as active map objects.\n',
              encoding='utf-8',
          )

          # Backlog: keep POI audit partial until a device build confirms this wider remap.
          backlog = ROOT / 'docs' / 'BACKLOG.md'
          text = backlog.read_text(encoding='utf-8')
          text = re.sub(
              r'### POI-01 — Аудит POI и перенос в безопасный диапазон Garmin types — \w+',
              '### POI-01 — Аудит POI и перенос в безопасный диапазон Garmin types — PARTIAL',
              text,
              count=1,
          )
          marker = '### POI-01 — Аудит POI и перенос в безопасный диапазон Garmin types — PARTIAL\n'
          note = ('\nПрактическое правило устройства: расширенные пользовательские point-типы `0x115xx`, `0x116xx` и выше не считаются безопасными. '
                  'Если POI должен гарантированно отображаться, его адрес и TYP-графика переносятся в проверенное семейство `0x064xx`. '
                  'Статус остаётся PARTIAL до проверки новой сборки на реальном Garmin.\n')
          if marker in text and note.strip() not in text:
              text = text.replace(marker, marker + note, 1)
          backlog.write_text(text, encoding='utf-8')

          print('ACTIVE_EXTENDED=', ' '.join(f'0x{x:x}' for x in sorted(active)))
          print('MAPPING=')
          for old, new in sorted(mapping.items()):
              print(f'  0x{old:x} -> 0x{new:04x}')
          PY
      - name: Commit migration and remove workflow
        shell: bash
        run: |
          rm .github/workflows/remap-extended-points-to-064.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles docs .github/workflows/remap-extended-points-to-064.yml
          git commit -m 'Move active extended POIs to working 0x064 range'
          git push
