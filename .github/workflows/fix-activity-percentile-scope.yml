name: Fix activity percentile scope

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-activity-percentile-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move percentile helper to module scope
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('uralla_build/preprocessor.py')
          text = path.read_text(encoding='utf-8')

          helper = '''def _activity_percentile(values: list[int], percentile: float) -> int:\n    if not values:\n        return 0\n    ordered = sorted(values)\n    index = round((len(ordered) - 1) * percentile)\n    return ordered[index]\n\n\n'''
          local = '''        def _activity_percentile(values: list[int], percentile: float) -> int:\n            if not values:\n                return 0\n            ordered = sorted(values)\n            index = round((len(ordered) - 1) * percentile)\n            return ordered[index]\n\n'''

          if local not in text:
              raise SystemExit('local percentile helper not found')
          text = text.replace(local, '', 1)

          marker = '''def _progress(objects_seen: int, started: float) -> None:\n    elapsed = max(time.monotonic() - started, 0.001)\n    rate = objects_seen / elapsed\n    _emit_progress(f"[preprocess] {objects_seen:,} objects; {rate:,.0f} obj/s")\n\n\n'''
          if marker not in text:
              raise SystemExit('module helper insertion marker not found')
          text = text.replace(marker, marker + helper, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python -m py_compile uralla_build/preprocessor.py
          python -m unittest tests.test_poi_context -v
          python - <<'PY'
          import uralla_build.preprocessor as p
          assert p._activity_percentile([1, 2, 3, 4], 0.25) == 2
          assert p._activity_percentile([], 0.25) == 0
          PY
          test "$(grep -c '^def _activity_percentile' uralla_build/preprocessor.py)" -eq 1

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/preprocessor.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Fix activity percentile helper scope'
            git push
          fi
