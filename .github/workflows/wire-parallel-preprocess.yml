name: Wire parallel preprocessing

'on':
  push:
    paths:
      - '.github/workflows/wire-parallel-preprocess.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git pull --rebase origin main
      - name: Patch build plan
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('uralla_build/build_plan.py')
          s=p.read_text()
          start=s.index('    semantic_input = build_root / "preprocess" / "preprocessed.osm.pbf"')
          end=s.index('    areas_root = repo_path', start)
          s=s[:start] + '''    # Split OSM first. Semantic preprocessing is intentionally done per tile\n    # after splitter so CPU-heavy Python work can run in parallel.\n    splitter_input = transformed\n\n''' + s[end:]
          old='''    stages.append(\n        PipelineStage(\n            "validate-areas",\n            (\n                sys.executable,\n                "-m",\n                "uralla_build",\n                "--manifest",\n                str(Path(manifest_path).resolve()),\n                "validate-areas",\n                product_key,\n                str(tiles / "areas.list"),\n                "--template",\n                str(tiles / "template.args"),\n            ),\n            environment=(("PYTHONPATH", str(repo)),),\n        )\n    )\n\n    garmin = build_root / "mkgmap" / "garmin"\n'''
          new='''    stages.append(\n        PipelineStage(\n            "validate-areas",\n            (\n                sys.executable,\n                "-m",\n                "uralla_build",\n                "--manifest",\n                str(Path(manifest_path).resolve()),\n                "validate-areas",\n                product_key,\n                str(tiles / "areas.list"),\n                "--template",\n                str(tiles / "template.args"),\n            ),\n            environment=(("PYTHONPATH", str(repo)),),\n        )\n    )\n\n    elevation_tiles: Path | None = None\n    if elevation_value is not None:\n        elevation = data_path(\n            host,\n            _text(elevation_value, f"products.{product_key}.elevation"),\n        )\n        elevation_tiles = build_root / "splitter-elevation" / "tiles"\n        stages.append(\n            PipelineStage(\n                "splitter-elevation",\n                (\n                    "java",\n                    "-jar",\n                    str(_tool_jar(tools_lock, host, "splitter")),\n                    str(elevation),\n                    f"--split-file={tiles / 'areas.list'}",\n                    f"--output={_text(defaults_splitter.get('output'), 'defaults.splitter.output')}",\n                    "--output-dir=tiles",\n                ),\n                ("tiles",),\n                ("tiles",),\n            )\n        )\n\n    prepared_tiles = build_root / "prepare-tiles" / "tiles"\n    prepare_command = [\n        sys.executable,\n        "-m",\n        "uralla_build.tile_preprocess",\n        "--input-dir",\n        str(tiles),\n        "--template",\n        str(tiles / "template.args"),\n        "--output-dir",\n        "tiles",\n        "--config",\n        str(blacklist),\n        "--report",\n        "report.json",\n    ]\n    for profile in profiles:\n        prepare_command.extend(("--profile", profile))\n    preprocess_workers = splitter.get("max_threads")\n    if preprocess_workers is not None:\n        prepare_command.extend(("--workers", str(preprocess_workers)))\n    if elevation_tiles is not None:\n        prepare_command.extend(("--elevation-dir", str(elevation_tiles)))\n    stages.append(\n        PipelineStage(\n            "prepare-tiles",\n            tuple(prepare_command),\n            ("tiles", "report.json"),\n            ("tiles",),\n            environment=(("PYTHONPATH", str(repo)),),\n        )\n    )\n\n    if "ru-political-parties" in profiles:\n        warnings.append(\n            "parallel tile preprocessing: landmarks + Russian political blacklist"\n        )\n    else:\n        warnings.append("parallel tile preprocessing: static peak + river landmarks")\n\n    tiles = prepared_tiles\n    garmin = build_root / "mkgmap" / "garmin"\n'''
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Syntax and focused tests
        run: |
          python -m py_compile uralla_build/build_plan.py uralla_build/tile_preprocess.py
          python -m unittest tests.test_build_plan tests.test_pipeline
      - name: Commit
        run: |
          rm .github/workflows/wire-parallel-preprocess.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uralla_build/build_plan.py uralla_build/tile_preprocess.py .github/workflows/wire-parallel-preprocess.yml
          git commit -m 'Run semantic preprocess in parallel after splitter'
          git push
