name: Align stream-like waterways once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-stream-like-waterways-once.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align canal and drain with stream visual hierarchy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('styles/uralla/inc/water_lines')
          text = path.read_text(encoding='utf-8')

          old = (
              "# Long rivers/canals are emitted once from resolution 20. Short ones only\n"
              "# appear at close zoom; excluding long ways here avoids a second identical 0x01f.\n"
              "waterway=river & length()>500 | waterway=canal & length()>500 [0x01f resolution 20 continue]\n"
              "waterway=river & length()<=500 | waterway=canal & length()<=500 [0x01f resolution 23]\n\n"
              "waterway=drain [0x10109 resolution 24 continue]\n"
              "# [CUSTOM/АВТОРСКОЕ] ditch is visible only at the closest level.\n"
              "waterway=ditch [0x10109 resolution 24 continue]\n"
          )
          new = (
              "# Rivers keep their own visual hierarchy. Canals are intentionally handled\n"
              "# with stream-like waterways below.\n"
              "waterway=river & length()>500 [0x01f resolution 20 continue]\n"
              "waterway=river & length()<=500 [0x01f resolution 23]\n\n"
              "# [CUSTOM/АВТОРСКОЕ] ditch is visible only at the closest level and remains\n"
              "# visually distinct from stream/drain/canal.\n"
              "waterway=ditch [0x10109 resolution 24 continue]\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'river/canal/drain legacy block count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = (
              "waterway=drain & length()>500 [0x18 resolution 21-23 continue]\n"
              "waterway=stream & length()>500 [0x18 resolution 21-23 continue]\n"
              "waterway=stream [0x19 resolution 24 continue]\n"
          )
          new = (
              "# Stream, drain and canal intentionally share one visual hierarchy.\n"
              "# Intermittent stream/drain rules above consume those objects first.\n"
              "(waterway=stream | waterway=drain | waterway=canal) & length()>500 [0x18 resolution 21-23 continue]\n"
              "(waterway=stream | waterway=drain | waterway=canal) [0x19 resolution 24 continue]\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'stream/drain tail block count={text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='')
          PY

      - name: Add waterway hierarchy regression tests
        run: |
          cat > tests/test_waterway_style.py <<'PY'
          from pathlib import Path
          import unittest


          ROOT = Path(__file__).resolve().parents[1]
          WATER_LINES = ROOT / 'styles' / 'uralla' / 'inc' / 'water_lines'


          class WaterwayStyleTests(unittest.TestCase):
              def setUp(self) -> None:
                  self.text = WATER_LINES.read_text(encoding='utf-8')

              def test_river_keeps_distinct_visual_class(self) -> None:
                  self.assertIn('waterway=river & length()>500 [0x01f resolution 20 continue]', self.text)
                  self.assertIn('waterway=river & length()<=500 [0x01f resolution 23]', self.text)
                  self.assertNotIn('waterway=canal & length()>500 [0x01f', self.text)

              def test_stream_drain_and_canal_share_visual_hierarchy(self) -> None:
                  group = '(waterway=stream | waterway=drain | waterway=canal)'
                  self.assertIn(group + ' & length()>500 [0x18 resolution 21-23 continue]', self.text)
                  self.assertIn(group + ' [0x19 resolution 24 continue]', self.text)
                  self.assertNotIn('waterway=drain [0x10109', self.text)

              def test_ditch_remains_close_zoom_only(self) -> None:
                  self.assertIn('waterway=ditch [0x10109 resolution 24 continue]', self.text)
                  self.assertNotIn('waterway=ditch [0x10109 resolution 21', self.text)

              def test_intermittent_stream_and_drain_keep_custom_dash(self) -> None:
                  self.assertIn('(waterway=stream | waterway=drain) & intermittent=yes [0x10f1d resolution 23-23 continue]', self.text)
                  self.assertIn('(waterway=stream | waterway=drain) & intermittent=yes [0x10f1e resolution 24]', self.text)


          if __name__ == '__main__':
              unittest.main()
          PY

      - name: Download pinned mkgmap r4924
        run: |
          curl -fsSLO https://www.mkgmap.org.uk/download/mkgmap-r4924.zip
          echo 'b2170799b61a95d4fc258e8e4fb4e21396809e0390789178f94c77109f8e0d84  mkgmap-r4924.zip' | sha256sum -c -
          unzip -q mkgmap-r4924.zip

      - name: Check style and regressions
        run: |
          set -o pipefail
          java -jar mkgmap-r4924/mkgmap.jar --style-file=styles/uralla --check-styles 2>&1 | tee /tmp/style.log
          grep -q 'finished check-styles' /tmp/style.log
          if grep -q '^Warning:' /tmp/style.log; then exit 1; fi
          python -m pip install -e . pytest
          pytest -q tests/test_waterway_style.py tests/test_water_points_style.py tests/test_typ_usage.py
          pytest -q

      - name: Commit direct style and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla/inc/water_lines tests/test_waterway_style.py
          git rm .github/workflows/align-stream-like-waterways-once.yml
          git commit -m "Align drain and canal with stream styling"
          git push origin HEAD:main
