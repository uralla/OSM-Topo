name: Hide water source labels once

# cp1251-safe one-shot TYP edit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hide-water-source-labels-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set NoLabel on water source point types
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('styles/uralla.txt')
          raw = path.read_bytes()
          text = raw.decode('cp1251')
          targets = {('0x065', '0x11'), ('0x065', '0x12')}
          found = set()

          block_re = re.compile(
              r'(?ms)^\[_point\](?:\r\n|\n|\r).*?^\[end\](?=(?:\r\n|\n|\r)|\Z)'
          )

          def patch(match):
              block = match.group(0)
              type_match = re.search(
                  r'(?mi)^Type=(0x[0-9a-f]+)(?=\r?$|\r)', block
              )
              subtype_match = re.search(
                  r'(?mi)^SubType=(0x[0-9a-f]+)(?=\r?$|\r)', block
              )
              if not type_match or not subtype_match:
                  return block

              key = (type_match.group(1).lower(), subtype_match.group(1).lower())
              if key not in targets:
                  return block

              found.add(key)
              newline = '\r\n' if '\r\n' in block else ('\r' if '\r' in block else '\n')

              if re.search(r'(?mi)^FontStyle=.*?(?=\r?$|\r)', block):
                  return re.sub(
                      r'(?mi)^FontStyle=.*?(?=\r?$|\r)',
                      'FontStyle=NoLabel',
                      block,
                      count=1,
                  )

              end_pos = block.lower().rfind('[end]')
              if end_pos < 0:
                  raise SystemExit(f'malformed point block for {key}')
              return block[:end_pos] + f'FontStyle=NoLabel{newline}' + block[end_pos:]

          updated = block_re.sub(patch, text)
          missing = targets - found
          if missing:
              raise SystemExit(f'missing point types: {sorted(missing)}')
          path.write_bytes(updated.encode('cp1251'))
          PY

      - name: Download pinned mkgmap r4924
        run: |
          curl -fsSLO https://www.mkgmap.org.uk/download/mkgmap-r4924.zip
          echo 'b2170799b61a95d4fc258e8e4fb4e21396809e0390789178f94c77109f8e0d84  mkgmap-r4924.zip' | sha256sum -c -
          unzip -q mkgmap-r4924.zip

      - name: Validate style and TYP
        run: |
          set -o pipefail
          java -jar mkgmap-r4924/mkgmap.jar --style-file=styles/uralla --check-styles 2>&1 | tee /tmp/style.log
          if grep -q '^Warning:' /tmp/style.log; then exit 1; fi
          java -jar mkgmap-r4924/mkgmap.jar styles/uralla.txt 2>&1 | tee /tmp/typ.log
          if grep -qE 'MapFailedExceptions: [1-9]|ExitExceptions: [1-9]' /tmp/typ.log; then exit 1; fi

      - name: Run tests
        run: |
          python -m pip install -e . pytest
          pytest -q tests/test_water_source_typ.py
          pytest -q

      - name: Commit TYP update and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla.txt
          git rm .github/workflows/hide-water-source-labels-once.yml
          git commit -m "Hide water source labels in TYP"
          git push origin HEAD:main
