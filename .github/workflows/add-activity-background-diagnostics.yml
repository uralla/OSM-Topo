name: Add activity background diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-activity-background-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add 10 km activity background diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          poi = Path('uralla_build/poi_context.py')
          text = poi.read_text(encoding='utf-8')
          text = text.replace(
              'POI_ACTIVITY_2KM_TAG = "uralla:poi_activity_2km"\n',
              'POI_ACTIVITY_2KM_TAG = "uralla:poi_activity_2km"\nPOI_ACTIVITY_10KM_TAG = "uralla:poi_activity_10km"\n',
          )
          old = '''    activity_500m = index.count_within(lat, lon, 0.5)\n    activity_2km = index.count_within(lat, lon, 2.0)\n    desired = {\n        POI_ACTIVITY_500M_TAG: str(activity_500m),\n        POI_ACTIVITY_2KM_TAG: str(activity_2km),\n    }\n'''
          new = '''    activity_500m = index.count_within(lat, lon, 0.5)\n    activity_2km = index.count_within(lat, lon, 2.0)\n    activity_10km = index.count_within(lat, lon, 10.0)\n    desired = {\n        POI_ACTIVITY_500M_TAG: str(activity_500m),\n        POI_ACTIVITY_2KM_TAG: str(activity_2km),\n        POI_ACTIVITY_10KM_TAG: str(activity_10km),\n    }\n'''
          if old not in text:
              raise SystemExit('activity count block not found')
          text = text.replace(old, new)
          old = '''        "activity_500m": activity_500m,\n        "activity_2km": activity_2km,\n        "lat": lat,\n'''
          new = '''        "activity_500m": activity_500m,\n        "activity_2km": activity_2km,\n        "activity_10km": activity_10km,\n        "lat": lat,\n'''
          if old not in text:
              raise SystemExit('activity sample block not found')
          poi.write_text(text.replace(old, new), encoding='utf-8')

          pre = Path('uralla_build/preprocessor.py')
          text = pre.read_text(encoding='utf-8')
          text = text.replace(
              '    activity_2km_values: list[int] = []\n',
              '    activity_2km_values: list[int] = []\n    activity_10km_values: list[int] = []\n',
          )
          old = '''                        activity_500m_values.append(int(activity_sample["activity_500m"]))\n                        activity_2km_values.append(int(activity_sample["activity_2km"]))\n'''
          new = '''                        activity_500m_values.append(int(activity_sample["activity_500m"]))\n                        activity_2km_values.append(int(activity_sample["activity_2km"]))\n                        activity_10km_values.append(int(activity_sample["activity_10km"]))\n'''
          if old not in text:
              raise SystemExit('activity percentile input block not found')
          text = text.replace(old, new)
          old = '''                        solnyshko_accommodation_sample["activity_500m"] = activity_sample["activity_500m"]\n                        solnyshko_accommodation_sample["activity_2km"] = activity_sample["activity_2km"]\n'''
          new = '''                        solnyshko_accommodation_sample["activity_500m"] = activity_sample["activity_500m"]\n                        solnyshko_accommodation_sample["activity_2km"] = activity_sample["activity_2km"]\n                        solnyshko_accommodation_sample["activity_10km"] = activity_sample["activity_10km"]\n'''
          if old not in text:
              raise SystemExit('Solnyshko activity block not found')
          text = text.replace(old, new)
          old = '''                f"p75={_activity_percentile(activity_2km_values, 0.75)} "\n                f"p90={_activity_percentile(activity_2km_values, 0.90)}"\n'''
          new = '''                f"p75={_activity_percentile(activity_2km_values, 0.75)} "\n                f"p90={_activity_percentile(activity_2km_values, 0.90)}; "\n                f"10km p25={_activity_percentile(activity_10km_values, 0.25)} "\n                f"p50={_activity_percentile(activity_10km_values, 0.50)} "\n                f"p75={_activity_percentile(activity_10km_values, 0.75)} "\n                f"p90={_activity_percentile(activity_10km_values, 0.90)}"\n'''
          if old not in text:
              raise SystemExit('activity percentile log block not found')
          text = text.replace(old, new)
          old = '''                f"activity500m={solnyshko_accommodation_sample.get('activity_500m', 'n/a')}; "\n                f"activity2km={solnyshko_accommodation_sample.get('activity_2km', 'n/a')}; "\n'''
          new = '''                f"activity500m={solnyshko_accommodation_sample.get('activity_500m', 'n/a')}; "\n                f"activity2km={solnyshko_accommodation_sample.get('activity_2km', 'n/a')}; "\n                f"activity10km={solnyshko_accommodation_sample.get('activity_10km', 'n/a')}; "\n'''
          if old not in text:
              raise SystemExit('Solnyshko log block not found')
          pre.write_text(text.replace(old, new), encoding='utf-8')

          tests = Path('tests/test_poi_context.py')
          text = tests.read_text(encoding='utf-8')
          marker = '''    def test_grid_distance_count(self) -> None:\n'''
          addition = '''    def test_grid_distance_count_10km_background(self) -> None:\n        index = FoodShopIndex.empty()\n        index.add(55.0000, 60.0000)\n        index.add(55.0500, 60.0000)\n        index.add(55.1200, 60.0000)\n        self.assertEqual(index.count_within(55.0000, 60.0000, 10.0), 2)\n\n'''
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          tests.write_text(text.replace(marker, addition + marker), encoding='utf-8')
          PY

      - name: Verify
        run: |
          python -m py_compile uralla_build/poi_context.py uralla_build/preprocessor.py
          python -m unittest tests.test_poi_context -v
          grep -q 'POI_ACTIVITY_10KM_TAG' uralla_build/poi_context.py
          grep -q 'activity10km=' uralla_build/preprocessor.py
          bash -n scripts/test-poi-context.sh

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/poi_context.py uralla_build/preprocessor.py tests/test_poi_context.py
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Add 10 km activity background diagnostics'
            git push
          fi
