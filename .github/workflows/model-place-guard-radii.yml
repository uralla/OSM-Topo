name: Model place guard radii

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/model-place-guard-radii.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add guard radius scenarios and named sample diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          poi = Path('uralla_build/poi_context.py')
          text = poi.read_text(encoding='utf-8')
          old = '''    def nearest_within(\n        self, lat: float, lon: float, radius_km: float\n    ) -> tuple[float, str, str | None] | None:\n        lat_delta = radius_km / 110.574\n        lon_scale = max(111.320 * abs(cos(radians(lat))), 1.0)\n        lon_delta = radius_km / lon_scale\n        min_y = floor((lat - lat_delta) / GRID_DEGREES)\n        max_y = floor((lat + lat_delta) / GRID_DEGREES)\n        min_x = floor((lon - lon_delta) / GRID_DEGREES)\n        max_x = floor((lon + lon_delta) / GRID_DEGREES)\n        nearest: tuple[float, str, str | None] | None = None\n        for y in range(min_y, max_y + 1):\n            for x in range(min_x, max_x + 1):\n                for candidate_lat, candidate_lon, place_type, name in self.cells.get((y, x), ()):\n                    distance = _haversine_km(lat, lon, candidate_lat, candidate_lon)\n                    if distance <= radius_km and (nearest is None or distance < nearest[0]):\n                        nearest = (distance, place_type, name)\n        return nearest\n'''
          new = old + '''\n    def nearest_by_type_within(\n        self, lat: float, lon: float, radius_km: float\n    ) -> dict[str, tuple[float, str | None]]:\n        lat_delta = radius_km / 110.574\n        lon_scale = max(111.320 * abs(cos(radians(lat))), 1.0)\n        lon_delta = radius_km / lon_scale\n        min_y = floor((lat - lat_delta) / GRID_DEGREES)\n        max_y = floor((lat + lat_delta) / GRID_DEGREES)\n        min_x = floor((lon - lon_delta) / GRID_DEGREES)\n        max_x = floor((lon + lon_delta) / GRID_DEGREES)\n        nearest: dict[str, tuple[float, str | None]] = {}\n        for y in range(min_y, max_y + 1):\n            for x in range(min_x, max_x + 1):\n                for candidate_lat, candidate_lon, place_type, name in self.cells.get((y, x), ()):\n                    distance = _haversine_km(lat, lon, candidate_lat, candidate_lon)\n                    current = nearest.get(place_type)\n                    if distance <= radius_km and (current is None or distance < current[0]):\n                        nearest[place_type] = (distance, name)\n        return nearest\n'''
          if old not in text:
              raise SystemExit('nearest_within block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '    nearest_place = places.nearest_within(lat, lon, 10.0)\n',
              '    nearest_place = places.nearest_within(lat, lon, 10.0)\n    nearest_places_by_type = places.nearest_by_type_within(lat, lon, 10.0)\n',
              1,
          )
          text = text.replace(
              '        "place_name": nearest_place[2] if nearest_place is not None else None,\n',
              '        "place_name": nearest_place[2] if nearest_place is not None else None,\n        "place_by_type": {key: {"distance_km": value[0], "name": value[1]} for key, value in nearest_places_by_type.items()},\n',
              1,
          )
          poi.write_text(text, encoding='utf-8')

          pre = Path('uralla_build/preprocessor.py')
          text = pre.read_text(encoding='utf-8')
          marker = '''            _emit_progress(\n                "POI remote place proximity: "\n                f"<=0.5km={remote_place_bands['<=0.5km']:,}; "\n                f"<=1km={remote_place_bands['<=1km']:,}; "\n                f"<=2km={remote_place_bands['<=2km']:,}; "\n                f"<=5km={remote_place_bands['<=5km']:,}; "\n                f"<=10km={remote_place_bands['<=10km']:,}; "\n                f">10km={remote_place_bands['>10km']:,}"\n            )\n\n'''
          addition = marker + '''            guard_scenarios = {\n                "tight": {"city": 5.0, "town": 3.0, "village": 1.0, "hamlet": 0.5},\n                "medium": {"city": 7.0, "town": 5.0, "village": 2.0, "hamlet": 1.0},\n                "wide": {"city": 10.0, "town": 7.0, "village": 3.0, "hamlet": 1.5},\n            }\n            for scenario_name, radii in guard_scenarios.items():\n                promoted = 0\n                remaining = 0\n                by_kind: Counter[str] = Counter()\n                for sample in activity_context_samples:\n                    context = classify_activity_context(\n                        activity_2km=int(sample["activity_2km"]),\n                        activity_10km=int(sample["activity_10km"]),\n                        local_p25=activity_2km_p25,\n                        local_p75=activity_2km_p75,\n                        background_p25=activity_10km_p25,\n                        background_p75=activity_10km_p75,\n                    )\n                    if context != "remote":\n                        continue\n                    by_type = sample.get("place_by_type") or {}\n                    guarded = any(\n                        place_type in by_type\n                        and float(by_type[place_type]["distance_km"]) <= radius\n                        for place_type, radius in radii.items()\n                    )\n                    if guarded:\n                        promoted += 1\n                        by_kind[str(sample.get("kind") or "other")] += 1\n                    else:\n                        remaining += 1\n                _emit_progress(\n                    "POI place guard scenario: "\n                    f"name={scenario_name}; promoted={promoted:,}; remaining_remote={remaining:,}; "\n                    f"food={by_kind['food']:,}; accommodation={by_kind['accommodation']:,}; "\n                    f"transit={by_kind['transit']:,}; "\n                    f"radii=city:{radii['city']:g},town:{radii['town']:g},village:{radii['village']:g},hamlet:{radii['hamlet']:g}km"\n                )\n\n            for sample in activity_context_samples:\n                if normalize_text(str(sample.get("name") or "")) != "старый крым":\n                    continue\n                context = classify_activity_context(\n                    activity_2km=int(sample["activity_2km"]),\n                    activity_10km=int(sample["activity_10km"]),\n                    local_p25=activity_2km_p25,\n                    local_p75=activity_2km_p75,\n                    background_p25=activity_10km_p25,\n                    background_p75=activity_10km_p75,\n                )\n                _emit_progress(\n                    "POI named check: 'Старый Крым'; "\n                    f"id={sample.get('id')}; kind={sample.get('kind')}; context={context}; "\n                    f"priority={sample.get('priority')}; 2km={sample.get('activity_2km')}; "\n                    f"10km={sample.get('activity_10km')}; place={sample.get('place_name')!r}; "\n                    f"place_type={sample.get('place_type')}; "\n                    f"place_km={format(float(sample['place_distance_km']), '.2f') if sample.get('place_distance_km') is not None else 'n/a'}; "\n                    f"lat={float(sample['lat']):.6f}; lon={float(sample['lon']):.6f}"\n                )\n\n'''
          if marker not in text:
              raise SystemExit('remote place proximity marker not found')
          text = text.replace(marker, addition, 1)
          pre.write_text(text, encoding='utf-8')

          script = Path('scripts/test-poi-context.sh')
          s = script.read_text(encoding='utf-8')
          if 'POI place guard scenario:' not in s:
              s = s.replace('POI remote place proximity:|POI activity sample:', 'POI remote place proximity:|POI place guard scenario:|POI named check:|POI activity sample:')
          script.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python -m py_compile uralla_build/poi_context.py uralla_build/preprocessor.py
          python -m unittest tests.test_poi_context -v
          grep -q 'nearest_by_type_within' uralla_build/poi_context.py
          grep -q 'POI place guard scenario:' uralla_build/preprocessor.py
          grep -q "POI named check: 'Старый Крым'" uralla_build/preprocessor.py
          grep -q 'POI place guard scenario:' scripts/test-poi-context.sh
          bash -n scripts/test-poi-context.sh

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/poi_context.py uralla_build/preprocessor.py scripts/test-poi-context.sh
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Model settlement place guard radii'
            git push
          fi
