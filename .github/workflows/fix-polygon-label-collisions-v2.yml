name: Finalize polygon label collisions

on:
  push:
    paths:
      - '.github/workflows/fix-polygon-label-collisions-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply and verify polygon fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('styles/uralla/polygons')
          t = Path('styles/uralla.txt')
          style = p.read_text(encoding='utf-8')
          typ = t.read_text(encoding='utf-8')

          old = '''highway=pedestrian & (area=yes | mkgmap:mp_created=true)\n\t| highway=footway & (area=yes | mkgmap:mp_created=true)\n\t| highway=rest_area & (area=yes | mkgmap:mp_created=true)\n\t| highway=living_street & (area=yes | mkgmap:mp_created=true)\n\t| highway=residential & (area=yes | mkgmap:mp_created=true)\n\t| highway=unclassified & (area=yes | mkgmap:mp_created=true) [0x0d resolution 21]\n'''
          new = old.replace('[0x0d resolution 21]', '[0x10f12 resolution 21]')
          assert style.count(old) == 1
          assert '0x10f12' not in style
          style = style.replace(old, new, 1)

          pairs = [
              ('place=town [0x01 resolution 19]', 'place=town & building!=* [0x01 resolution 19]'),
              ('place=city [0x02 resolution 18]', 'place=city & building!=* [0x02 resolution 18]'),
              ('place=suburb [0x02 resolution 22]', 'place=suburb & building!=* [0x02 resolution 22]'),
              ('place=village [0x03 resolution 21]', 'place=village & building!=* [0x03 resolution 21]'),
              ('place=hamlet [0x03 resolution 21]', 'place=hamlet & building!=* [0x03 resolution 21]'),
              ('place=locality [0x03 resolution 21]', 'place=locality & building!=* [0x03 resolution 21]'),
              ('place=isolated_dwelling [0x03 resolution 21]', 'place=isolated_dwelling & building!=* [0x03 resolution 21]'),
          ]
          for before, after in pairs:
              assert style.count(before) == 1
              style = style.replace(before, after, 1)
          p.write_text(style, encoding='utf-8')

          assert 'Type=0x10f12' not in typ
          typ = typ.replace('Type=0x10f10,5\n', 'Type=0x10f10,5\nType=0x10f12,4\n', 1)
          src = re.search(r'(?ms)^\[_polygon\]\nType=0x0d\n.*?^\[end\]\n?', typ)
          assert src
          block = src.group(0)
          assert '"1 c #FFCA8B"' in block
          custom = block.replace('Type=0x0d', 'Type=0x10f12', 1)
          custom = re.sub(r'^;GRMN_TYPE:.*$', ';GRMN_TYPE: Customizable Areas/PEDESTRIAN_SQUARE/Pedestrian or road area', custom, count=1, flags=re.M)
          custom = re.sub(r'^String1=.*$', 'String1=0x19,пешеходная зона', custom, count=1, flags=re.M)
          custom = re.sub(r'^String2=.*$', 'String2=0x04,pedestrian area', custom, count=1, flags=re.M)
          typ = typ[:src.end()] + '\n' + custom + typ[src.end():]
          t.write_text(typ, encoding='utf-8')

          # Direct postconditions.
          style = p.read_text(encoding='utf-8')
          typ = t.read_text(encoding='utf-8')
          area = style[style.index('# squares and plazas'):style.index('# ж/д платформы как площади')]
          assert '0x10f12 resolution 21' in area
          assert '0x0d resolution 21' not in area
          for _, after in pairs:
              assert after in style
          assert '(building=* | bridge=yes & area=yes)' in style
          assert '[0x13 resolution 24]' in style
          m = re.search(r'(?ms)^\[_polygon\]\nType=0x10f12\n.*?^\[end\]', typ)
          assert m
          assert 'String1=0x19,пешеходная зона' in m.group(0)
          assert '"1 c #FFCA8B"' in m.group(0)
          b = re.search(r'(?ms)^\[_polygon\]\nType=0x13\n.*?^\[end\]', typ)
          assert b and 'String1=0x19,здание' in b.group(0)

          Path('tests/test_polygon_label_collisions.py').write_text('''from pathlib import Path\n\nROOT = Path(__file__).resolve().parents[1]\nPOLYGONS = ROOT / "styles" / "uralla" / "polygons"\nTYP = ROOT / "styles" / "uralla.txt"\n\ndef test_polygon_label_collision_fixes_are_present():\n    style = POLYGONS.read_text(encoding="utf-8")\n    typ = TYP.read_text(encoding="utf-8")\n    area = style[style.index("# squares and plazas"):style.index("# ж/д платформы как площади")]\n    assert "0x10f12 resolution 21" in area\n    assert "0x0d resolution 21" not in area\n    assert "String1=0x19,пешеходная зона" in typ\n    assert "Type=0x10f12" in typ\n    assert "String1=0x19,здание" in typ\n    for place in ("town", "city", "suburb", "village", "hamlet", "locality", "isolated_dwelling"):\n        assert f"place={place} & building!=*" in style\n''', encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/fix-polygon-label-collisions.yml .github/workflows/fix-polygon-label-collisions-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/polygons styles/uralla.txt tests/test_polygon_label_collisions.py .github/workflows/fix-polygon-label-collisions.yml .github/workflows/fix-polygon-label-collisions-v2.yml
          git commit -m 'Fix pedestrian and building polygon labels'
          git push
