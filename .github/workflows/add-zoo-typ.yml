name: Add zoo TYP block
on: push
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/zoo_typ_patch.py
      - run: rm .github/workflows/add-zoo-typ.yml .github/zoo_typ_patch.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Add zoo POI TYP block"
          git push
