name: Fix toll booth point type

on:
  push:
    paths:
      - '.github/workflows/fix-toll-booth-type.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix toll booth type
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('styles/uralla/points')
          s = p.read_text(encoding='utf-8')
          old = 'barrier=toll_booth [0x58 resolution 24]'
          new = "barrier=toll_booth { name '${name}' | 'пункт оплаты' } [0x5800 resolution 24]"
          if old not in s:
              raise SystemExit('toll_booth 0x58 rule not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -F "barrier=toll_booth { name '\${name}' | 'пункт оплаты' } [0x5800 resolution 24]" styles/uralla/points
          ! grep -F 'barrier=toll_booth [0x58 resolution 24]' styles/uralla/points
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles/uralla/points
          git commit -m 'Fix toll booth Garmin point type'
          git push
