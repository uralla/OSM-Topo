name: Migrate remaining 0x115 POIs

on:
  push:
    paths:
      - '.github/workflows/migrate-remaining-115.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Migrate POIs, quiet preprocess summary, and low peaks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          mapping = {
              '0x11500': '0x6609',  # boundary stone
              '0x11501': '0x641e',  # wastewater plant
              '0x11504': '0x660a',  # locality
              '0x11506': '0x660b',  # cairn
              '0x11507': '0x660c',  # saddle / mountain pass
              '0x11509': '0x2b08',  # chalet
          }

          production_files = [
              Path('styles/uralla/points'),
              Path('styles/uralla/inc/place_points'),
              Path('styles/uralla/inc/priority_points'),
              Path('styles/uralla/inc/landuse_points'),
          ]

          # New destinations must be unused before the migration.
          production_text = '\n'.join(p.read_text(encoding='utf-8') for p in production_files)
          typ_path = Path('styles/uralla.txt')
          typ = typ_path.read_text(encoding='utf-8')
          for new in mapping.values():
              assert new not in production_text, f'destination already used in style: {new}'
              t = int(new[2:4], 16)
              st = int(new[4:6], 16)
              pattern = rf'(?ms)^\[_point\]\s*\nType=0x0?{t:02x}\s*\nSubType=0x{st:02x}\b.*?^\[end\]'
              assert not re.search(pattern, typ, re.I), f'destination already used in TYP: {new}'

          # Move every live production rule.
          counts = {old: 0 for old in mapping}
          for path in production_files:
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  n = text.count(old)
                  counts[old] += n
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          expected = {
              '0x11500': 1,
              '0x11501': 1,
              '0x11504': 1,
              '0x11506': 1,
              '0x11507': 2,
              '0x11509': 1,
          }
          assert counts == expected, (counts, expected)

          # Move each TYP bitmap block intact, changing only its Garmin address
          # and descriptive comment. This preserves the exact symbol artwork.
          descriptions = {
              '00': 'Geographic/BOUNDARY_STONE/Boundary stone',
              '01': 'Man-made/WASTEWATER_PLANT/Wastewater treatment plant',
              '04': 'Geographic/LOCALITY/Named locality',
              '06': 'Geographic/CAIRN/Cairn',
              '07': 'Geographic/SADDLE_MOUNTAIN_PASS/Saddle or mountain pass',
              '09': 'Business - Lodging/CHALET/Detached holiday cottage',
          }
          for old, new in mapping.items():
              old_sub = old[-2:]
              new_type = int(new[2:4], 16)
              new_sub = int(new[4:6], 16)
              pattern = re.compile(
                  rf'(?ms)^\[_point\]\nType=0x115\nSubType=0x{old_sub}\n.*?^\[end\]'
              )
              matches = list(pattern.finditer(typ))
              assert len(matches) == 1, f'{old}: expected one TYP block, got {len(matches)}'
              block = matches[0].group(0)
              block = block.replace('Type=0x115', f'Type=0x{new_type:03x}', 1)
              block = block.replace(f'SubType=0x{old_sub}', f'SubType=0x{new_sub:02x}', 1)
              if re.search(r'^;GRMN_TYPE:.*$', block, re.M):
                  block = re.sub(
                      r'^;GRMN_TYPE:.*$',
                      f';GRMN_TYPE: {descriptions[old_sub]}',
                      block,
                      count=1,
                      flags=re.M,
                  )
              typ = typ[:matches[0].start()] + block + typ[matches[0].end():]
          assert 'Type=0x115' not in typ, '0x115 TYP blocks remain after migration'
          typ_path.write_text(typ, encoding='utf-8')

          # Low, minor peaks/hills: icon only. Put this before both landmark and
          # ordinary summit rules so even a catalogue entry below 200 m is not
          # promoted to a mountain-style symbol.
          landuse = Path('styles/uralla/inc/landuse_points')
          text = landuse.read_text(encoding='utf-8')
          anchor = '# Static catalogue enrichment from the semantic preprocessor.\n'
          rule = (
              '# Minor relief below 200 m: peak/hill is only a close-zoom terrain marker.\n'
              '# No name/elevation label is drawn for these low summits.\n'
              '(natural=peak | natural=hill) & ele < 200 [0x6615 resolution 24]\n\n'
          )
          assert anchor in text
          assert rule not in text
          text = text.replace(anchor, rule + anchor, 1)
          landuse.write_text(text, encoding='utf-8')

          # Human CLI no longer dumps the complete machine report after preprocess.
          cli = Path('uralla_build/cli.py')
          text = cli.read_text(encoding='utf-8')
          old = '''    if args.json:\n        print(json.dumps({"ok": True, "report": report}, ensure_ascii=False, indent=2))\n    else:\n        print(json.dumps(report, ensure_ascii=False, indent=2))\n    return 0\n'''
          new = '''    if args.json:\n        print(json.dumps({"ok": True, "report": report}, ensure_ascii=False, indent=2))\n    else:\n        print(f"[preprocess] done; report: {args.report}")\n    return 0\n'''
          assert text.count(old) == 1
          cli.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Current tests must follow the new addresses. Historical docs are not
          # rewritten; they are snapshots and are explicitly non-authoritative.
          for path in Path('tests').glob('test_*.py'):
              if path.name == 'test_group_115_migration.py':
                  continue
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  text = text.replace(old, new).replace(old.upper(), new.upper())
                  text = text.replace(old[2:].upper(), new[2:].upper())
              path.write_text(text, encoding='utf-8')

          guard = Path('tests/test_group_115_migration.py')
          guard.write_text('''from pathlib import Path\nimport re\nimport unittest\n\n\nROOT = Path(__file__).resolve().parents[1]\nSTYLE = ROOT / "styles" / "uralla"\nTYP = ROOT / "styles" / "uralla.txt"\nINCLUDE_RE = re.compile(r"^\\s*include\\s+'([^']+)'\\s*;", re.MULTILINE)\nSTYLE_115_RE = re.compile(r"\\[0x115([0-9a-fA-F]{2})\\b")\nTYP_115_RE = re.compile(r"(?ms)^\\[_point\\]\\s*\\nType=0x115\\s*\\nSubType=0x([0-9a-fA-F]{2})\\b.*?^\\[end\\]")\n\nMIGRATED = {\n    "0x11500": "0x6609",\n    "0x11501": "0x641e",\n    "0x11504": "0x660a",\n    "0x11505": "0x2f1a",\n    "0x11506": "0x660b",\n    "0x11507": "0x660c",\n    "0x11509": "0x2b08",\n    "0x1150a": "0x2f18",\n}\n\n\ndef _production_point_files() -> list[Path]:\n    result: list[Path] = []\n    seen: set[Path] = set()\n    def visit(path: Path) -> None:\n        path = path.resolve()\n        if path in seen:\n            return\n        seen.add(path)\n        result.append(path)\n        text = path.read_text(encoding="utf-8")\n        for relative in INCLUDE_RE.findall(text):\n            visit(STYLE / relative)\n    visit(STYLE / "points")\n    return result\n\n\nclass Group115MigrationTests(unittest.TestCase):\n    def test_no_production_style_uses_group_115(self) -> None:\n        found: set[int] = set()\n        for path in _production_point_files():\n            found.update(int(v, 16) for v in STYLE_115_RE.findall(path.read_text(encoding="utf-8")))\n        self.assertEqual(set(), found)\n\n    def test_typ_has_no_group_115_point_blocks(self) -> None:\n        self.assertEqual(set(), {int(v, 16) for v in TYP_115_RE.findall(TYP.read_text(encoding="utf-8"))})\n\n    def test_migration_destinations_remain_in_production(self) -> None:\n        production = "\\n".join(path.read_text(encoding="utf-8") for path in _production_point_files())\n        typ = TYP.read_text(encoding="utf-8")\n        for old, new in MIGRATED.items():\n            self.assertNotIn(old, production)\n            self.assertIn(new, production, new)\n            t = int(new[2:4], 16)\n            st = int(new[4:6], 16)\n            self.assertRegex(typ, rf"(?ms)^\\[_point\\]\\s*\\nType=0x0?{t:02x}\\s*\\nSubType=0x{st:02x}\\b.*?^\\[end\\]")\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          Path('tests/test_low_peak_style.py').write_text('''from pathlib import Path\nimport unittest\n\nROOT = Path(__file__).resolve().parents[1]\nLANDUSE = ROOT / "styles" / "uralla" / "inc" / "landuse_points"\n\nclass LowPeakStyleTests(unittest.TestCase):\n    def test_peak_and_hill_below_200m_use_only_6615(self) -> None:\n        text = LANDUSE.read_text(encoding="utf-8")\n        rule = "(natural=peak | natural=hill) & ele < 200 [0x6615 resolution 24]"\n        self.assertIn(rule, text)\n        self.assertLess(text.index(rule), text.index("uralla:peak_landmark=yes"))\n        self.assertLess(text.index(rule), text.index("natural=peak & ele=* & name=*"))\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')

          # Update authoritative current-state record.
          doc = Path('docs/POI_115_MIGRATION.md')
          doc.write_text('''# POI group `0x115` migration\n\nThis file is the authoritative **current-state** record for POI group `0x115`. Historical snapshots under `docs/history/` remain historical and must not be used as current state.\n\n## Status: COMPLETE\n\nThere are no production point rules and no TYP `_point` blocks left in group `0x115`. `tests/test_group_115_migration.py` enforces this.\n\n## Confirmed migrations\n\n| Old type | Meaning | Current type |\n| --- | --- | --- |\n| `0x11500` | межевой знак | `0x6609` |\n| `0x11501` | очистные сооружения | `0x641e` |\n| `0x11504` | урочище / locality | `0x660a` |\n| `0x11505` | пчеловод | `0x2f1a` |\n| `0x11506` | тура | `0x660b` |\n| `0x11507` | седловина / перевал | `0x660c` |\n| `0x11509` | chalet / домик | `0x2b08` |\n| `0x1150a` | велосипеды / велосервис | `0x2f18` |\n\nThe six final moves preserve the original TYP bitmap blocks; only their Garmin type/subtype addresses and descriptive comments changed. This prevents a style rule from moving while its custom symbol remains behind.\n\nMissing subtype numbers that have no proven migration remain merely historical/inactive gaps; they are not retroactively classified as migrations.\n''', encoding='utf-8')
          PY
      - name: Run focused tests
        run: |
          python -m pytest -q \
            tests/test_group_115_migration.py \
            tests/test_low_peak_style.py \
            tests/test_topo_marker_points.py \
            tests/test_mountain_pass_style.py \
            tests/test_chalet_point_style.py \
            tests/test_bicycle_poi_style.py
      - name: Ensure no live 0x115 references remain
        shell: bash
        run: |
          ! grep -R -n --exclude-dir=history --exclude='POI_115_MIGRATION.md' --exclude='test_group_115_migration.py' '0x1150[014679]' styles tests uralla_build
          ! grep -n '^Type=0x115$' styles/uralla.txt
      - name: Commit migration and remove workflow
        shell: bash
        run: |
          rm .github/workflows/migrate-remaining-115.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles uralla_build/cli.py tests docs/POI_115_MIGRATION.md .github/workflows/migrate-remaining-115.yml
          git commit -m 'Complete 0x115 POI migration and refine low peaks'
          git push
