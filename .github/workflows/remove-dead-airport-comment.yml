name: Remove dead airport comment

"on":
  push:
    paths:
      - ".github/workflows/remove-dead-airport-comment.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove dead 0x5900 airport comment
        shell: python
        run: |
          from pathlib import Path
          path = Path("styles/uralla/points")
          text = path.read_text(encoding="utf-8")
          old = "#aeroway=airport [0x5900 resolution 18]\n"
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one dead airport comment, found {text.count(old)}")
          text = text.replace(old, "", 1)
          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/remove-dead-airport-comment.yml").unlink()
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/points .github/workflows/remove-dead-airport-comment.yml
          git commit -m "Remove dead airport 0x5900 comment"
          git pull --rebase origin main
          git push
