name: Apply agreed cave/debris TYP icons and validate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-final-typ-icons-and-check.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch only the agreed point TYP graphics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('styles/uralla.txt')
          raw = p.read_bytes()
          try:
              text = raw.decode('utf-8')
              enc = 'utf-8'
          except UnicodeDecodeError:
              text = raw.decode('cp1251')
              enc = 'cp1251'
          nl = '\r\n' if '\r\n' in text else '\n'

          section_rx = re.compile(r'(?ims)^\[_point\][ \t]*\r?\n.*?^\[end\][ \t]*(?:\r?\n)?')

          def code_of(block: str):
              tm = re.search(r'(?im)^Type=0x([0-9a-f]+)\b', block)
              sm = re.search(r'(?im)^SubType=0x([0-9a-f]+)\b', block)
              if not tm:
                  return None
              typ = tm.group(1).lower().lstrip('0') or '0'
              if sm:
                  return '0x' + typ + sm.group(1).lower().zfill(2)
              return '0x' + typ

          def replace_icon(block: str, code: str, ru: str, en: str, palette, pixels):
              lines = block.splitlines()
              if len(pixels) != 16 or any(len(row) != 16 for row in pixels):
                  raise RuntimeError(f'{code}: icon must be exactly 16x16')
              new_xpm = ['Xpm="16 16 %d 1"' % len(palette), *palette, *[f'"{row}"' for row in pixels]]

              xpm_i = next((i for i, line in enumerate(lines) if line.startswith('Xpm=')), None)
              if xpm_i is None:
                  # 0x11602 is an intentionally empty custom slot: insert its first
                  # graphic before labels/[end], preserving the existing Type/SubType
                  # and metadata lines exactly.
                  insert_i = next(
                      (i for i, line in enumerate(lines)
                       if line.startswith('String') or line.strip().lower() == '[end]'),
                      None,
                  )
                  if insert_i is None:
                      raise RuntimeError(f'{code}: no safe Xpm insertion point')
                  lines[insert_i:insert_i] = new_xpm
              else:
                  m = re.match(r'Xpm="(\d+)\s+(\d+)\s+(\d+)\s+(\d+)"', lines[xpm_i])
                  if not m:
                      raise RuntimeError(f'{code}: unsupported Xpm declaration: {lines[xpm_i]}')
                  old_h, old_colors = int(m.group(2)), int(m.group(3))
                  old_end = xpm_i + 1 + old_colors + old_h
                  if old_end > len(lines):
                      raise RuntimeError(f'{code}: malformed Xpm block')
                  lines[xpm_i:old_end] = new_xpm

              def set_string(prefix, value):
                  for i, line in enumerate(lines):
                      if line.startswith(prefix + '='):
                          lines[i] = f'{prefix}={value}'
                          return
                  end_i = next(i for i, line in enumerate(lines) if line.strip().lower() == '[end]')
                  lines.insert(end_i, f'{prefix}={value}')

              set_string('String1', f'0x19,{ru}')
              set_string('String2', f'0x04,{en}')
              return nl.join(lines) + (nl if block.endswith(('\n', '\r')) else '')

          cave_palette = [
              '"  c none"',
              '"X c #202020"',
              '"O c #FFFFFF"',
          ]
          cave = [
              '       XX       ',
              '      XXXX      ',
              '     XXXXXX     ',
              '    XXXXXXXX    ',
              '   XXXXXXXXXX   ',
              '  XXXXXXXXXXXX  ',
              ' XXXXXXXXXXXXXX ',
              'XXXXXXXXXXXXXXXX',
              'XXXXXXOOOOXXXXXX',
              'XXXXXOOOOOOXXXXX',
              'XXXXOOOOOOOOXXXX',
              'XXXOOOOOOOOOOXXX',
              'XXXOOOOOOOOOOXXX',
              'XXXOOOOOOOOOOXXX',
              'XXXOOOOOOOOOOXXX',
              'XXXOOOOOOOOOOXXX',
          ]

          debris_palette = [
              '"  c none"',
              '"X c #202020"',
          ]
          debris = [
              'XX            XX',
              'XXX          XXX',
              ' XXX        XXX ',
              '  XXX      XXX  ',
              '   XXX    XXX   ',
              '    XXX  XXX    ',
              '     XXXXXX     ',
              'XXXXXXXXXXXXXXXX',
              'XXXXXXXXXXXXXXXX',
              '     XXXXXX     ',
              '    XXX  XXX    ',
              '   XXX    XXX   ',
              '  XXX      XXX  ',
              ' XXX        XXX ',
              'XXX          XXX',
              'XX            XX',
          ]

          targets = {
              '0x6602': ('завал', 'debris / fallen tree', debris_palette, debris),
              '0x11602': ('пещера', 'cave entrance', cave_palette, cave),
          }

          matches = list(section_rx.finditer(text))
          found = {k: 0 for k in targets}
          for m in reversed(matches):
              code = code_of(m.group(0))
              if code not in targets:
                  continue
              found[code] += 1
              ru, en, palette, pixels = targets[code]
              new = replace_icon(m.group(0), code, ru, en, palette, pixels)
              text = text[:m.start()] + new + text[m.end():]

          if found != {'0x6602': 1, '0x11602': 1}:
              raise RuntimeError(f'expected exactly one section for each target, got {found}')

          before = raw.decode(enc)
          def sections(src, kind):
              rx = re.compile(rf'(?ims)^\[{re.escape(kind)}\][ \t]*\r?\n.*?^\[end\][ \t]*(?:\r?\n)?')
              return [x.group(0) for x in rx.finditer(src)]
          if sections(before, '_line') != sections(text, '_line'):
              raise RuntimeError('line TYP sections changed unexpectedly')
          if sections(before, '_polygon') != sections(text, '_polygon'):
              raise RuntimeError('polygon TYP sections changed unexpectedly')
          before_other = [b for b in sections(before, '_point') if code_of(b) not in targets]
          after_other = [b for b in sections(text, '_point') if code_of(b) not in targets]
          if before_other != after_other:
              raise RuntimeError('non-target point TYP sections changed unexpectedly')

          p.write_bytes(text.encode(enc))
          print(f'Updated 0x6602 and 0x11602; preserved encoding={enc}')
          PY

      - name: Download pinned mkgmap r4924
        run: |
          curl -fsSLO https://www.mkgmap.org.uk/download/mkgmap-r4924.zip
          echo 'b2170799b61a95d4fc258e8e4fb4e21396809e0390789178f94c77109f8e0d84  mkgmap-r4924.zip' | sha256sum -c -
          unzip -q mkgmap-r4924.zip

      - name: Validate mkgmap style syntax
        run: |
          java -jar mkgmap-r4924/mkgmap.jar \
            --check-styles \
            --style-file=styles \
            --style=uralla

      - name: Compile direct TYP source
        run: |
          mkdir -p /tmp/typ-check
          java -jar mkgmap-r4924/mkgmap.jar \
            --code-page=1251 \
            --output-dir=/tmp/typ-check \
            styles/uralla.txt
          test -n "$(find /tmp/typ-check -maxdepth 1 -type f -name '*.typ' -print -quit)"

      - name: Commit direct TYP source and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla.txt
          git rm .github/workflows/apply-final-typ-icons-and-check.yml
          git commit -m "Add agreed cave and debris TYP icons"
          git push origin HEAD:main
