name: One-shot live all stages
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-live-all-stages.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply exact patch
        run: python3 .github/scripts/one_shot_live_all_stages.py
      - name: Install project
        run: python3 -m pip install -e .
      - name: Verify
        run: |
          python3 -m py_compile uralla_build/runner.py
          python3 -m unittest tests.test_live_stage_output -v
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+uralla@users.noreply.github.com
          git add uralla_build/runner.py tests/test_live_stage_output.py
          git commit -m 'Stream output for all build stages'
          git push
# retrigger after test harness fix
