name: Universal activity context prototype

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Prepare universal activity context prototype'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch universal activity context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('uralla_build/poi_context.py')
          s = p.read_text()

          s = s.replace(
              'POI_NEAR_10KM_TAG = "uralla:poi_food_10km"\nGRID_DEGREES = 0.05\n',
              'POI_NEAR_10KM_TAG = "uralla:poi_food_10km"\n'
              'POI_ACTIVITY_500M_TAG = "uralla:poi_activity_500m"\n'
              'POI_ACTIVITY_2KM_TAG = "uralla:poi_activity_2km"\n'
              'CONTEXT_METADATA_KEYS = frozenset({"source", "created_by", "attribution", "note", "fixme", "check_date", "survey:date"})\n'
              'GRID_DEGREES = 0.05\n'
          )

          marker = 'def is_food_shop(tags: Mapping[str, str] | object) -> bool:\n'
          insert = '''def is_meaningful_context_node(tags: Mapping[str, str] | object) -> bool:\n    """Return True for a tagged node carrying real map semantics.\n\n    Untagged geometry vertices never reach this predicate as meaningful context;\n    metadata-only nodes are excluded so detailed geometry cannot fake urban density.\n    """\n\n    items = tags.items() if isinstance(tags, Mapping) else iter(tags)  # type: ignore[arg-type]\n    for raw_key, raw_value in items:\n        key = str(raw_key)\n        value = str(raw_value)\n        if not value:\n            continue\n        if key in CONTEXT_METADATA_KEYS:\n            continue\n        if key.startswith(("source:", "note:", "fixme:", "check_date:")):\n            continue\n        return True\n    return False\n\n\n'''
          if insert not in s:
              s = s.replace(marker, insert + marker)

          marker = 'def build_food_shop_index(source: str, osmium: Any) -> FoodShopIndex:\n'
          insert = '''@dataclass(slots=True)\nclass ContextIndexes:\n    food: FoodShopIndex\n    accommodation: FoodShopIndex\n    transit: FoodShopIndex\n    activity: FoodShopIndex\n\n\ndef build_context_indexes(source: str, osmium: Any) -> ContextIndexes:\n    """Build all current node context indexes in one PBF pass."""\n\n    food = FoodShopIndex.empty()\n    accommodation = FoodShopIndex.empty()\n    transit = FoodShopIndex.empty()\n    activity = FoodShopIndex.empty()\n    for item in osmium.FileProcessor(source):\n        location = valid_node_location(item)\n        if location is None:\n            continue\n        tags = {str(key): str(value) for key, value in item.tags}\n        if is_meaningful_context_node(tags):\n            activity.add(*location)\n        if is_food_shop(tags):\n            food.add(*location)\n        if is_accommodation(tags):\n            accommodation.add(*location)\n        if is_transit_stop(tags):\n            transit.add(*location)\n    return ContextIndexes(food, accommodation, transit, activity)\n\n\ndef enrich_activity_diagnostics(\n    item: object,\n    tags: Mapping[str, str] | object,\n    index: FoodShopIndex,\n) -> tuple[dict[str, str], bool, dict[str, object] | None]:\n    """Attach general human-activity density diagnostics to context-aware POIs."""\n\n    items = tags.items() if isinstance(tags, Mapping) else iter(tags)  # type: ignore[arg-type]\n    result = {str(key): str(value) for key, value in items}\n    if POI_PRIORITY_TAG not in result:\n        return result, False, None\n    location = valid_node_location(item)\n    if location is None:\n        return result, False, None\n    lat, lon = location\n    activity_500m = index.count_within(lat, lon, 0.5)\n    activity_2km = index.count_within(lat, lon, 2.0)\n    desired = {\n        POI_ACTIVITY_500M_TAG: str(activity_500m),\n        POI_ACTIVITY_2KM_TAG: str(activity_2km),\n    }\n    changed = any(result.get(key) != value for key, value in desired.items())\n    result.update(desired)\n    return result, changed, {\n        "id": int(getattr(item, "id", 0)),\n        "name": result.get("name"),\n        "priority": result.get(POI_PRIORITY_TAG),\n        "activity_500m": activity_500m,\n        "activity_2km": activity_2km,\n        "lat": lat,\n        "lon": lon,\n    }\n\n\n'''
          if insert not in s:
              s = s.replace(marker, insert + marker)
          p.write_text(s)

          p = Path('uralla_build/preprocessor.py')
          s = p.read_text()
          old = '''from .poi_context import (\n    build_accommodation_index,\n    build_food_shop_index,\n    build_transit_stop_index,\n    enrich_accommodation_context,\n    enrich_food_shop_context,\n    enrich_transit_stop_context,\n    nearest_accommodation_details,\n)'''
          new = '''from .poi_context import (\n    build_context_indexes,\n    enrich_accommodation_context,\n    enrich_activity_diagnostics,\n    enrich_food_shop_context,\n    enrich_transit_stop_context,\n    nearest_accommodation_details,\n)'''
          if old not in s:
              raise SystemExit('poi_context import block not found')
          s = s.replace(old, new)

          old = '''    _emit_progress("food-shop context: indexing node shops")\n    context_started = time.monotonic()\n    food_shop_index = build_food_shop_index(str(source), osmium)\n    _emit_progress(\n        f"food-shop context: {food_shop_index.shop_count:,} node shops indexed "\n        f"in {time.monotonic() - context_started:.1f}s"\n    )\n    _emit_progress("accommodation context: indexing node hotels/hostels")\n    accommodation_started = time.monotonic()\n    accommodation_index = build_accommodation_index(str(source), osmium)\n    _emit_progress(\n        f"accommodation context: {accommodation_index.shop_count:,} node hotels/hostels indexed "\n        f"in {time.monotonic() - accommodation_started:.1f}s"\n    )\n    _emit_progress("transit context: indexing node stops")\n    transit_started = time.monotonic()\n    transit_stop_index = build_transit_stop_index(str(source), osmium)\n    _emit_progress(\n        f"transit context: {transit_stop_index.shop_count:,} node stops indexed "\n        f"in {time.monotonic() - transit_started:.1f}s"\n    )'''
          new = '''    _emit_progress("POI context: indexing node signals in one pass")\n    context_started = time.monotonic()\n    context_indexes = build_context_indexes(str(source), osmium)\n    food_shop_index = context_indexes.food\n    accommodation_index = context_indexes.accommodation\n    transit_stop_index = context_indexes.transit\n    activity_index = context_indexes.activity\n    _emit_progress(\n        "POI context: one-pass index complete; "\n        f"food {food_shop_index.shop_count:,}; "\n        f"accommodation {accommodation_index.shop_count:,}; "\n        f"transit {transit_stop_index.shop_count:,}; "\n        f"activity {activity_index.shop_count:,}; "\n        f"{time.monotonic() - context_started:.1f}s"\n    )'''
          if old not in s:
              raise SystemExit('old index setup not found')
          s = s.replace(old, new)

          s = s.replace(
              '    transit_context_samples: list[dict[str, object]] = []\n    solnyshko_accommodation_sample: dict[str, object] | None = None\n',
              '    transit_context_samples: list[dict[str, object]] = []\n    activity_context_samples: list[dict[str, object]] = []\n    solnyshko_accommodation_sample: dict[str, object] | None = None\n'
          )

          needle = '''                if transit_added:\n                    counters["transit_context_enriched"] += 1\n                    transit_priority = final_tags.get("uralla:poi_priority", "unknown")\n                    counters[f"transit_priority_{transit_priority}"] += 1\n                    if transit_sample is not None and len(transit_context_samples) < 200:\n                        transit_context_samples.append(transit_sample)\n\n                original_tags = {str(key): str(value) for key, value in item.tags}\n'''
          repl = '''                if transit_added:\n                    counters["transit_context_enriched"] += 1\n                    transit_priority = final_tags.get("uralla:poi_priority", "unknown")\n                    counters[f"transit_priority_{transit_priority}"] += 1\n                    if transit_sample is not None and len(transit_context_samples) < 200:\n                        transit_context_samples.append(transit_sample)\n\n                final_tags, activity_added, activity_sample = enrich_activity_diagnostics(\n                    item, final_tags, activity_index\n                )\n                if activity_added:\n                    counters["activity_context_enriched"] += 1\n                    if activity_sample is not None and len(activity_context_samples) < 200:\n                        activity_context_samples.append(activity_sample)\n                    if (\n                        activity_sample is not None\n                        and activity_sample.get("name") == "Солнышко"\n                        and solnyshko_accommodation_sample is not None\n                        and activity_sample.get("id") == solnyshko_accommodation_sample.get("id")\n                    ):\n                        solnyshko_accommodation_sample["activity_500m"] = activity_sample["activity_500m"]\n                        solnyshko_accommodation_sample["activity_2km"] = activity_sample["activity_2km"]\n\n                original_tags = {str(key): str(value) for key, value in item.tags}\n'''
          if needle not in s:
              raise SystemExit('transit block not found')
          s = s.replace(needle, repl)

          old = '''                f"10km={solnyshko_accommodation_sample['objects_10km']}; "\n                f"priority={solnyshko_accommodation_sample['priority']}"\n            )'''
          new = '''                f"10km={solnyshko_accommodation_sample['objects_10km']}; "\n                f"activity500m={solnyshko_accommodation_sample.get('activity_500m', 'n/a')}; "\n                f"activity2km={solnyshko_accommodation_sample.get('activity_2km', 'n/a')}; "\n                f"priority={solnyshko_accommodation_sample['priority']}"\n            )'''
          if old not in s:
              raise SystemExit('Solnyshko summary not found')
          s = s.replace(old, new)

          s = s.replace(
              '        _emit_progress(\n            f"POI context: transit stops {transit_stop_index.shop_count:,}; "',
              '        _emit_progress(\n            f"POI context: activity nodes {activity_index.shop_count:,}; "\n            f"enriched POIs {counters[\'activity_context_enriched\']:,}"\n        )\n        _emit_progress(\n            f"POI context: transit stops {transit_stop_index.shop_count:,}; "'
          )

          s = s.replace(
              '            "transit_context_index_nodes": transit_stop_index.shop_count,\n',
              '            "transit_context_index_nodes": transit_stop_index.shop_count,\n            "activity_context_index_nodes": activity_index.shop_count,\n            "activity_context_enriched": counters["activity_context_enriched"],\n'
          )
          s = s.replace(
              '            "transit_context_samples": transit_context_samples,\n',
              '            "transit_context_samples": transit_context_samples,\n            "activity_context_samples": activity_context_samples,\n'
          )
          p.write_text(s)

          p = Path('tests/test_poi_context.py')
          s = p.read_text()
          s = s.replace(
              'from uralla_build.poi_context import FoodShopIndex, classify_food_shop, is_food_shop\n',
              'from uralla_build.poi_context import (\n    FoodShopIndex,\n    classify_food_shop,\n    is_food_shop,\n    is_meaningful_context_node,\n)\n'
          )
          marker = '    def test_rarity_classes(self) -> None:\n'
          test = '''    def test_meaningful_context_node_detection(self) -> None:\n        self.assertFalse(is_meaningful_context_node({}))\n        self.assertFalse(is_meaningful_context_node({"source": "survey"}))\n        self.assertFalse(is_meaningful_context_node({"fixme": "check"}))\n        self.assertTrue(is_meaningful_context_node({"amenity": "toilets"}))\n        self.assertTrue(is_meaningful_context_node({"addr:housenumber": "3"}))\n        self.assertTrue(is_meaningful_context_node({"natural": "peak"}))\n\n'''
          if test not in s:
              s = s.replace(marker, test + marker)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          python -m py_compile uralla_build/poi_context.py uralla_build/preprocessor.py
          python -m unittest tests.test_poi_context -v
          grep -q 'build_context_indexes' uralla_build/preprocessor.py
          grep -q 'poi_activity_500m' uralla_build/poi_context.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/poi_context.py uralla_build/preprocessor.py tests/test_poi_context.py
          git commit -m 'Add universal activity context prototype'
          git push
