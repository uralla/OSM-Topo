name: One-shot expand kite detection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-remove-solnyshko-debug.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Install project
        run: python3 -m pip install -e .
      - name: Expand kite semantic detection
        run: python3 .github/scripts/one_shot_expand_kite_detection.py
      - name: Compile Python
        run: python3 -m py_compile uralla_build/kite.py uralla_build/poi_context.py uralla_build/area_pois.py uralla_build/preprocessor.py
      - name: Test kite detector
        run: |
          python3 - <<'PY'
          from uralla_build.kite import enrich_kite_tags, is_kite_infrastructure
          positives = [
              {"brand": "Кайтшкола номер один"},
              {"description": "Кайт станция и кайт школа ВиндЭкстрим"},
              {"designation": "Kitesurfing"},
              {"name": 'Школа кайтсерфинга "Точка отрыва"'},
              {"operator": "Kite Station"},
          ]
          assert all(is_kite_infrastructure(tags) for tags in positives)
          assert not is_kite_infrastructure({"name": "Nikita"})
          assert not is_kite_infrastructure({"description": "обычная школа серфинга"})
          tags, changed = enrich_kite_tags({"description": "kite school"})
          assert changed and tags["uralla:kite"] == "yes"
          PY
      - name: Test kite area detection
        run: |
          python3 - <<'PY'
          from uralla_build.area_pois import area_poi_kind
          samples = [
              {"sport": "kitesurfing"},
              {"brand": "Кайтшкола номер один"},
              {"designation": "Kitesurfing"},
              {"name": 'Школа кайтсерфинга "Точка отрыва"'},
              {"description": "Кайт станция и прокат оборудования"},
          ]
          assert all(area_poi_kind(tags) == "kite:infrastructure" for tags in samples)
          PY
      - name: Verify style and debug cleanup
        run: |
          grep -n "uralla:kite=yes" styles/uralla/inc/priority_points
          ! grep -n "солнышко" uralla_build/preprocessor.py
      - name: Verify diff
        run: git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+uralla@users.noreply.github.com
          git add uralla_build/kite.py uralla_build/poi_context.py uralla_build/area_pois.py uralla_build/preprocessor.py styles/uralla/inc/priority_points styles/uralla.txt tests/test_kite.py tests/test_area_pois.py
          git commit -m 'Expand kite infrastructure detection'
          git push
# no-pytest verification 2026-09-02
