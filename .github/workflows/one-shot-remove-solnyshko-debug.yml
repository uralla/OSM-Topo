name: One-shot expand kite detection
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-remove-solnyshko-debug.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Install project
        run: python3 -m pip install -e .
      - name: Expand kite semantic detection
        run: python3 .github/scripts/one_shot_expand_kite_detection.py
      - name: Verify
        run: |
          python3 -m py_compile uralla_build/kite.py uralla_build/poi_context.py uralla_build/area_pois.py uralla_build/preprocessor.py
          python3 -m pytest -q tests/test_kite.py tests/test_area_pois.py tests/test_preprocess_pipeline.py
          grep -n "uralla:kite=yes" styles/uralla/inc/priority_points
          grep -n "SubType=0x09" styles/uralla.txt >/dev/null
          ! grep -n "солнышко" uralla_build/preprocessor.py
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+uralla@users.noreply.github.com
          git add uralla_build/kite.py uralla_build/poi_context.py uralla_build/area_pois.py uralla_build/preprocessor.py styles/uralla/inc/priority_points styles/uralla.txt tests/test_kite.py tests/test_area_pois.py
          git commit -m 'Expand kite infrastructure detection'
          git push
