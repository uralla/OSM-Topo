name: One-shot cave label cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-remove-solnyshko-debug.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply cave label cleanup
        run: python3 .github/scripts/one_shot_cave_label_cleanup.py
      - name: Verify cave label
        run: |
          python3 -m py_compile uralla_build/preprocessor.py
          python3 - <<'PY'
          from uralla_build.preprocessor import enrich_geographic_label_tags
          tags, changed = enrich_geographic_label_tags({"natural": "cave_entrance", "name": "Малая Аракаевская пещера"})
          assert changed
          assert tags["uralla:label"] == "Мал. Аракаевская", tags
          tags, changed = enrich_geographic_label_tags({"natural": "cave_entrance", "name": "Пещера Сказка"})
          assert not changed
          assert "uralla:label" not in tags
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+uralla@users.noreply.github.com
          git add uralla_build/preprocessor.py
          git commit -m 'Strip cave type suffix from display labels'
          git push
# trigger 2026-09-02
