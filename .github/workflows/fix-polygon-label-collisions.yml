name: Fix polygon label collisions

on:
  push:
    paths:
      - '.github/workflows/fix-polygon-label-collisions.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Patch polygon types and labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          polygons_path = Path('styles/uralla/polygons')
          typ_path = Path('styles/uralla.txt')
          polygons = polygons_path.read_text(encoding='utf-8')
          typ = typ_path.read_text(encoding='utf-8')

          # 0x0d is a native Garmin Reservation polygon. Keep its existing uses,
          # but move pedestrian/square-style road areas to a custom polygon so
          # devices cannot display the built-in "Reservation" semantic text.
          old_group = '''highway=pedestrian & (area=yes | mkgmap:mp_created=true)\n\t| highway=footway & (area=yes | mkgmap:mp_created=true)\n\t| highway=rest_area & (area=yes | mkgmap:mp_created=true)\n\t| highway=living_street & (area=yes | mkgmap:mp_created=true)\n\t| highway=residential & (area=yes | mkgmap:mp_created=true)\n\t| highway=unclassified & (area=yes | mkgmap:mp_created=true) [0x0d resolution 21]\n'''
          new_group = old_group.replace('[0x0d resolution 21]', '[0x10f12 resolution 21]')
          assert polygons.count(old_group) == 1
          assert '0x10f12' not in polygons
          polygons = polygons.replace(old_group, new_group, 1)

          # Settlement-area fallbacks must never consume a building polygon.
          replacements = {
              'place=town [0x01 resolution 19]': 'place=town & building!=* [0x01 resolution 19]',
              'place=city [0x02 resolution 18]': 'place=city & building!=* [0x02 resolution 18]',
              'place=suburb [0x02 resolution 22]': 'place=suburb & building!=* [0x02 resolution 22]',
              'place=village [0x03 resolution 21]': 'place=village & building!=* [0x03 resolution 21]',
              'place=hamlet [0x03 resolution 21]': 'place=hamlet & building!=* [0x03 resolution 21]',
              'place=locality [0x03 resolution 21]': 'place=locality & building!=* [0x03 resolution 21]',
              'place=isolated_dwelling [0x03 resolution 21]': 'place=isolated_dwelling & building!=* [0x03 resolution 21]',
          }
          for old, new in replacements.items():
              assert polygons.count(old) == 1, old
              polygons = polygons.replace(old, new, 1)
          polygons_path.write_text(polygons, encoding='utf-8')

          # Create custom polygon 0x10f12 by cloning the existing 0x0d artwork.
          # Only the address and semantic strings change; the exact fill color remains.
          assert 'Type=0x10f12' not in typ
          draw_anchor = 'Type=0x10f10,5\n'
          assert draw_anchor in typ
          typ = typ.replace(draw_anchor, draw_anchor + 'Type=0x10f12,4\n', 1)

          src = re.search(r'(?ms)^\[_polygon\]\nType=0x0d\n.*?^\[end\]\n?', typ)
          assert src, '0x0d polygon block missing'
          block = src.group(0)
          assert '"1 c #FFCA8B"' in block
          custom = block.replace('Type=0x0d', 'Type=0x10f12', 1)
          custom = re.sub(r'^;GRMN_TYPE:.*$', ';GRMN_TYPE: Customizable Areas/PEDESTRIAN_SQUARE/Pedestrian or road area', custom, count=1, flags=re.M)
          custom = re.sub(r'^String1=.*$', 'String1=0x19,пешеходная зона', custom, count=1, flags=re.M)
          custom = re.sub(r'^String2=.*$', 'String2=0x04,pedestrian area', custom, count=1, flags=re.M)
          typ = typ[:src.end()] + '\n' + custom + typ[src.end():]
          typ_path.write_text(typ, encoding='utf-8')

          Path('tests/test_polygon_label_collisions.py').write_text('''from pathlib import Path\nimport re\nimport unittest\n\nROOT = Path(__file__).resolve().parents[1]\nPOLYGONS = ROOT / "styles" / "uralla" / "polygons"\nTYP = ROOT / "styles" / "uralla.txt"\n\nclass PolygonLabelCollisionTests(unittest.TestCase):\n    def test_pedestrian_area_uses_custom_type_not_native_reservation(self) -> None:\n        style = POLYGONS.read_text(encoding="utf-8")\n        self.assertIn("highway=footway & (area=yes | mkgmap:mp_created=true)", style)\n        group = style[style.index("# squares and plazas"):style.index("# ж/д платформы как площади")]\n        self.assertIn("[0x10f12 resolution 21]", group)\n        self.assertNotIn("[0x0d resolution 21]", group)\n\n        typ = TYP.read_text(encoding="utf-8")\n        match = re.search(r"(?ms)^\\[_polygon\\]\\nType=0x10f12\\n.*?^\\[end\\]", typ)\n        self.assertIsNotNone(match)\n        block = match.group(0)\n        self.assertIn("String1=0x19,пешеходная зона", block)\n        self.assertIn('"1 c #FFCA8B"', block)\n\n    def test_settlement_polygons_do_not_consume_buildings(self) -> None:\n        style = POLYGONS.read_text(encoding="utf-8")\n        for place in ("town", "city", "suburb", "village", "hamlet", "locality", "isolated_dwelling"):\n            self.assertRegex(style, rf"(?m)^place={place} & building!=\\* ")\n        self.assertIn("(building=* | bridge=yes & area=yes)", style)\n        self.assertIn("[0x13 resolution 24]", style)\n\n    def test_building_typ_fallback_is_building(self) -> None:\n        typ = TYP.read_text(encoding="utf-8")\n        match = re.search(r"(?ms)^\\[_polygon\\]\\nType=0x13\\n.*?^\\[end\\]", typ)\n        self.assertIsNotNone(match)\n        self.assertIn("String1=0x19,здание", match.group(0))\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Run focused tests
        run: python -m pytest -q tests/test_polygon_label_collisions.py
      - name: Audit style against TYP
        run: python scripts/audit_style_typ.py
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/fix-polygon-label-collisions.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/polygons styles/uralla.txt tests/test_polygon_label_collisions.py .github/workflows/fix-polygon-label-collisions.yml
          git commit -m 'Fix pedestrian and building polygon labels'
          git push
