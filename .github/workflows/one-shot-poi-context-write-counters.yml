name: One-shot POI activity tag verification

on:
  push:
    paths:
      - '.github/workflows/one-shot-poi-context-write-counters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch writer counters and helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('uralla_build/preprocessor.py')
          s = p.read_text()
          old = '''from .poi_context import (\n    build_context_indexes,\n'''
          new = '''from .poi_context import (\n    POI_ACTIVITY_CONTEXT_TAG,\n    build_context_indexes,\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''                original_tags = {str(key): str(value) for key, value in item.tags}\n                if final_tags == original_tags:\n'''
          new = '''                activity_context_value = final_tags.get(POI_ACTIVITY_CONTEXT_TAG)\n                if activity_context_value in {"remote", "settlement", "urban"}:\n                    counters[f"activity_context_written_{activity_context_value}"] += 1\n\n                original_tags = {str(key): str(value) for key, value in item.tags}\n                if final_tags == original_tags:\n'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        if activity_500m_values:\n'''
          new = '''        _emit_progress(\n            "POI activity context tags written: "\n            f"remote {counters['activity_context_written_remote']:,}; "\n            f"settlement {counters['activity_context_written_settlement']:,}; "\n            f"urban {counters['activity_context_written_urban']:,}; "\n            f"total {sum(counters[f'activity_context_written_{value}'] for value in ('remote', 'settlement', 'urban')):,}"\n        )\n        if activity_500m_values:\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          h = Path('scripts/test-poi-context.sh')
          hs = h.read_text()
          old = "POI activity density:|POI activity classifier:|POI activity final classifier:|"
          new = "POI activity density:|POI activity classifier:|POI activity final classifier:|POI activity context tags written:|"
          assert old in hs
          hs = hs.replace(old, new, 1)
          h.write_text(hs)
          PY
      - name: Test
        run: |
          python -m pip install -e .
          python -m py_compile uralla_build/preprocessor.py
          python -m unittest tests.test_poi_context -v
          grep -q 'POI activity context tags written:' uralla_build/preprocessor.py
          grep -q 'POI activity context tags written:' scripts/test-poi-context.sh
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/preprocessor.py scripts/test-poi-context.sh
          git commit -m 'Log persisted POI activity context counts'
          git push
