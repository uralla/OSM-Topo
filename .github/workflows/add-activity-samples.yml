name: Add activity context sample diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-activity-samples.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add remote and urban activity samples
        run: |
          python - <<'PY'
          from pathlib import Path

          pre = Path('uralla_build/preprocessor.py')
          text = pre.read_text(encoding='utf-8')

          marker = '''            _emit_progress(\n                \"POI activity classifier: \"\n                f\"remote {activity_class_counts['remote']:,}; \"\n                f\"settlement {activity_class_counts['settlement']:,}; \"\n                f\"urban {activity_class_counts['urban']:,}; \"\n                f\"criteria remote=(2km<=p25 and 10km<=p25), \"\n                f\"urban=(2km>=p75 and 10km>=p75)\"\n            )\n'''
          addition = marker + '''            remote_samples = 0\n            urban_samples = 0\n            for sample in activity_context_samples:\n                context = classify_activity_context(\n                    activity_2km=int(sample[\"activity_2km\"]),\n                    activity_10km=int(sample[\"activity_10km\"]),\n                    local_p25=activity_2km_p25,\n                    local_p75=activity_2km_p75,\n                    background_p25=activity_10km_p25,\n                    background_p75=activity_10km_p75,\n                )\n                if context == \"remote\" and remote_samples < 20:\n                    _emit_progress(\n                        \"POI activity sample: remote; \"\n                        f\"name={sample.get('name')!r}; \"\n                        f\"priority={sample.get('priority')}; \"\n                        f\"500m={sample.get('activity_500m')}; \"\n                        f\"2km={sample.get('activity_2km')}; \"\n                        f\"10km={sample.get('activity_10km')}\"\n                    )\n                    remote_samples += 1\n                elif context == \"urban\" and urban_samples < 20:\n                    _emit_progress(\n                        \"POI activity sample: urban; \"\n                        f\"name={sample.get('name')!r}; \"\n                        f\"priority={sample.get('priority')}; \"\n                        f\"500m={sample.get('activity_500m')}; \"\n                        f\"2km={sample.get('activity_2km')}; \"\n                        f\"10km={sample.get('activity_10km')}\"\n                    )\n                    urban_samples += 1\n                if remote_samples >= 20 and urban_samples >= 20:\n                    break\n'''
          if marker not in text:
              raise SystemExit('classifier block marker not found')
          text = text.replace(marker, addition, 1)
          pre.write_text(text, encoding='utf-8')

          script = Path('scripts/test-poi-context.sh')
          text = script.read_text(encoding='utf-8')
          text = text.replace('POI activity classifier:|POI accommodation check:', 'POI activity classifier:|POI activity sample:|POI accommodation check:')
          script.write_text(text, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python -m py_compile uralla_build/preprocessor.py
          python -m unittest tests.test_poi_context -v
          grep -q 'POI activity sample:' uralla_build/preprocessor.py
          grep -q 'POI activity sample:' scripts/test-poi-context.sh
          bash -n scripts/test-poi-context.sh

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/preprocessor.py scripts/test-poi-context.sh
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Add activity context sample diagnostics'
            git push
          fi
