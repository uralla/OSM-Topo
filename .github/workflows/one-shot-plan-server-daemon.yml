name: One-shot plan server daemon

on:
  push:
    paths:
      - '.github/workflows/one-shot-plan-server-daemon.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record daemon and UI queue plan
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/BACKLOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '### UI-01 — Интерактивный launcher `start` — OPEN\n'
          if marker not in text:
              raise SystemExit('UI-01 marker not found')

          daemon = '''### DAEMON-01 — Автоматический серверный планировщик сборок — OPEN\n\nДобавить постоянно работающий серверный процесс поверх существующих `scheduler`, `history`, `source` и `runner`, без создания второй независимой системы сборки. Один и тот же расчёт очереди должен использоваться как daemon, так и интерактивным `start`, чтобы экран состояния показывал именно тот план, который сервер реально собирается выполнить.\n\nЦелевое поведение:\n\n- daemon периодически перечитывает manifest/history и вычисляет TTL каждой карты по последней успешной сборке, `update_interval_days` и `priority`;\n- для каждой карты показывается/вычисляется `last success`, `due_at`, остаток TTL или величина просрочки, источник OSM и состояние локального source-файла;\n- очередь по умолчанию строится из приоритета и просрочки, но допускает явный ручной override порядка без редактирования основного manifest;\n- одновременно запускается только допустимое число тяжёлых сборок; первая версия может быть строго однопоточной на уровне продуктов, чтобы не конкурировать за RAM/IO;\n- источник загружается не в момент старта тяжёлой сборки, а заранее, если скоро понадобится одной или нескольким картам; общий source (`russia-latest.osm.pbf` и т.п.) скачивается один раз и затем используется всеми зависимыми продуктами;\n- перед загрузкой желательно делать дешёвую удалённую проверку метаданных (`Last-Modified`, `ETag`, `Content-Length`/HEAD). Локальный файл не перекачивать только потому, что прошёл календарный день, если upstream ещё не изменился;\n- daemon накапливает наблюдаемое время публикации каждого upstream source и после нескольких циклов может планировать prefetch около обычного окна обновления с безопасным запасом. Это оптимизация, а не источник истины: окончательное решение всегда подтверждается удалёнными метаданными;\n- если карта должна обновиться сегодня, source желательно подготовить заранее, чтобы в момент её очереди сборка сразу начиналась с extract/preprocess, а не ждала многогигабайтную загрузку;\n- failed/interrupted build не сбрасывает TTL как успешная сборка; daemon фиксирует ошибку и применяет ограниченный retry/backoff, не зацикливаясь на одной сломанной карте;\n- ручной запуск из `start` имеет понятное взаимодействие с daemon: нельзя случайно запустить второй build того же продукта, а ручной приоритет/перемещение в начало очереди должно быть возможно;\n- состояние daemon/queue хранится отдельно от `config/maps.yaml`: manifest задаёт базовую политику, runtime-state — временные overrides, паузы, retries и наблюдения за upstream.\n\nПредлагаемый первый этап:\n\n1. расширить source layer дешёвой проверкой remote metadata без скачивания тела PBF;\n2. сделать общий `planning snapshot` для всех продуктов/источников: TTL карты + состояние source + рассчитанный порядок;\n3. показать этот snapshot отдельным экраном в `start`;\n4. добавить ручные действия `выше/ниже`, `в начало`, `pause/resume`, `build now`, `refresh source now`;\n5. только после проверки UI запустить тот же planner циклом через systemd service/timer на сервере.\n\nПринцип: сначала прозрачный план и ручное управление, затем автоматический daemon. Поведение сервера не должно быть скрытой магией, которую невозможно воспроизвести из CLI.\n\n'''
          if '### DAEMON-01 — Автоматический серверный планировщик сборок — OPEN' not in text:
              text = text.replace(marker, daemon + marker, 1)

          old_ui = '''Главный экран:\n\n- список карт из manifest;\n- последняя обработанная карта выше;\n- статус последней генерации;\n- дата/время генерации;\n- TTL / просроченность;\n- последний статус ошибки или успешной сборки.\n'''
          new_ui = '''Главный экран:\n\n- список карт из manifest;\n- последняя обработанная карта выше;\n- статус последней генерации;\n- дата/время генерации;\n- TTL / просроченность;\n- последний статус ошибки или успешной сборки.\n\nДобавить отдельный экран `QUEUE / SERVER STATE`, общий с DAEMON-01:\n\n- рассчитанная очередь продуктов и причина позиции (`priority`, overdue, manual override);\n- `last success`, `due_at`, остаток TTL/просрочка;\n- источник OSM, локальная дата/размер и известные remote metadata;\n- состояние `READY / SOURCE WAIT / DUE / RUNNING / FAILED / PAUSED`;\n- следующая запланированная карта и, когда это можно оценить, ожидаемое время её старта;\n- ручное изменение порядка: поднять/опустить, отправить в начало, pause/resume, build now;\n- отдельное принудительное обновление source без запуска карты.\n\nРучные изменения очереди должны храниться как runtime-state/override, а не переписывать базовый `priority` в `maps.yaml`, если пользователь явно не выбрал постоянное изменение политики.\n'''
          if old_ui in text and 'QUEUE / SERVER STATE' not in text:
              text = text.replace(old_ui, new_ui, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify backlog entries
        run: |
          grep -F '### DAEMON-01 — Автоматический серверный планировщик сборок — OPEN' docs/BACKLOG.md
          grep -F 'QUEUE / SERVER STATE' docs/BACKLOG.md
          grep -F 'Last-Modified' docs/BACKLOG.md

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/BACKLOG.md
          if git diff --cached --quiet; then
            echo "No backlog changes needed"
            exit 0
          fi
          git commit -m "Plan server build daemon and queue UI"
          git push
