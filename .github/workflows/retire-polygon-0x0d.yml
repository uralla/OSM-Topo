name: Retire remaining polygon 0x0d uses

on:
  push:
    paths:
      - '.github/workflows/retire-polygon-0x0d.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Move tourism and platform polygons off 0x0d
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          polygons = Path('styles/uralla/polygons')
          text = polygons.read_text(encoding='utf-8')

          # All remaining production uses of Garmin system polygon 0x0d are semantically
          # unrelated to Reservation. Split them into dedicated custom polygon types.
          text = text.replace(
              "tourism=attraction & building!=* & leisure!=* & natural!=*\t{name '${name}' | '${addr:street} ${addr:housenumber}' | '${addr:housenumber}' } [0x0d resolution 22]",
              "tourism=attraction & building!=* & leisure!=* & natural!=*\t{name '${name}' | '${addr:street} ${addr:housenumber}' | '${addr:housenumber}' } [0x10f13 resolution 22]",
          )
          text = text.replace('tourism=theme_park [0x0d resolution 21]', 'tourism=theme_park [0x10f13 resolution 21]')
          text = text.replace(
              "tourism=* & building!=* & leisure!=* {name '${name}' | '${addr:street} ${addr:housenumber}' | '${addr:housenumber}' } [0x0d resolution 22]",
              "tourism=* & building!=* & leisure!=* {name '${name}' | '${addr:street} ${addr:housenumber}' | '${addr:housenumber}' } [0x10f13 resolution 22]",
          )
          text = text.replace(
              "(public_transport=platform & area=yes & mkgmap:area2poi!=true | railway=platform & area=yes & mkgmap:area2poi!=true) & !(layer<0) { name '${name}' | 'платформа' } [0x0d resolution 21]",
              "(public_transport=platform & area=yes & mkgmap:area2poi!=true | railway=platform & area=yes & mkgmap:area2poi!=true) & !(layer<0) { name '${name}' | 'платформа' } [0x10f14 resolution 21]",
          )
          assert '[0x0d resolution' not in text, 'production polygon 0x0d use remains'
          polygons.write_text(text, encoding='utf-8')

          typ_path = Path('styles/uralla.txt')
          typ = typ_path.read_text(encoding='utf-8')
          assert 'Type=0x10f13\n;GRMN_TYPE: Customizable Areas/TOURISM_AREA/' not in typ
          assert 'Type=0x10f14\n;GRMN_TYPE: Customizable Areas/PLATFORM_AREA/' not in typ

          # Preserve the current 0x0d fill so this change only removes Garmin's system
          # semantics; visual redesign can happen separately during the polygon audit.
          blocks = '''

[_polygon]
Type=0x10f13
;GRMN_TYPE: Customizable Areas/TOURISM_AREA/Tourism area
String1=0x19,туристический объект
String2=0x04,tourism area
ExtendedLabels=Y
FontStyle=NoLabel (invisible)
CustomColor=No
ContourColor=No
Xpm="0 0 1 0"
"1 c #FFCA8B"
[end]

[_polygon]
Type=0x10f14
;GRMN_TYPE: Customizable Areas/PLATFORM_AREA/Railway or public transport platform
String1=0x19,платформа
String2=0x04,platform
ExtendedLabels=Y
FontStyle=NoLabel (invisible)
CustomColor=No
ContourColor=No
Xpm="0 0 1 0"
"1 c #FFCA8B"
[end]
'''
          marker = '\n\n[_polygon]\nType=0x0f\n'
          assert marker in typ
          typ = typ.replace(marker, blocks + marker, 1)

          # Draw order: same layer as old 0x0d to preserve appearance.
          draw_marker = 'Type=0x10f12,4\n'
          assert draw_marker in typ
          typ = typ.replace(draw_marker, draw_marker + 'Type=0x10f13,4\nType=0x10f14,4\n', 1)
          typ_path.write_text(typ, encoding='utf-8')

          # Record the now-complete device-proven POI migration scope and current POLY audit.
          backlog = Path('docs/BACKLOG.md')
          b = backlog.read_text(encoding='utf-8')
          old = '''### POI-01 — Аудит POI и перенос группы `0x115` в безопасный диапазон — DONE

Целевой объём этого этапа был ограничен пользовательскими POI группы `0x115`. Группа полностью освобождена: в production style и TYP больше нет активных `0x115xx` точек.

Итоговые подтверждённые переносы и их текущие адреса зафиксированы в `docs/POI_115_MIGRATION.md`; `tests/test_group_115_migration.py` не допускает возврата старой группы.

При переносах одновременно перемещались соответствующие TYP-блоки с исходной графикой, поэтому новые style-адреса не теряют пользовательские символы.
'''
          new = '''### POI-01 — Аудит custom POI и перенос в подтверждённый диапазон — DONE

Активные пользовательские point-типы из неработающих на целевом Garmin расширенных семейств `0x115xx`, `0x116xx` и выше перенесены в диапазон `0x064xx` вместе с соответствующими TYP-блоками и исходной графикой.

Работоспособность `0x064xx` подтверждена реальной проверкой контрольных точек на устройстве 29 августа 2026 года. Свободный extended-адрес сам по себе больше не считается безопасным: для custom POI решающим критерием является отображение на целевом Garmin.

Текущие переносы зафиксированы в `docs/POI_115_MIGRATION.md` и `docs/EXTENDED_POINT_TYPES.md`.
'''
          assert old in b
          b = b.replace(old, new, 1)
          b = b.replace(
              '- площадные `highway=footway|pedestrian|...` вынесены с системного `0x0d` (Garmin Reservation) на custom polygon, чтобы прибор не показывал «Резервация, заповедник»;',
              '- все production-полигоны, ранее использовавшие системный `0x0d` (Garmin Reservation), вынесены на отдельные custom types: пешеходные площади, tourism-area и платформы; встроенная семантика Reservation больше не используется;',
          )
          backlog.write_text(b, encoding='utf-8')

          # Direct assertions are the guardrail for this one-shot migration.
          assert '0x10f13' in polygons.read_text(encoding='utf-8')
          assert '0x10f14' in polygons.read_text(encoding='utf-8')
          assert 'Type=0x10f13,4' in typ and 'Type=0x10f14,4' in typ
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm .github/workflows/retire-polygon-0x0d.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/polygons styles/uralla.txt docs/BACKLOG.md .github/workflows/retire-polygon-0x0d.yml
          git commit -m 'Retire system polygon 0x0d from production style'
          git push
