name: Cleanup consolidated POI rules and TYP

on:
  push:
    branches: [main]
    paths:
      - scripts/cleanup_consolidated_poi.py
      - .github/workflows/cleanup-consolidated-poi.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply agreed POI cleanup
        run: python3 scripts/cleanup_consolidated_poi.py

      - name: Commit direct style/TYP sources and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla/points styles/uralla/inc/priority_points styles/uralla.txt
          git rm scripts/cleanup_consolidated_poi.py .github/workflows/cleanup-consolidated-poi.yml
          git commit -m "Finalize consolidated POI style and TYP"
          git push origin HEAD:main
