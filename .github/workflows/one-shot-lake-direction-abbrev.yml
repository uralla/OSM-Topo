name: One-shot lake direction abbreviations
on:
  push:
    paths:
      - '.github/workflows/one-shot-lake-direction-abbrev.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('uralla_build/preprocessor.py')
          s = p.read_text()
          old = '''_LAKE_LEADING_ABBREVIATIONS: tuple[tuple[re.Pattern[str], str], ...] = (\n    (re.compile(r"^(?:Большое|Большая|Большой|Большие)\\s+(.+?)$", re.IGNORECASE), "Бол. "),\n)'''
          new = '''_LAKE_LEADING_ABBREVIATIONS: tuple[tuple[re.Pattern[str], str], ...] = (\n    (re.compile(r"^(?:Большое|Большая|Большой|Большие)\\s+(.+?)$", re.IGNORECASE), "Бол. "),\n    (re.compile(r"^(?:Малое|Малая|Малый|Малые)\\s+(.+?)$", re.IGNORECASE), "Мал. "),\n    (re.compile(r"^(?:Верхнее|Верхняя|Верхний|Верхние)\\s+(.+?)$", re.IGNORECASE), "В. "),\n    (re.compile(r"^(?:Нижнее|Нижняя|Нижний|Нижние)\\s+(.+?)$", re.IGNORECASE), "Н. "),\n)'''
          assert s.count(old) == 1, s.count(old)
          p.write_text(s.replace(old, new, 1))
          PY
          python3 - <<'PY'
          from uralla_build.preprocessor import enrich_geographic_label_tags
          cases = [
              ({'water':'lake','name':'озеро Малое Какашево'}, 'Мал. Какашево'),
              ({'water':'lake','name':'озеро Верхнее Какули'}, 'В. Какули'),
              ({'water':'lake','name':'озеро Нижнее Какули'}, 'Н. Какули'),
              ({'water':'pond','name':'Малая Лужа'}, 'Мал. Лужа'),
              ({'water':'reservoir','name':'Верхний Пруд'}, 'В. Пруд'),
              ({'natural':'peak','name':'гора Нижняя Гора'}, 'Нижняя Гора'),
          ]
          for tags, expected in cases:
              result, _ = enrich_geographic_label_tags(tags)
              actual = result.get('uralla:label', tags['name'])
              assert actual == expected, (tags, actual, expected)
          PY
          python -m py_compile uralla_build/preprocessor.py
          git diff --check
          git diff -- uralla_build/preprocessor.py
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uralla_build/preprocessor.py
          git commit -m 'Expand lake label abbreviations'
          git push
