name: Fast preprocess focused checks
on:
  push:
    branches: [main]
    paths:
      - 'uralla_build/preprocess_fast.py'
      - 'uralla_build/semantic_apply.py'
      - 'uralla_build/analysis_bundle.py'
      - 'uralla_build/road_density_analysis.py'
      - 'uralla_build/poi_context_analysis.py'
      - 'uralla_build/build_plan.py'
      - 'tests/test_build_plan.py'
      - '.github/workflows/test-fast-preprocess.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Compile fast preprocess modules
        run: python -m py_compile uralla_build/preprocess_fast.py uralla_build/semantic_apply.py uralla_build/analysis_bundle.py uralla_build/build_plan.py
      - name: Run build-plan tests
        run: python -m unittest tests.test_build_plan -v
      - name: Verify diff
        run: git diff --check
