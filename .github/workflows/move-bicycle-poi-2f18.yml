name: Move bicycle POI to 0x2f18

"on":
  push:
    paths:
      - ".github/workflows/move-bicycle-poi-2f18.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Update bicycle POI type and bitmap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('styles/uralla/inc/priority_points')
          s = p.read_text(encoding='utf-8')
          old1 = "shop=bicycle { name '${name}' | 'велосипеды' } [0x2f0d resolution 23]"
          new1 = "shop=bicycle { name '${name}' | 'велосипеды' } [0x2f18 resolution 23]"
          old2 = "amenity=bicycle_repair_station { name '${name}' | 'велосипеды' } [0x2f0d resolution 24]"
          new2 = "amenity=bicycle_repair_station { name '${name}' | 'велосипеды' } [0x2f18 resolution 24]"
          assert s.count(old1) == 1, s.count(old1)
          assert s.count(old2) == 1, s.count(old2)
          p.write_text(s.replace(old1, new1, 1).replace(old2, new2, 1), encoding='utf-8')

          p = Path('styles/uralla.txt')
          s = p.read_text(encoding='utf-8')
          m = re.search(r'(?ms)^\[_point\]\nType=0x115\nSubType=0x0a\n.*?^\[end\]\n?', s)
          assert m, 'bicycle TYP block 0x115/0x0a not found'
          lines = [
              '[_point]',
              'Type=0x02f',
              'SubType=0x18',
              ';GRMN_TYPE: Business - Services/Custom bicycle service POI',
              'String1=0x19,велосипеды',
              'String2=0x04,bicycle',
              'ExtendedLabels=Y',
              'FontStyle=SmallFont',
              'CustomColor=No',
              'ContourColor=No',
              'DayXpm="14 14 3 1"   Colormode=16',
              '"!\tc #0000FF"',
              '"#\tc #FFFFFF"',
              '" \tc none"',
              '"   ########   "',
              '" ############ "',
              '" ############ "',
              '"###!!!##!!####"',
              '"####!###!!####"',
              '"####!!!!!#####"',
              '"#####!#!!!####"',
              '"###!!!!##!!###"',
              '"##!#!!##!!#!##"',
              '"##!##!##!##!##"',
              '"###!!####!!###"',
              '" ############ "',
              '" ############ "',
              '"   ########   "',
              ';12345678901234',
              '[end]',
              '',
          ]
          block = '\n'.join(lines)
          p.write_text(s[:m.start()] + block + s[m.end():], encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/move-bicycle-poi-2f18.yml
      - name: Commit and push
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/inc/priority_points styles/uralla.txt .github/workflows/move-bicycle-poi-2f18.yml
          git commit -m "Move bicycle POI to 0x2f18"
          git push
