name: One-shot pipeline res24
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-pipeline-res24.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pipeline resolution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('styles/uralla/lines')
          s = p.read_text(encoding='utf-8')
          old = "man_made=pipeline {name '${name}' | '${operator}'} [0x28 resolution 23]"
          new = "man_made=pipeline {name '${name}' | '${operator}'} [0x28 resolution 24]"
          assert s.count(old) == 1, 'pipeline rule not found exactly once'
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          s2 = p.read_text(encoding='utf-8')
          assert new in s2
          assert old not in s2
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles/uralla/lines
          git commit -m 'Limit pipelines to resolution 24'
          git push
