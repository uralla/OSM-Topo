name: TYP role consolidate once

on:
  push:
    paths:
      - scripts/tools/consolidate_typ_roles_once.py
      - .github/workflows/typ-role-consolidate-once.yml

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consolidate semantic TYP roles
        run: python scripts/tools/consolidate_typ_roles_once.py
      - name: Commit consolidated TYP source
        shell: bash
        run: |
          if git diff --quiet -- styles/uralla.txt; then
            echo "No TYP changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla.txt
          git commit -m "Consolidate semantic road and trail TYP roles"
          git push origin HEAD:main
