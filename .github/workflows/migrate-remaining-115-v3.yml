name: Finalize remaining 0x115 migration

on:
  push:
    paths:
      - '.github/workflows/migrate-remaining-115-v3.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply migration and related cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          mapping = {
              '0x11500': '0x6609',
              '0x11501': '0x641e',
              '0x11504': '0x660a',
              '0x11506': '0x660b',
              '0x11507': '0x660c',
              '0x11509': '0x2b08',
          }
          production_files = [
              Path('styles/uralla/points'),
              Path('styles/uralla/inc/place_points'),
              Path('styles/uralla/inc/priority_points'),
              Path('styles/uralla/inc/landuse_points'),
          ]
          typ_path = Path('styles/uralla.txt')
          typ = typ_path.read_text(encoding='utf-8')
          production = '\n'.join(p.read_text(encoding='utf-8') for p in production_files)

          for new in mapping.values():
              assert new not in production, f'destination already used in style: {new}'
              t, st = int(new[2:4], 16), int(new[4:6], 16)
              assert not re.search(rf'(?ms)^\[_point\]\s*\nType=0x0?{t:02x}\s*\nSubType=0x{st:02x}\b.*?^\[end\]', typ, re.I), new

          counts = {old: 0 for old in mapping}
          for path in production_files:
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  counts[old] += text.count(old)
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          assert counts == {'0x11500':1,'0x11501':1,'0x11504':1,'0x11506':1,'0x11507':2,'0x11509':1}, counts

          descriptions = {
              '00': 'Geographic/BOUNDARY_STONE/Boundary stone',
              '01': 'Man-made/WASTEWATER_PLANT/Wastewater treatment plant',
              '04': 'Geographic/LOCALITY/Named locality',
              '06': 'Geographic/CAIRN/Cairn',
              '07': 'Geographic/SADDLE_MOUNTAIN_PASS/Saddle or mountain pass',
              '09': 'Business - Lodging/CHALET/Detached holiday cottage',
          }
          for old, new in mapping.items():
              sub = old[-2:]
              m = re.search(rf'(?ms)^\[_point\]\nType=0x115\nSubType=0x{sub}\n.*?^\[end\]', typ)
              assert m, old
              block = m.group(0)
              t, st = int(new[2:4], 16), int(new[4:6], 16)
              block = block.replace('Type=0x115', f'Type=0x{t:03x}', 1)
              block = block.replace(f'SubType=0x{sub}', f'SubType=0x{st:02x}', 1)
              block = re.sub(r'^;GRMN_TYPE:.*$', f';GRMN_TYPE: {descriptions[sub]}', block, count=1, flags=re.M)
              typ = typ[:m.start()] + block + typ[m.end():]
          assert 'Type=0x115' not in typ
          typ_path.write_text(typ, encoding='utf-8')

          landuse = Path('styles/uralla/inc/landuse_points')
          text = landuse.read_text(encoding='utf-8')
          anchor = '# Static catalogue enrichment from the semantic preprocessor.\n'
          low_rule = '# Minor relief below 200 m: peak/hill is only a close-zoom terrain marker.\n# No name/elevation label is drawn for these low summits.\n(natural=peak | natural=hill) & ele < 200 [0x6615 resolution 24]\n\n'
          assert anchor in text and low_rule not in text
          landuse.write_text(text.replace(anchor, low_rule + anchor, 1), encoding='utf-8')

          cli = Path('uralla_build/cli.py')
          text = cli.read_text(encoding='utf-8')
          old = '''    if args.json:\n        print(json.dumps({"ok": True, "report": report}, ensure_ascii=False, indent=2))\n    else:\n        print(json.dumps(report, ensure_ascii=False, indent=2))\n    return 0\n'''
          new = '''    if args.json:\n        print(json.dumps({"ok": True, "report": report}, ensure_ascii=False, indent=2))\n    else:\n        print(f"[preprocess] done; report: {args.report}")\n    return 0\n'''
          assert text.count(old) == 1
          cli.write_text(text.replace(old, new, 1), encoding='utf-8')

          for path in Path('tests').glob('test_*.py'):
              if path.name == 'test_group_115_migration.py':
                  continue
              text = path.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  text = text.replace(old, new).replace(old.upper(), new.upper())
              path.write_text(text, encoding='utf-8')

          split = {
              Path('tests/test_bicycle_poi_style.py'): [(r'Type=0x115\nSubType=0x04', r'Type=0x066\nSubType=0x0a')],
              Path('tests/test_chalet_point_style.py'): [(r'Type=0x115\nSubType=0x09', r'Type=0x02b\nSubType=0x08')],
              Path('tests/test_topo_marker_points.py'): [(r'Type=0x115\s*\nSubType=0x06', r'Type=0x066\s*\nSubType=0x0b')],
          }
          for path, pairs in split.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  assert old in text, (path, old)
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          Path('tests/test_group_115_migration.py').write_text('''from pathlib import Path\nimport re\nimport unittest\n\nROOT = Path(__file__).resolve().parents[1]\nSTYLE = ROOT / "styles" / "uralla"\nTYP = ROOT / "styles" / "uralla.txt"\nINCLUDE_RE = re.compile(r"^\\s*include\\s+'([^']+)'\\s*;", re.MULTILINE)\nSTYLE_115_RE = re.compile(r"\\[0x115([0-9a-fA-F]{2})\\b")\nTYP_115_RE = re.compile(r"(?ms)^\\[_point\\]\\s*\\nType=0x115\\s*\\nSubType=0x([0-9a-fA-F]{2})\\b.*?^\\[end\\]")\n\ndef production_files():\n    result, seen = [], set()\n    def visit(path):\n        path = path.resolve()\n        if path in seen: return\n        seen.add(path); result.append(path)\n        for relative in INCLUDE_RE.findall(path.read_text(encoding="utf-8")):\n            visit(STYLE / relative)\n    visit(STYLE / "points")\n    return result\n\nclass Group115MigrationTests(unittest.TestCase):\n    def test_no_live_group_115_style_or_typ(self):\n        found = set()\n        for path in production_files():\n            found.update(STYLE_115_RE.findall(path.read_text(encoding="utf-8")))\n        self.assertEqual(set(), found)\n        self.assertEqual(set(), set(TYP_115_RE.findall(TYP.read_text(encoding="utf-8"))))\n\nif __name__ == "__main__": unittest.main()\n''', encoding='utf-8')

          Path('tests/test_low_peak_style.py').write_text('''from pathlib import Path\nimport unittest\n\nROOT = Path(__file__).resolve().parents[1]\nLANDUSE = ROOT / "styles" / "uralla" / "inc" / "landuse_points"\n\nclass LowPeakStyleTests(unittest.TestCase):\n    def test_peak_and_hill_below_200m_use_only_6615(self):\n        text = LANDUSE.read_text(encoding="utf-8")\n        rule = "(natural=peak | natural=hill) & ele < 200 [0x6615 resolution 24]"\n        self.assertIn(rule, text)\n        self.assertLess(text.index(rule), text.index("uralla:peak_landmark=yes"))\n        self.assertLess(text.index(rule), text.index("natural=peak & ele=* & name=*"))\n\nif __name__ == "__main__": unittest.main()\n''', encoding='utf-8')

          Path('docs/POI_115_MIGRATION.md').write_text('''# POI group `0x115` migration\n\nThis file is the authoritative current-state record for POI group `0x115`. Historical snapshots under `docs/history/` are not current state.\n\n## Status: COMPLETE\n\nNo production point rule and no TYP `_point` block remains in group `0x115`.\n\n| Old type | Meaning | Current type |\n| --- | --- | --- |\n| `0x11500` | межевой знак | `0x6609` |\n| `0x11501` | очистные сооружения | `0x641e` |\n| `0x11504` | урочище / locality | `0x660a` |\n| `0x11505` | пчеловод | `0x2f1a` |\n| `0x11506` | тура | `0x660b` |\n| `0x11507` | седловина / перевал | `0x660c` |\n| `0x11509` | chalet / домик | `0x2b08` |\n| `0x1150a` | велосипеды / велосервис | `0x2f18` |\n\nThe final six moves preserve their original TYP bitmap blocks and change only the Garmin address plus descriptive comment.\n''', encoding='utf-8')
          PY
      - name: Verify live state
        shell: bash
        run: |
          ! grep -n '^Type=0x115$' styles/uralla.txt
          ! grep -R -n '0x1150[014679]' styles/uralla styles/uralla.txt
          grep -R -n '0x6609\|0x641e\|0x660a\|0x660b\|0x660c\|0x2b08' styles/uralla
          grep -n '(natural=peak | natural=hill) & ele < 200 \[0x6615 resolution 24\]' styles/uralla/inc/landuse_points
          grep -n '\[preprocess\] done; report:' uralla_build/cli.py
      - name: Commit and remove one-shot workflows
        shell: bash
        run: |
          rm -f .github/workflows/migrate-remaining-115.yml .github/workflows/migrate-remaining-115-v2.yml .github/workflows/migrate-remaining-115-v3.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles uralla_build/cli.py tests docs/POI_115_MIGRATION.md .github/workflows
          git commit -m 'Complete 0x115 POI migration and refine low peaks'
          git push
