name: Remove dead railway comments

"on":
  push:
    paths:
      - '.github/workflows/remove-dead-railway-comments.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove dead railway comments
        shell: python
        run: |
          from pathlib import Path
          path = Path('styles/uralla/points')
          text = path.read_text()
          targets = [
              "#railway=station [0x2f08 resolution 22]\n",
              "#( public_transport=platform & rail=yes ) | railway=halt [0x2f08 resolution 23]\n",
          ]
          for target in targets:
              if target not in text:
                  raise SystemExit(f'missing target: {target!r}')
              text = text.replace(target, '', 1)
          path.write_text(text)
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/remove-dead-railway-comments.yml
          git add styles/uralla/points
          git commit -m "Remove dead railway POI comments"
          git pull --rebase origin main
          git push origin main
