name: Debug Solnyshko accommodation
on:
  push:
    paths:
      - '.github/workflows/debug-solnyshko-accommodation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch diagnostic
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('uralla_build/preprocessor.py')
          s = p.read_text(encoding='utf-8')
          old = '    transit_context_samples: list[dict[str, object]] = []\n    started = time.monotonic()\n'
          new = '    transit_context_samples: list[dict[str, object]] = []\n    solnyshko_accommodation_sample: dict[str, object] | None = None\n    started = time.monotonic()\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = '''                    if accommodation_sample is not None and len(accommodation_context_samples) < 200:\n                        accommodation_context_samples.append(accommodation_sample)\n'''
          new = old + '''                    if (\n                        accommodation_sample is not None\n                        and accommodation_sample.get("name") == "Солнышко"\n                    ):\n                        solnyshko_accommodation_sample = dict(accommodation_sample)\n'''
          assert old in s
          s = s.replace(old, new, 1)
          marker = '''        _emit_progress(\n            f"POI context: hotels/hostels {accommodation_index.shop_count:,}; "\n            f"common {counters['accommodation_priority_common']:,}; "\n            f"sparse {counters['accommodation_priority_sparse']:,}; "\n            f"isolated {counters['accommodation_priority_isolated']:,}"\n        )\n'''
          assert marker in s
          extra = marker + '''        if solnyshko_accommodation_sample is None:\n            _emit_progress("POI accommodation check: 'Солнышко' not enriched")\n        else:\n            _emit_progress(\n                "POI accommodation check: "\n                f"'Солнышко'; id={solnyshko_accommodation_sample['id']}; "\n                f"2km={solnyshko_accommodation_sample['objects_2km']}; "\n                f"10km={solnyshko_accommodation_sample['objects_10km']}; "\n                f"priority={solnyshko_accommodation_sample['priority']}"\n            )\n'''
          s = s.replace(marker, extra, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          python -m py_compile uralla_build/preprocessor.py
          grep -F "POI accommodation check:" uralla_build/preprocessor.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uralla_build/preprocessor.py
          git commit -m "Persist Solnyshko accommodation diagnostic"
          git push
