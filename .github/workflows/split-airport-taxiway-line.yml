name: Split airport taxiway line type

on:
  push:
    paths:
      - '.github/workflows/split-airport-taxiway-line.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Assign separate taxiway line type and clone TYP line
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          lines = Path('styles/uralla/lines')
          s = lines.read_text()
          old = "(aeroway=taxiway | aeroway=taxilane) & highway!=* & is_closed()=false {name '${ref}'} [0x27 resolution 23]"
          new = "(aeroway=taxiway | aeroway=taxilane) & highway!=* & is_closed()=false {name '${ref}'} [0x10f1c resolution 23]"
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          lines.write_text(s)

          typ = Path('styles/uralla.txt')
          t = typ.read_text()
          assert 'Type=0x10f1c' not in t
          m = re.search(r'\[_line\]\nType=0x10f1b\n.*?\n\[end\]', t, re.S)
          assert m, 'reference line type 0x10f1b not found'
          block = m.group(0).replace('Type=0x10f1b', 'Type=0x10f1c', 1)
          insert_at = m.end()
          t = t[:insert_at] + '\n\n' + block + t[insert_at:]
          typ.write_text(t)
          PY
      - name: Commit changes and remove workflow
        run: |
          rm .github/workflows/split-airport-taxiway-line.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/lines styles/uralla.txt .github/workflows/split-airport-taxiway-line.yml
          git commit -m "Give taxiways a separate Garmin line type"
          git push
