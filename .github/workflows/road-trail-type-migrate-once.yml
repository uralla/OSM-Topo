name: Road trail type migrate once

on:
  push:
    paths:
      - scripts/tools/migrate_road_trail_types_once.py
      - .github/workflows/road-trail-type-migrate-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate road and trail types
        run: python scripts/tools/migrate_road_trail_types_once.py
      - name: Run focused regression
        run: python -m unittest tests.test_line_fallback_cleanup -v
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet -- styles/uralla.txt styles/uralla/lines tests/test_line_fallback_cleanup.py; then
            echo "No migration changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla.txt styles/uralla/lines tests/test_line_fallback_cleanup.py
          git commit -m "Use canonical routable road and trail types"
          git push origin HEAD:main
