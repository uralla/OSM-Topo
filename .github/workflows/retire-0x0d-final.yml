name: Retire remaining polygon 0x0d

'on':
  push:
    paths:
      - '.github/workflows/retire-0x0d-final.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git pull --rebase origin main
      - name: Move production users off Reservation type
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('styles/uralla/polygons')
          s=p.read_text()
          s=s.replace("tourism=attraction & building!=* & leisure!=* & natural!=*\t{name '${name}' | '${addr:street} ${addr:housenumber}' | '${addr:housenumber}' } [0x0d resolution 22]", "tourism=attraction & building!=* & leisure!=* & natural!=*\t{name '${name}' | '${addr:street} ${addr:housenumber}' | '${addr:housenumber}' } [0x10f13 resolution 22]")
          s=s.replace('tourism=theme_park [0x0d resolution 21]', 'tourism=theme_park [0x10f13 resolution 21]')
          s=s.replace("tourism=* & building!=* & leisure!=* {name '${name}' | '${addr:street} ${addr:housenumber}' | '${addr:housenumber}' } [0x0d resolution 22]", "tourism=* & building!=* & leisure!=* {name '${name}' | '${addr:street} ${addr:housenumber}' | '${addr:housenumber}' } [0x10f13 resolution 22]")
          s=s.replace("(public_transport=platform & area=yes & mkgmap:area2poi!=true | railway=platform & area=yes & mkgmap:area2poi!=true) & !(layer<0) { name '${name}' | 'платформа' } [0x0d resolution 21]", "(public_transport=platform & area=yes & mkgmap:area2poi!=true | railway=platform & area=yes & mkgmap:area2poi!=true) & !(layer<0) { name '${name}' | 'платформа' } [0x10f14 resolution 21]")
          assert '[0x0d resolution' not in s
          p.write_text(s)

          t=Path('styles/uralla.txt')
          x=t.read_text()
          if 'Type=0x10f13\n;GRMN_TYPE: Customizable Areas/TOURISM_AREA/' not in x:
              blocks='''\n\n[_polygon]\nType=0x10f13\n;GRMN_TYPE: Customizable Areas/TOURISM_AREA/Tourism area\nString1=0x19,туристический объект\nString2=0x04,tourism area\nExtendedLabels=Y\nFontStyle=NoLabel (invisible)\nCustomColor=No\nContourColor=No\nXpm="0 0 1 0"\n"1 c #FFCA8B"\n[end]\n\n[_polygon]\nType=0x10f14\n;GRMN_TYPE: Customizable Areas/PLATFORM_AREA/Railway or public transport platform\nString1=0x19,платформа\nString2=0x04,platform\nExtendedLabels=Y\nFontStyle=NoLabel (invisible)\nCustomColor=No\nContourColor=No\nXpm="0 0 1 0"\n"1 c #FFCA8B"\n[end]\n'''
              marker='\n\n[_polygon]\nType=0x0f\n'
              assert marker in x
              x=x.replace(marker, blocks+marker, 1)
          if 'Type=0x10f13,4' not in x:
              marker='Type=0x10f12,4\n'
              assert marker in x
              x=x.replace(marker, marker+'Type=0x10f13,4\nType=0x10f14,4\n', 1)
          t.write_text(x)
          assert 'Type=0x10f13,4' in x and 'Type=0x10f14,4' in x
          PY
      - name: Commit
        run: |
          rm .github/workflows/retire-0x0d-final.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/polygons styles/uralla.txt .github/workflows/retire-0x0d-final.yml
          git commit -m 'Retire system polygon 0x0d from production style'
          git push
