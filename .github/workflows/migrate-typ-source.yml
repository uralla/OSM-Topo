name: Migrate TYP source directly

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make uralla.txt authoritative
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 occurrence, found {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          pier_polygon_old = '''[_polygon]
          Type=0x10f11
          ;GRMN_TYPE: Customizable Areas/CUSTOMIZABLE_AREA_18/Customizable area/Non NT, NT
          String1=0x19,пирс
          String2=0x04,pier
          ExtendedLabels=Y
          FontStyle=NoLabel (invisible)
          CustomColor=No
          ContourColor=No
          Xpm="0 0 1 0"
          "1 c #E6E6E6"
          [end]'''.replace("          ", "")
          pier_polygon_new = pier_polygon_old.replace('#E6E6E6', '#626262')

          pier_line_old = '''[_line]
          Type=0x10f07
          ;GRMN_TYPE: Customizable Line Types/CUSTOMIZABLE_LINE_40/Non-routable customizable line/Non NT, NT
          UseOrientation=N
          Xpm="32 5 2  1"
          "! c #101010"
          "  c none"
          "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          "!!!     !!!     !!!     !!!     "
          "!!!     !!!     !!!     !!!     "
          "!!!     !!!     !!!     !!!     "
          "!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!"
          ;12345678901234567890123456789012
          String1=0x19,пирс
          String2=0x04,pier
          ExtendedLabels=Y
          FontStyle=NoLabel (invisible)
          CustomColor=No
          ContourColor=No
          [end]'''.replace("          ", "")
          pier_line_new = '''[_line]
          Type=0x10f07
          ;GRMN_TYPE: Customizable Line Types/CUSTOMIZABLE_LINE_40/Non-routable customizable line/Non NT, NT
          UseOrientation=N
          LineWidth=3
          Xpm="0 0 1 0"
          "1 c #626262"
          String1=0x19,пирс
          String2=0x04,pier
          ExtendedLabels=Y
          FontStyle=NoLabel (invisible)
          CustomColor=No
          ContourColor=No
          [end]'''.replace("          ", "")

          replace_once('styles/uralla.txt', pier_polygon_old, pier_polygon_new, 'pier polygon')
          replace_once('styles/uralla.txt', pier_line_old, pier_line_new, 'pier line')
          replace_once('config/maps.yaml', '  typ: styles/uralla.typ\n', '  typ: styles/uralla.txt\n', 'manifest TYP source')

          build_plan = Path('uralla_build/build_plan.py')
          text = build_plan.read_text(encoding='utf-8')
          old = '''    typ = repo_path(repo, _text(defaults.get("typ"), "defaults.typ"))
          typ_source = typ.with_suffix(".txt")
          typ_prepare = repo_path(repo, "scripts/prepare-typ.py")
          '''.replace("          ", "")
          new = '    typ = repo_path(repo, _text(defaults.get("typ"), "defaults.typ"))\n'
          if text.count(old) != 1:
              raise SystemExit('build_plan TYP setup block not found exactly once')
          text = text.replace(old, new, 1)
          old = '''    prepared_typ = build_root / "prepare-typ" / "uralla.txt"
          stages.append(
              PipelineStage(
                  "prepare-typ",
                  (
                      sys.executable,
                      str(typ_prepare),
                      "--input",
                      str(typ_source),
                      "--output",
                      "uralla.txt",
                  ),
                  ("uralla.txt",),
              )
          )

          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit('build_plan prepare-typ stage not found exactly once')
          text = text.replace(old, '', 1)
          if text.count('            str(prepared_typ),\n') != 1:
              raise SystemExit('prepared TYP mkgmap argument not found exactly once')
          text = text.replace('            str(prepared_typ),\n', '            str(typ),\n', 1)
          build_plan.write_text(text, encoding='utf-8', newline='\n')

          tests = Path('tests/test_build_plan.py')
          text = tests.read_text(encoding='utf-8')
          text = text.replace('                    "prepare-typ",\n', '', 1)
          old = '''            prepare_typ = next(stage for stage in plan.stages if stage.name == "prepare-typ")
          self.assertIn("scripts/prepare-typ.py", " ".join(prepare_typ.command))
          self.assertEqual(prepare_typ.expected_outputs, ("uralla.txt",))
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit('prepare-typ test block not found exactly once')
          text = text.replace(old, '', 1)
          if text.count('            self.assertTrue(mkgmap.command[-1].endswith("/prepare-typ/uralla.txt"))\n') != 1:
              raise SystemExit('prepared TYP test assertion not found exactly once')
          text = text.replace(
              '            self.assertTrue(mkgmap.command[-1].endswith("/prepare-typ/uralla.txt"))\n',
              '            self.assertTrue(mkgmap.command[-1].endswith("/repo/styles/uralla.txt"))\n',
              1,
          )
          tests.write_text(text, encoding='utf-8', newline='\n')

          Path('scripts/prepare-typ.py').unlink()
          Path('.github/workflows/migrate-typ-source.yml').unlink()
          PY

      - name: Sanity check
        run: |
          python3 -m compileall -q uralla_build
          grep -A12 '^Type=0x10f11$' styles/uralla.txt | head -13
          grep -A14 '^Type=0x10f07$' styles/uralla.txt | head -15
          grep '^  typ:' config/maps.yaml
          ! grep -q 'prepare-typ' uralla_build/build_plan.py

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use uralla.txt as authoritative TYP source'
          git push
