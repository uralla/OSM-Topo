name: Migrate selected POI types

on:
  push:
    paths:
      - '.github/workflows/migrate-native-poi-types.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate selected native POIs to custom addresses
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          expected_blobs = {
              'styles/uralla.txt': '5b612cdb291c69c95b666ce62a497fc35535937d',
              'styles/uralla/points': 'd1eb055ef7fe3f1e66940bbf024ca9da3b72f6ad',
              'styles/uralla/inc/priority_points': '41fd1c8f12f9062431412d60c4cc7aae07ba72b2',
              'styles/uralla/inc/place_points': 'e1a584152c17b1284560db75abf059ee2e0b5750',
              'styles/uralla/inc/landuse_points': '929c5cd3bf9c8434ea32d82a2dd8d1f2e5c47c70',
              'styles/uralla/inc/water_points': '404d31c91e4e59e76358e688e45424327a5c73b9',
          }
          for path, expected in expected_blobs.items():
              got = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if got != expected:
                  raise SystemExit(f'{path}: expected blob {expected}, got {got}; aborting')

          def replace_all(path, mapping):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              for old, new in mapping.items():
                  count = text.count(old)
                  if count == 0:
                      raise SystemExit(f'{path}: expected {old} but found none')
                  if new in text:
                      raise SystemExit(f'{path}: destination {new} already present before migration')
                  text = text.replace(old, new)
                  print(f'{path}: {old} -> {new}: {count}')
              p.write_text(text, encoding='utf-8')

          replace_all('styles/uralla/inc/priority_points', {
              '0x2a00': '0x6501',
              '0x2e02': '0x6504',
              '0x2e00': '0x6505',
              '0x2f05': '0x650b',
              '0x2b01': '0x650d',
              '0x2b02': '0x6510',
              '0x2b05': '0x6519',
              '0x2b07': '0x651a',
              '0x4c00': '0x6507',
              '0x2c08': '0x660d',
              '0x2c09': '0x660e',
          })

          points = Path('styles/uralla/points')
          text = points.read_text(encoding='utf-8')
          for old, new in {
              '0x2f06': '0x6509',
              '0x2e05': '0x6506',
              '0x2f05': '0x650b',
              '0x2c04': '0x6600',
              '0x2c02': '0x6605',
              '0x2b03': '0x6518',
              '0x2b05': '0x6519',
              '0x4a00': '0x660a',
              '0x2b06': '0x651b',
              '0x4a01': '0x660b',
              '0x1600': '0x6610',
          }.items():
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'styles/uralla/points: expected {old} but found none')
              if new in text:
                  raise SystemExit(f'styles/uralla/points: destination {new} already present')
              text = text.replace(old, new)
              print(f'styles/uralla/points: {old} -> {new}: {count}')

          for old, new in (
              ('amenity=bar [0x2d02 resolution 24]', 'amenity=bar [0x6502 resolution 24]'),
              ('amenity=biergarten [0x2d02 resolution 24]', 'amenity=biergarten [0x6502 resolution 24]'),
              ('amenity=pub [0x2d02 resolution 24]', 'amenity=pub [0x6502 resolution 24]'),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f'styles/uralla/points: expected exactly one {old!r}')
              text = text.replace(old, new, 1)

          old_subway = '(railway=station & station=subway & mkgmap:area2poi!=true) | (railway=station & subway=yes & mkgmap:area2poi!=true) [0x1613 resolution 19]'
          new_subway = '(railway=station & station=subway & mkgmap:area2poi!=true) | (railway=station & subway=yes & mkgmap:area2poi!=true) [0x1613 resolution 22]'
          if text.count(old_subway) != 1:
              raise SystemExit('styles/uralla/points: subway station rule changed unexpectedly')
          text = text.replace(old_subway, new_subway, 1)
          points.write_text(text, encoding='utf-8')

          replace_all('styles/uralla/inc/landuse_points', {
              '0x2e00': '0x6505',
              '0x2c0c': '0x660c',
              '0x2c08': '0x660d',
              '0x2c09': '0x660e',
          })
          replace_all('styles/uralla/inc/water_points', {
              '0x5001': '0x6500',
          })
          replace_all('styles/uralla/inc/place_points', {
              '0x02c04': '0x6600',
              '0x0b00': '0x6418',
          })

          typ_path = Path('styles/uralla.txt')
          typ = typ_path.read_text(encoding='utf-8')
          block_re = re.compile(r'(?ms)^\[_point\]\n.*?^\[end\](?:\n+|$)')
          blocks = list(block_re.finditer(typ))
          index = {}
          for match in blocks:
              block = match.group(0)
              type_match = re.search(r'(?m)^Type=0x([0-9a-fA-F]+)\s*$', block)
              sub_match = re.search(r'(?m)^SubType=0x([0-9a-fA-F]+)\s*$', block)
              if not type_match or not sub_match:
                  continue
              key = (int(type_match.group(1), 16), int(sub_match.group(1), 16))
              if key in index:
                  raise SystemExit(f'duplicate TYP point block at {key!r}')
              index[key] = block

          clones = [
              ((0x050,0x01),(0x065,0x00)),
              ((0x02a,0x00),(0x065,0x01)),
              ((0x02d,0x02),(0x065,0x02)),
              ((0x02e,0x02),(0x065,0x04)),
              ((0x02e,0x00),(0x065,0x05)),
              ((0x02e,0x05),(0x065,0x06)),
              ((0x04c,0x00),(0x065,0x07)),
              ((0x02f,0x06),(0x065,0x09)),
              ((0x02f,0x05),(0x065,0x0b)),
              ((0x02b,0x01),(0x065,0x0d)),
              ((0x02b,0x02),(0x065,0x10)),
              ((0x02b,0x03),(0x065,0x18)),
              ((0x02b,0x05),(0x065,0x19)),
              ((0x02b,0x07),(0x065,0x1a)),
              ((0x02b,0x06),(0x065,0x1b)),
              ((0x02c,0x04),(0x066,0x00)),
              ((0x02c,0x02),(0x066,0x05)),
              ((0x04a,0x00),(0x066,0x0a)),
              ((0x04a,0x01),(0x066,0x0b)),
              ((0x02c,0x0c),(0x066,0x0c)),
              ((0x02c,0x08),(0x066,0x0d)),
              ((0x02c,0x09),(0x066,0x0e)),
              ((0x016,0x00),(0x066,0x10)),
              ((0x00b,0x00),(0x064,0x18)),
          ]
          new_blocks = []
          for source, destination in clones:
              if source not in index:
                  raise SystemExit(f'missing TYP source block {source!r}')
              if destination in index:
                  raise SystemExit(f'TYP destination already occupied {destination!r}')
              block = index[source]
              block = re.sub(
                  r'(?m)^Type=0x[0-9a-fA-F]+\s*$',
                  f'Type=0x{destination[0]:03x}',
                  block,
                  count=1,
              )
              block = re.sub(
                  r'(?m)^SubType=0x[0-9a-fA-F]+\s*$',
                  f'SubType=0x{destination[1]:02x}',
                  block,
                  count=1,
              )
              new_blocks.append(block.rstrip() + '\n\n')

          marker = ';====================== POINTS ==========================\n\n\n'
          if typ.count(marker) != 1:
              raise SystemExit('TYP point-section marker changed unexpectedly')
          typ = typ.replace(marker, marker + ''.join(new_blocks), 1)
          typ_path.write_text(typ, encoding='utf-8')

          # Post-migration checks.
          for path in expected_blobs:
              if not Path(path).is_file():
                  raise SystemExit(f'missing output {path}')

          # Native addresses explicitly left alone in this migration.
          points_text = points.read_text(encoding='utf-8')
          for untouched in ('0x2100', '0x210f', '0x5a00'):
              if untouched not in (points_text + Path('styles/uralla/inc/priority_points').read_text(encoding='utf-8')):
                  raise SystemExit(f'expected untouched address {untouched} disappeared')
          if 'amenity=nightclub [0x2d02 resolution 24]' not in points_text:
              raise SystemExit('nightclub must remain on native 0x2d02')
          if 'leisure=stadium' not in points_text or '[0x2c08 resolution 24]' not in points_text:
              raise SystemExit('stadium/arena native 0x2c08 rule must remain')
          if '[0x1613 resolution 19]' in points_text or '[0x1613 resolution 22]' not in points_text:
              raise SystemExit('subway station resolution migration failed')

          # Every new TYP destination must exist exactly once.
          typ_after = typ_path.read_text(encoding='utf-8')
          blocks_after = list(block_re.finditer(typ_after))
          addresses_after = []
          for match in blocks_after:
              block = match.group(0)
              tm = re.search(r'(?m)^Type=0x([0-9a-fA-F]+)\s*$', block)
              sm = re.search(r'(?m)^SubType=0x([0-9a-fA-F]+)\s*$', block)
              if tm and sm:
                  addresses_after.append((int(tm.group(1),16), int(sm.group(1),16)))
          for _, destination in clones:
              if addresses_after.count(destination) != 1:
                  raise SystemExit(f'bad destination TYP block count for {destination!r}')

          print('POI migration checks passed')
          PY
      - name: Verify diff
        run: |
          git diff --check
          git diff --stat
          git status --short
      - name: Commit migration
        run: |
          git config user.name 'Alexey Klyanin'
          git config user.email '42924160+uralla@users.noreply.github.com'
          git add \
            styles/uralla.txt \
            styles/uralla/points \
            styles/uralla/inc/priority_points \
            styles/uralla/inc/place_points \
            styles/uralla/inc/landuse_points \
            styles/uralla/inc/water_points
          git commit -m 'Migrate selected POIs to custom Garmin types'
          git push
