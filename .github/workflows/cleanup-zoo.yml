name: Cleanup zoo compatibility rules

on:
  push:
    paths:
      - '.github/workflows/cleanup-zoo.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Merge zoo compatibility rules
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('styles/uralla/points')
          s = p.read_text()
          old_legacy = "# amenity=zoo is superceded by tourism=zoo\namenity=zoo [0x2c07 resolution 24]\n"
          old_current = "tourism=zoo [0x2c07 resolution 24]\n"
          assert s.count(old_legacy) == 1
          assert s.count(old_current) == 1
          s = s.replace(old_legacy, '', 1)
          s = s.replace(old_current, '(amenity=zoo | tourism=zoo) [0x2c07 resolution 24]\n', 1)
          p.write_text(s)
          PY
      - name: Commit cleanup and remove workflow
        run: |
          rm .github/workflows/cleanup-zoo.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/points .github/workflows/cleanup-zoo.yml
          git commit -m "Unify zoo compatibility POI rule"
          git push
