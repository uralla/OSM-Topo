name: Retry accommodation context scoring

on:
  push:
    paths:
      - '.github/workflows/retry-accommodation-context.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path

          # Spatial context module: add a second, independent rarity index for hotels/hostels.
          p = Path('uralla_build/poi_context.py')
          s = p.read_text(encoding='utf-8')
          assert 'ACCOMMODATION_VALUES' not in s
          s = s.replace('FOOD_SHOP_VALUES = frozenset(\n', 'ACCOMMODATION_VALUES = frozenset({"hotel", "hostel"})\n\nFOOD_SHOP_VALUES = frozenset(\n', 1)
          anchor = 'def classify_food_shop(*, shops_2km: int, shops_10km: int) -> tuple[str, str]:\n'
          assert anchor in s
          s = s.replace(anchor, '''def is_accommodation(tags: Mapping[str, str] | object) -> bool:\n    items = tags.items() if isinstance(tags, Mapping) else iter(tags)  # type: ignore[arg-type]\n    values = {str(key): str(value) for key, value in items}\n    return values.get("tourism") in ACCOMMODATION_VALUES\n\n\ndef classify_accommodation(*, objects_2km: int, objects_10km: int) -> tuple[str, str]:\n    if objects_2km <= 1 and objects_10km <= 3:\n        return "remote", "isolated"\n    if objects_2km <= 3 and objects_10km <= 10:\n        return "settlement", "sparse"\n    return "urban", "common"\n\n\n''' + anchor, 1)
          anchor = 'def enrich_food_shop_context(\n'
          assert anchor in s
          s = s.replace(anchor, '''def build_accommodation_index(source: str, osmium: Any) -> FoodShopIndex:\n    index = FoodShopIndex.empty()\n    for item in osmium.FileProcessor(source):\n        if not is_accommodation(item.tags):\n            continue\n        location = valid_node_location(item)\n        if location is not None:\n            index.add(*location)\n    return index\n\n\ndef enrich_accommodation_context(\n    item: object,\n    tags: Mapping[str, str] | object,\n    index: FoodShopIndex,\n) -> tuple[dict[str, str], bool, dict[str, object] | None]:\n    items = tags.items() if isinstance(tags, Mapping) else iter(tags)  # type: ignore[arg-type]\n    result = {str(key): str(value) for key, value in items}\n    if not is_accommodation(result):\n        return result, False, None\n    location = valid_node_location(item)\n    if location is None:\n        return result, False, None\n    lat, lon = location\n    objects_2km = index.count_within(lat, lon, 2.0)\n    objects_10km = index.count_within(lat, lon, 10.0)\n    context, priority = classify_accommodation(objects_2km=objects_2km, objects_10km=objects_10km)\n    desired = {\n        POI_CONTEXT_TAG: context,\n        POI_PRIORITY_TAG: priority,\n        "uralla:poi_accommodation_2km": str(objects_2km),\n        "uralla:poi_accommodation_10km": str(objects_10km),\n    }\n    changed = any(result.get(key) != value for key, value in desired.items())\n    result.update(desired)\n    return result, changed, {\n        "id": int(getattr(item, "id", 0)), "name": result.get("name"),\n        "tourism": result.get("tourism"), "context": context, "priority": priority,\n        "objects_2km": objects_2km, "objects_10km": objects_10km, "lat": lat, "lon": lon,\n    }\n\n\n''' + anchor, 1)
          p.write_text(s, encoding='utf-8')

          # Preprocessor integration.
          p = Path('uralla_build/preprocessor.py')
          s = p.read_text(encoding='utf-8')
          old = 'from .poi_context import build_food_shop_index, enrich_food_shop_context\n'
          assert old in s
          s = s.replace(old, '''from .poi_context import (\n    build_accommodation_index,\n    build_food_shop_index,\n    enrich_accommodation_context,\n    enrich_food_shop_context,\n)\n''', 1)

          anchor = '    temporary = target.parent / f".{target.name}.{uuid4().hex}.partial.osm.pbf"\n'
          assert anchor in s
          s = s.replace(anchor, '''    _emit_progress("accommodation context: indexing node hotels/hostels")\n    accommodation_started = time.monotonic()\n    accommodation_index = build_accommodation_index(str(source), osmium)\n    _emit_progress(\n        f"accommodation context: {accommodation_index.shop_count:,} node hotels/hostels indexed "\n        f"in {time.monotonic() - accommodation_started:.1f}s"\n    )\n''' + anchor, 1)

          anchor = '    poi_context_samples: list[dict[str, object]] = []\n'
          assert anchor in s
          s = s.replace(anchor, anchor + '    accommodation_context_samples: list[dict[str, object]] = []\n', 1)

          anchor = '                original_tags = {str(key): str(value) for key, value in item.tags}\n'
          assert anchor in s
          s = s.replace(anchor, '''                final_tags, accommodation_added, accommodation_sample = enrich_accommodation_context(\n                    item, final_tags, accommodation_index\n                )\n                if accommodation_added:\n                    counters["accommodation_context_enriched"] += 1\n                    accommodation_priority = final_tags.get("uralla:poi_priority", "unknown")\n                    counters[f"accommodation_priority_{accommodation_priority}"] += 1\n                    if accommodation_sample is not None and len(accommodation_context_samples) < 200:\n                        accommodation_context_samples.append(accommodation_sample)\n\n''' + anchor, 1)

          anchor = '            "poi_context_index_node_shops": food_shop_index.shop_count,\n'
          assert anchor in s
          s = s.replace(anchor, anchor + '''            "accommodation_context_index_nodes": accommodation_index.shop_count,\n            "accommodation_context_enriched": counters["accommodation_context_enriched"],\n            "accommodation_priority_common": counters["accommodation_priority_common"],\n            "accommodation_priority_sparse": counters["accommodation_priority_sparse"],\n            "accommodation_priority_isolated": counters["accommodation_priority_isolated"],\n''', 1)

          anchor = '            "poi_context_samples": poi_context_samples,\n'
          assert anchor in s
          s = s.replace(anchor, anchor + '            "accommodation_context_samples": accommodation_context_samples,\n', 1)

          # Insert accommodation summary immediately before report creation.
          anchor = '        report: dict[str, object] = {\n'
          assert anchor in s
          s = s.replace(anchor, '''        _emit_progress(\n            f"POI context: hotels/hostels {accommodation_index.shop_count:,}; "\n            f"common {counters['accommodation_priority_common']:,}; "\n            f"sparse {counters['accommodation_priority_sparse']:,}; "\n            f"isolated {counters['accommodation_priority_isolated']:,}"\n        )\n''' + anchor, 1)
          p.write_text(s, encoding='utf-8')

          # Same LOD policy as context-aware shops: isolated=22, sparse=23, common=24.
          p = Path('styles/uralla/inc/priority_points')
          s = p.read_text(encoding='utf-8')
          old = '''tourism=guest_house [0x2b01 resolution 21]\n(tourism=hotel | tourism=motel) [0x2b01 resolution 24]\ntourism=hostel [0x2b02 resolution 24]\n'''
          assert old in s
          s = s.replace(old, '''tourism=guest_house [0x2b01 resolution 21]\nuralla:poi_priority=isolated & tourism=hotel [0x2b01 resolution 22]\nuralla:poi_priority=sparse & tourism=hotel [0x2b01 resolution 23]\ntourism=hotel [0x2b01 resolution 24]\ntourism=motel [0x2b01 resolution 24]\nuralla:poi_priority=isolated & tourism=hostel [0x2b02 resolution 22]\nuralla:poi_priority=sparse & tourism=hostel [0x2b02 resolution 23]\ntourism=hostel [0x2b02 resolution 24]\n''', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          python -m py_compile uralla_build/preprocessor.py uralla_build/poi_context.py
          python -m unittest tests.test_poi_context -v
          grep -F 'uralla:poi_priority=isolated & tourism=hotel' styles/uralla/inc/priority_points
          grep -F 'uralla:poi_priority=sparse & tourism=hostel' styles/uralla/inc/priority_points
          grep -F 'POI context: hotels/hostels' uralla_build/preprocessor.py
      - name: Commit
        run: |
          rm -f .github/workflows/add-accommodation-context.yml .github/workflows/retry-accommodation-context.yml
          git config user.name 'Alexey Klyanin'
          git config user.email '42924160+uralla@users.noreply.github.com'
          git add -A
          git commit -m 'Add context-aware hotel and hostel POIs'
          git push
