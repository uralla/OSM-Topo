name: Remove survey custom TYP

"on":
  push:
    paths:
      - ".github/workflows/remove-survey-custom-typ.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove 0x11508 TYP block
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("styles/uralla.txt")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(r"(?ms)^\[_point\]\nType=0x115\nSubType=0x08\n.*?^\[end\]\n?")
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one 0x11508 point block, found {len(matches)}")
          text = pattern.sub("", text, count=1)
          path.write_text(text, encoding="utf-8")
          if re.search(r"(?ms)^\[_point\]\nType=0x115\nSubType=0x08\n", text):
              raise SystemExit("0x11508 point block still present")
          Path(".github/workflows/remove-survey-custom-typ.yml").unlink()
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla.txt .github/workflows/remove-survey-custom-typ.yml
          git commit -m "Remove redundant survey point TYP"
          git pull --rebase origin main
          git push
