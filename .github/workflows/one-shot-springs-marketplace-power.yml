name: One-shot springs marketplace power patch

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/one_shot_springs_marketplace_power.py'
      - '.github/workflows/one-shot-springs-marketplace-power.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python .github/scripts/one_shot_springs_marketplace_power.py
      - name: Sanity checks
        run: |
          python -m py_compile uralla_build/poi_context.py uralla_build/preprocessor.py
          grep -q 'kind="spring"' uralla_build/preprocessor.py
          grep -q 'amenity=marketplace' styles/uralla/polygons
          grep -q 'amenity=marketplace' styles/uralla/inc/priority_points
          grep -q 'power=line & length()>500 \[0x29 resolution 22-23 continue\]' styles/uralla/lines
      - name: Commit result
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/poi_context.py uralla_build/preprocessor.py styles/uralla/inc/water_points styles/uralla/inc/priority_points styles/uralla/polygons styles/uralla/lines
          git commit -m 'Make springs adaptive and render marketplaces'
          git push
