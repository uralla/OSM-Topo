name: Add POI context prototype

on:
  push:
    paths:
      - '.github/workflows/add-poi-context-prototype.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Integrate food-shop context pass
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('uralla_build/preprocessor.py')
          s = p.read_text(encoding='utf-8')

          old = """from .river_landmarks import (\n    DEFAULT_RIVER_CATALOG,\n    enrich_river_landmark_tags,\n    load_river_landmarks,\n)\n"""
          new = old + """from .poi_context import build_food_shop_index, enrich_food_shop_context\n"""
          assert old in s and 'from .poi_context import' not in s
          s = s.replace(old, new, 1)

          old = """    osmium = _load_osmium()\n    temporary = target.parent / f\".{target.name}.{uuid4().hex}.partial.osm.pbf\"\n"""
          new = """    osmium = _load_osmium()\n    _emit_progress(\"[preprocess] food-shop context: indexing node shops\")\n    context_started = time.monotonic()\n    food_shop_index = build_food_shop_index(str(source), osmium)\n    _emit_progress(\n        f\"[preprocess] food-shop context: {food_shop_index.shop_count:,} node shops indexed \"\n        f\"in {time.monotonic() - context_started:.1f}s\"\n    )\n    temporary = target.parent / f\".{target.name}.{uuid4().hex}.partial.osm.pbf\"\n"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """    river_samples: list[dict[str, object]] = []\n    started = time.monotonic()\n"""
          new = """    river_samples: list[dict[str, object]] = []\n    poi_context_samples: list[dict[str, object]] = []\n    started = time.monotonic()\n"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """                final_tags, river_added = enrich_river_landmark_tags(\n                    final_tags, river_landmarks\n                )\n                if river_added:\n                    counters[\"river_landmarks_enriched\"] += 1\n                    if len(river_samples) < 100:\n                        river_samples.append(\n                            {\n                                \"type\": _object_kind(item),\n                                \"id\": int(item.id),\n                                \"rank\": final_tags.get(\"uralla:river_rank\"),\n                                \"name\": final_tags.get(\"name\") or final_tags.get(\"name:ru\"),\n                            }\n                        )\n\n                original_tags = {str(key): str(value) for key, value in item.tags}\n"""
          new = """                final_tags, river_added = enrich_river_landmark_tags(\n                    final_tags, river_landmarks\n                )\n                if river_added:\n                    counters[\"river_landmarks_enriched\"] += 1\n                    if len(river_samples) < 100:\n                        river_samples.append(\n                            {\n                                \"type\": _object_kind(item),\n                                \"id\": int(item.id),\n                                \"rank\": final_tags.get(\"uralla:river_rank\"),\n                                \"name\": final_tags.get(\"name\") or final_tags.get(\"name:ru\"),\n                            }\n                        )\n\n                final_tags, poi_context_added, poi_context_sample = enrich_food_shop_context(\n                    item, final_tags, food_shop_index\n                )\n                if poi_context_added:\n                    counters[\"poi_context_enriched\"] += 1\n                    priority = final_tags.get(\"uralla:poi_priority\", \"unknown\")\n                    counters[f\"poi_priority_{priority}\"] += 1\n                    if poi_context_sample is not None and len(poi_context_samples) < 200:\n                        poi_context_samples.append(poi_context_sample)\n\n                original_tags = {str(key): str(value) for key, value in item.tags}\n"""
          assert old in s
          s = s.replace(old, new, 1)

          assert '"schema_version": 7' in s
          s = s.replace('"schema_version": 7', '"schema_version": 8', 1)

          old = """            \"river_landmarks_enriched\": counters[\"river_landmarks_enriched\"],\n            \"rule_hits\": dict(sorted(rule_hits.items())),\n"""
          new = """            \"river_landmarks_enriched\": counters[\"river_landmarks_enriched\"],\n            \"poi_context_index_node_shops\": food_shop_index.shop_count,\n            \"poi_context_enriched\": counters[\"poi_context_enriched\"],\n            \"poi_priority_common\": counters[\"poi_priority_common\"],\n            \"poi_priority_sparse\": counters[\"poi_priority_sparse\"],\n            \"poi_priority_isolated\": counters[\"poi_priority_isolated\"],\n            \"rule_hits\": dict(sorted(rule_hits.items())),\n"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """            \"river_landmark_samples\": river_samples,\n"""
          new = old + """            \"poi_context_samples\": poi_context_samples,\n"""
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('styles/uralla/inc/priority_points')
          s = p.read_text(encoding='utf-8')
          old = """# Grocery group. Current and legacy supermarket tags share one close-zoom POI rule.\n(shop=supermarket | amenity=supermarket) [0x2e02 resolution 23]\n(shop=bakers | shop=bakery | shop=butcher | shop=convenience | shop=general | shop=organic) [0x2e02 resolution 24]\n"""
          new = """# Grocery group. Prototype context scoring promotes rare food shops at farther zooms.\n# The preprocessor currently scores node shops only; ordinary fallbacks stay unchanged.\nuralla:poi_priority=isolated & (shop=supermarket | amenity=supermarket | shop=bakers | shop=bakery | shop=butcher | shop=convenience | shop=general | shop=grocery | shop=organic) [0x2e02 resolution 22]\nuralla:poi_priority=sparse & (shop=supermarket | amenity=supermarket | shop=bakers | shop=bakery | shop=butcher | shop=convenience | shop=general | shop=grocery | shop=organic) [0x2e02 resolution 23]\n(shop=supermarket | amenity=supermarket) [0x2e02 resolution 23]\n(shop=bakers | shop=bakery | shop=butcher | shop=convenience | shop=general | shop=grocery | shop=organic) [0x2e02 resolution 24]\n"""
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify prototype
        run: |
          python -m py_compile uralla_build/preprocessor.py uralla_build/poi_context.py
          python -m unittest tests.test_poi_context -v
          grep -F 'uralla:poi_priority=isolated' styles/uralla/inc/priority_points
          grep -F 'poi_context_enriched' uralla_build/preprocessor.py
      - name: Commit
        run: |
          rm .github/workflows/add-poi-context-prototype.yml
          git config user.name 'Alexey Klyanin'
          git config user.email '42924160+uralla@users.noreply.github.com'
          git add -A
          git commit -m 'Prototype context-aware grocery POIs'
          git push
