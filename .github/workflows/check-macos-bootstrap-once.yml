name: Check macOS bootstrap fixes once

on:
  push:
    paths:
      - '.github/workflows/check-macos-bootstrap-once.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate setup shell
        run: bash -n setup.sh

      - name: Install project tests
        run: |
          python -m pip install -e . pytest

      - name: Run bootstrap tests
        run: pytest -q tests/test_bootstrap.py

      - name: Run full suite
        run: pytest -q

      - name: Remove one-shot workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/check-macos-bootstrap-once.yml
          git commit -m "Remove one-shot macOS bootstrap check"
          git push origin HEAD:main
