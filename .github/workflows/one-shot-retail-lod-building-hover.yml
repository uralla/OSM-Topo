name: One-shot retail LOD and building hover
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-retail-lod-building-hover.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact patch
        run: python3 .github/scripts/one_shot_retail_lod_and_building_hover.py
      - name: Verify
        run: |
          python3 -m py_compile uralla_build/poi_context.py uralla_build/poi_lod.py uralla_build/preprocessor.py
          python3 -m unittest tests.test_poi_context tests.test_poi_lod tests.test_building_hover_label -v
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/poi_context.py uralla_build/poi_lod.py uralla_build/preprocessor.py styles/uralla/inc/priority_points styles/uralla/polygons tests/test_poi_context.py tests/test_poi_lod.py tests/test_building_hover_label.py
          git commit -m 'Expand adaptive retail and fix building hover label'
          git push
