name: Prefer road over piste
'on':
  push:
    paths:
      - '.github/workflows/prefer-road-over-piste.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch style
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('styles/uralla/lines')
          s = p.read_text()
          anchor = "highway=no | highway=none {delete highway}\n"
          insert = """highway=no | highway=none {delete highway}\n# A real motor-road classification wins over seasonal piste tagging.\n# Keep piste semantics for path/footway/cycleway/bridleway/pedestrian ways,\n# but do not let piste:type=nordic replace roads such as unclassified/track/service.\nhighway=* & highway!=path & highway!=footway & highway!=cycleway & highway!=bridleway & highway!=pedestrian & highway!=steps & piste:type=*\n{ delete piste:type; delete piste:grooming }\n"""
          assert anchor in s
          s = s.replace(anchor, insert, 1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          grep -F "highway=* & highway!=path & highway!=footway" styles/uralla/lines
          grep -F "delete piste:type; delete piste:grooming" styles/uralla/lines
      - name: Commit fix
        run: |
          rm .github/workflows/prefer-road-over-piste.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Prefer real roads over seasonal piste tagging"
          git push
