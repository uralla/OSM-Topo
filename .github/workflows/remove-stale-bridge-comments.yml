name: Remove stale bridge comments

on:
  push:
    paths:
      - '.github/workflows/remove-stale-bridge-comments.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove stale bridge comments
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('styles/uralla/points')
          text = path.read_text(encoding='utf-8')
          old = "# мосты. пока не работает?\n# bridge=yes [0x6401 resolution 24 continue]\n"
          if old not in text:
              raise SystemExit('stale bridge comment block not found')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          rm .github/workflows/remove-stale-bridge-comments.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/points .github/workflows/remove-stale-bridge-comments.yml
          git commit -m "Remove stale bridge comments"
          git pull --rebase origin main
          git push
