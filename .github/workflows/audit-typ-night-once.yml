name: Audit TYP night data once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-typ-night-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit night fields in direct TYP source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re

          p = Path('styles/uralla.txt')
          raw = p.read_bytes()
          try:
              text = raw.decode('utf-8')
              enc = 'utf-8'
          except UnicodeDecodeError:
              text = raw.decode('cp1251')
              enc = 'cp1251'
          lines = text.splitlines()
          hits = []
          fields = Counter()
          for i, line in enumerate(lines):
              if re.search(r'(?i)night', line):
                  hits.append(i)
                  m = re.match(r'\s*([A-Za-z0-9_]*Night[A-Za-z0-9_]*)\s*=', line, re.I)
                  if m:
                      fields[m.group(1)] += 1
          print('encoding:', enc)
          print('night-containing lines:', len(hits))
          print('fields:', dict(fields))
          for i in hits[:80]:
              print(f'--- around line {i+1} ---')
              for j in range(max(0, i-2), min(len(lines), i+4)):
                  print(f'{j+1}: {lines[j]}')
          if len(hits) > 80:
              print('... remaining hits:', len(hits)-80)
          PY

      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/audit-typ-night-once.yml
          git commit -m "Remove one-shot TYP night audit"
          git push origin HEAD:main
