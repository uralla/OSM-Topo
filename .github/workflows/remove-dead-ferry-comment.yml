name: Remove dead ferry terminal comment

"on":
  push:
    paths:
      - '.github/workflows/remove-dead-ferry-comment.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove dead ferry comment
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('styles/uralla/points')
          text = path.read_text(encoding='utf-8')
          old = '#amenity=ferry_terminal [0x2f08 resolution 21]\n'
          if old not in text:
              raise SystemExit('target line not found')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          rm .github/workflows/remove-dead-ferry-comment.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla/points .github/workflows/remove-dead-ferry-comment.yml
          git commit -m "Remove dead ferry terminal comment"
          git pull --rebase origin main
          git push origin main
