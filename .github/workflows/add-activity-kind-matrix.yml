name: Add activity kind matrix diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-activity-kind-matrix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add context-by-kind matrix and balanced edge samples
        run: |
          python - <<'PY'
          from pathlib import Path

          pre = Path('uralla_build/preprocessor.py')
          text = pre.read_text(encoding='utf-8')
          old = '''            remote_samples = 0\n            urban_samples = 0\n            for sample in activity_context_samples:\n                context = classify_activity_context(\n                    activity_2km=int(sample[\"activity_2km\"]),\n                    activity_10km=int(sample[\"activity_10km\"]),\n                    local_p25=activity_2km_p25,\n                    local_p75=activity_2km_p75,\n                    background_p25=activity_10km_p25,\n                    background_p75=activity_10km_p75,\n                )\n                if context == \"remote\" and remote_samples < 20:\n                    _emit_progress(\n                        \"POI activity sample: remote; \"\n                        f\"name={sample.get('name')!r}; \"\n                        f\"kind={sample.get('kind')}; \"\n                        f\"priority={sample.get('priority')}; \"\n                        f\"500m={sample.get('activity_500m')}; \"\n                        f\"2km={sample.get('activity_2km')}; \"\n                        f\"10km={sample.get('activity_10km')}\"\n                    )\n                    remote_samples += 1\n                elif context == \"urban\" and urban_samples < 20:\n                    _emit_progress(\n                        \"POI activity sample: urban; \"\n                        f\"name={sample.get('name')!r}; \"\n                        f\"kind={sample.get('kind')}; \"\n                        f\"priority={sample.get('priority')}; \"\n                        f\"500m={sample.get('activity_500m')}; \"\n                        f\"2km={sample.get('activity_2km')}; \"\n                        f\"10km={sample.get('activity_10km')}\"\n                    )\n                    urban_samples += 1\n                if remote_samples >= 20 and urban_samples >= 20:\n                    break\n'''
          new = '''            activity_kind_counts: Counter[tuple[str, str]] = Counter()\n            edge_samples: dict[tuple[str, str], list[dict[str, object]]] = {}\n            for sample in activity_context_samples:\n                context = classify_activity_context(\n                    activity_2km=int(sample[\"activity_2km\"]),\n                    activity_10km=int(sample[\"activity_10km\"]),\n                    local_p25=activity_2km_p25,\n                    local_p75=activity_2km_p75,\n                    background_p25=activity_10km_p25,\n                    background_p75=activity_10km_p75,\n                )\n                kind = str(sample.get(\"kind\") or \"other\")\n                activity_kind_counts[(context, kind)] += 1\n                if context in {\"remote\", \"urban\"}:\n                    bucket = edge_samples.setdefault((context, kind), [])\n                    if len(bucket) < 5:\n                        bucket.append(sample)\n\n            for context in (\"remote\", \"settlement\", \"urban\"):\n                _emit_progress(\n                    \"POI activity matrix: \"\n                    f\"context={context}; \"\n                    f\"food={activity_kind_counts[(context, 'food')]:,}; \"\n                    f\"accommodation={activity_kind_counts[(context, 'accommodation')]:,}; \"\n                    f\"transit={activity_kind_counts[(context, 'transit')]:,}; \"\n                    f\"other={activity_kind_counts[(context, 'other')]:,}\"\n                )\n\n            for context in (\"remote\", \"urban\"):\n                for kind in (\"food\", \"accommodation\", \"transit\", \"other\"):\n                    for sample in edge_samples.get((context, kind), ()): \n                        _emit_progress(\n                            f\"POI activity sample: {context}; \"\n                            f\"name={sample.get('name')!r}; \"\n                            f\"kind={sample.get('kind')}; \"\n                            f\"priority={sample.get('priority')}; \"\n                            f\"500m={sample.get('activity_500m')}; \"\n                            f\"2km={sample.get('activity_2km')}; \"\n                            f\"10km={sample.get('activity_10km')}\"\n                        )\n'''
          if old not in text:
              raise SystemExit('old edge sample block not found')
          pre.write_text(text.replace(old, new, 1), encoding='utf-8')

          script = Path('scripts/test-poi-context.sh')
          s = script.read_text(encoding='utf-8')
          if 'POI activity matrix:' not in s:
              s = s.replace('POI activity classifier:|POI activity sample:', 'POI activity classifier:|POI activity matrix:|POI activity sample:')
          script.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: |
          python -m py_compile uralla_build/preprocessor.py
          python -m unittest tests.test_poi_context -v
          grep -q 'POI activity matrix:' uralla_build/preprocessor.py
          grep -q 'activity_kind_counts' uralla_build/preprocessor.py
          grep -q 'POI activity matrix:' scripts/test-poi-context.sh
          bash -n scripts/test-poi-context.sh

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/preprocessor.py scripts/test-poi-context.sh
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Add activity context kind matrix diagnostics'
            git push
          fi
