name: Fix BUILD-01 elevation value

'on':
  push:
    paths:
      - '.github/workflows/fix-build01-elevation-value.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git pull --rebase origin main
      - name: Restore elevation_value
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('uralla_build/build_plan.py')
          s = p.read_text()
          needle = '    # Split OSM before semantic preprocessing so independent tiles can use all CPU cores.\n    splitter_input = transformed\n'
          repl = '    elevation_value = product.get("elevation")\n\n' + needle
          assert needle in s
          assert 'elevation_value = product.get("elevation")' not in s
          p.write_text(s.replace(needle, repl, 1))
          PY
          python -m py_compile uralla_build/build_plan.py uralla_build/tile_preprocess.py
      - name: Commit
        run: |
          rm .github/workflows/fix-build01-elevation-value.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uralla_build/build_plan.py .github/workflows/fix-build01-elevation-value.yml
          git commit -m 'Restore elevation setting in parallel build plan'
          git push
