name: Check start venv once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-start-venv-once.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install project tests
        run: python -m pip install -e . pytest
      - name: Run launcher regression tests
        run: pytest -q tests/test_workspace_launcher.py
      - name: Run full suite
        run: pytest -q
      - name: Remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/check-start-venv-once.yml
          git commit -m "Complete start virtualenv validation"
          git push origin HEAD:main
