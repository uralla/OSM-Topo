name: Remove commented alpine hut rule

on:
  push:
    paths:
      - '.github/workflows/remove-commented-alpine-hut.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove stale commented rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('styles/uralla/points')
          s = p.read_text()
          old = '# tourism=alpine_hut [0x2b02 resolution 24]\n'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '', 1))
          PY
      - name: Commit cleanup and remove workflow
        run: |
          rm .github/workflows/remove-commented-alpine-hut.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/points .github/workflows/remove-commented-alpine-hut.yml
          git commit -m "Remove stale commented alpine hut rule"
          git push
