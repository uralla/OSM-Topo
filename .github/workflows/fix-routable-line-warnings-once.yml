name: Fix routable line warnings once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-routable-line-warnings-once.yml

permissions:
  contents: write

jobs:
  fix-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace unsafe routable visual types
        run: |
          python3 - <<'PY'
          from pathlib import Path

          patches = [
              (
                  Path('styles/uralla/inc/water_lines'),
                  "aerialway=cable_car { name '${name} (${ref})' | '${name}' | '${ref}' } [0x2f resolution 22]",
                  "aerialway=cable_car { name '${name} (${ref})' | '${name}' | '${ref}' } [0x10f15 resolution 22]",
                  'cable_car visual type',
              ),
              (
                  Path('styles/uralla/lines'),
                  "(aeroway=taxiway | aeroway=taxilane) & highway!=* & is_closed()=false {name '${ref}'} [0x1a resolution 23]",
                  "(aeroway=taxiway | aeroway=taxilane) & highway!=* & is_closed()=false {name '${ref}'} [0x27 resolution 23]",
                  'taxiway visual type',
              ),
          ]

          for path, old, new, label in patches:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'{label}: expected exactly one old rule, found {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')
              print(f'Patched {label}: {path}')
          PY

      - name: Download pinned mkgmap r4924
        run: |
          curl -fsSLO https://www.mkgmap.org.uk/download/mkgmap-r4924.zip
          echo 'b2170799b61a95d4fc258e8e4fb4e21396809e0390789178f94c77109f8e0d84  mkgmap-r4924.zip' | sha256sum -c -
          unzip -q mkgmap-r4924.zip

      - name: Check uralla style with zero warnings
        run: |
          set -o pipefail
          java -jar mkgmap-r4924/mkgmap.jar \
            --style-file=styles/uralla \
            --check-styles 2>&1 | tee /tmp/check-styles.log
          grep -Fq 'Found one style in styles/uralla' /tmp/check-styles.log
          grep -Fq 'finished check-styles' /tmp/check-styles.log
          if grep -Fq 'Warning:' /tmp/check-styles.log; then
            echo 'mkgmap style warnings remain:' >&2
            grep -F 'Warning:' /tmp/check-styles.log >&2
            exit 1
          fi

      - name: Recompile direct TYP source
        run: |
          mkdir -p /tmp/typ-check
          java -jar mkgmap-r4924/mkgmap.jar \
            --code-page=1251 \
            --output-dir=/tmp/typ-check \
            styles/uralla.txt 2>&1 | tee /tmp/typ.log
          test -n "$(find /tmp/typ-check -maxdepth 1 -type f -name '*.typ' -print -quit)"
          grep -Fq 'Number of MapFailedExceptions: 0' /tmp/typ.log
          grep -Fq 'Number of ExitExceptions: 0' /tmp/typ.log

      - name: Commit direct style sources and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla/lines styles/uralla/inc/water_lines
          git rm .github/workflows/fix-routable-line-warnings-once.yml
          git commit -m "Use non-routable visual types for aerial lines"
          git push origin HEAD:main
