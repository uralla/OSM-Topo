name: Cleanup aerodrome polygon compatibility

on:
  push:
    paths:
      - '.github/workflows/cleanup-aerodrome-polygon.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Merge aerodrome compatibility polygon rules
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('styles/uralla/polygons')
          s = p.read_text()
          old = "aeroway=airport [0x07 resolution 18]\naeroway=aerodrome [0x07 resolution 18]\n"
          new = "(aeroway=aerodrome | aeroway=airport) [0x07 resolution 18]\n"
          assert s.count(old) == 1
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit cleanup and remove workflow
        run: |
          rm .github/workflows/cleanup-aerodrome-polygon.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla/polygons .github/workflows/cleanup-aerodrome-polygon.yml
          git commit -m "Unify aerodrome compatibility polygon rule"
          git push
