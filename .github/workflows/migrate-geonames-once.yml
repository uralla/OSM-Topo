name: Migrate GeoNames once

on:
  push:
    paths:
      - scripts/tools/migrate_geonames_once.py
      - .github/workflows/migrate-geonames-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate GeoNames configuration
        run: python scripts/tools/migrate_geonames_once.py
      - name: Run focused tests
        run: |
          python -m pip install -e .
          python -m unittest tests.test_external_data tests.test_build_plan -v
      - name: Commit GeoNames migration
        shell: bash
        run: |
          if git diff --quiet -- config/maps.yaml uralla_build/external_data.py tests/test_external_data.py; then
            echo "No GeoNames changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/maps.yaml uralla_build/external_data.py tests/test_external_data.py
          git commit -m "Use proper GeoNames cities data for tile names"
          git push origin HEAD:main
