name: One-shot survey point label cleanup

on:
  push:
    paths:
      - '.github/workflows/one-shot-survey-point-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Suppress unnamed survey point labels
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('styles/uralla/inc/landuse_points')
          text = path.read_text(encoding='utf-8')
          old = 'man_made=survey_point {name "${name} (${ele})" | "${name}" | "${ref}" | "геодезический пункт"} [0x6617 resolution 24]'
          new = '''man_made=survey_point & name=* {name "${name} (${ele})" | "${name}"} [0x6617 resolution 24]\nman_made=survey_point & name!=* { set mkgmap:label:1=' ' } [0x6617 resolution 24]'''
          if new not in text:
              if old not in text:
                  raise SystemExit('survey point rule anchor not found')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify rule
        shell: bash
        run: |
          grep -F 'man_made=survey_point & name=* {name "${name} (${ele})" | "${name}"} [0x6617 resolution 24]' styles/uralla/inc/landuse_points
          grep -F "man_made=survey_point & name!=* { set mkgmap:label:1=' ' } [0x6617 resolution 24]" styles/uralla/inc/landuse_points
          ! grep -F '"геодезический пункт"' styles/uralla/inc/landuse_points

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles/uralla/inc/landuse_points
          if git diff --cached --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git commit -m "Hide synthetic labels for unnamed survey points"
          git push
