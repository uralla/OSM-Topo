name: Remove dead place of worship comment
"on":
  push:
    paths:
      - ".github/workflows/remove-dead-place-of-worship-comment.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove dead place of worship comment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('styles/uralla/points')
          s = p.read_text(encoding='utf-8')
          old = '#amenity=place_of_worship [0x11602 resolution 22]\n'
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old, '', 1), encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/remove-dead-place-of-worship-comment.yml
          git add styles/uralla/points
          git commit -m "Remove dead place of worship comment"
          git pull --rebase origin main
          git push
