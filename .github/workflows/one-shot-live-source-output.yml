name: One-shot live source output
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-live-source-output.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Apply exact patch
        run: python3 .github/scripts/one_shot_live_source_output.py
      - name: Install project
        run: python3 -m pip install -e .
      - name: Verify
        run: |
          python3 -m py_compile uralla_build/cli.py
          python3 -m unittest tests.test_live_source_output tests.test_external_data -v
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add uralla_build/cli.py tests/test_live_source_output.py
          git commit -m 'Flush source download progress in interactive builds'
          git push
