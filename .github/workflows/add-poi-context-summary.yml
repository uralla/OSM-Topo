name: Add POI context summary

on:
  push:
    paths:
      - '.github/workflows/add-poi-context-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch preprocess output
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('uralla_build/preprocessor.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace('_emit_progress("[preprocess] food-shop context: indexing node shops")', '_emit_progress("food-shop context: indexing node shops")')
          s = s.replace('f"[preprocess] food-shop context: {food_shop_index.shop_count:,} node shops indexed "', 'f"food-shop context: {food_shop_index.shop_count:,} node shops indexed "')

          old = '''        _progress(counters["objects_seen"], started)\n        report: dict[str, object] = {\n'''
          new = '''        _progress(counters["objects_seen"], started)\n        _emit_progress(\n            "POI context: "\n            f"food shops {counters['poi_context_enriched']:,}; "\n            f"common {counters['poi_priority_common']:,}; "\n            f"sparse {counters['poi_priority_sparse']:,}; "\n            f"isolated {counters['poi_priority_isolated']:,}"\n        )\n        report: dict[str, object] = {\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          python -m py_compile uralla_build/preprocessor.py
          grep -F 'POI context:' uralla_build/preprocessor.py
          grep -F 'food-shop context: indexing node shops' uralla_build/preprocessor.py
      - name: Commit
        run: |
          rm .github/workflows/add-poi-context-summary.yml
          git config user.name 'Alexey Klyanin'
          git config user.email '42924160+uralla@users.noreply.github.com'
          git add -A
          git commit -m 'Show POI context summary in preprocess log'
          git push
