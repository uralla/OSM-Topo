name: Restore bicycle bitmap

"on":
  push:
    paths:
      - ".github/workflows/restore-bicycle-bitmap.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Restore old bicycle bitmap
        run: echo '' | base64 --decode | python
      - name: Remove one-shot workflow
        run: rm .github/workflows/restore-bicycle-bitmap.yml
      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add styles/uralla.txt .github/workflows/restore-bicycle-bitmap.yml
          git commit -m "Restore previous bicycle POI bitmap"
          git push
