name: One-shot unify build summary

on:
  push:
    paths:
      - '.github/workflows/one-shot-unify-build-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch shared build entrypoint
        run: python .github/scripts/one_shot_unify_build_summary.py
      - name: Sanity check
        run: |
          python -m py_compile uralla_build/entrypoint.py uralla_build/__main__.py uralla_build/incremental.py
          grep -q 'from .incremental import rebuild_from_mkgmap, rebuild_from_splitter' uralla_build/entrypoint.py
          grep -q 'from_stage == "splitter"' uralla_build/entrypoint.py
          grep -q 'merge checkpoint' uralla_build/entrypoint.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uralla_build/entrypoint.py
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Unify human build summaries across all build modes'
          git push
