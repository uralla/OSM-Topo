name: Migrate place transform into preprocessor
'on':
  push:
    paths:
      - '.github/workflows/migrate-place-transform.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project
        run: python -m pip install -e .
      - name: Patch implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('uralla_build/preprocessor.py')
          s = p.read_text()
          anchor = 'PROGRESS_EVERY_OBJECTS = 1_000_000\n'
          addition = '''PROGRESS_EVERY_OBJECTS = 1_000_000\nPLACE_ADMIN_LEVELS = {\n    "city": "7",\n    "town": "7",\n    "village": "10",\n    "hamlet": "10",\n    "isolated_dwelling": "11",\n    "allotments": "11",\n}\n'''
          assert anchor in s
          s = s.replace(anchor, addition, 1)

          anchor = '''def enrich_long_name_tags(\n    tags: Mapping[str, str] | object,\n    limit: int = LONG_NAME_LIMIT,\n) -> tuple[dict[str, str], bool]:\n'''
          fn = '''def enrich_place_admin_tags(\n    tags: Mapping[str, str] | object,\n) -> tuple[dict[str, str], bool]:\n    """Reproduce the former transform_places.xml search enrichment."""\n\n    items = tags.items() if isinstance(tags, Mapping) else iter(tags)  # type: ignore[arg-type]\n    result = {str(key): str(value) for key, value in items}\n    admin_level = PLACE_ADMIN_LEVELS.get(result.get("place", ""))\n    if admin_level is None:\n        return result, False\n    desired = {\n        "admin_level": admin_level,\n        "boundary": "administrative",\n        "type": "boundary",\n    }\n    changed = any(result.get(key) != value for key, value in desired.items())\n    result.update(desired)\n    return result, changed\n\n\n'''
          assert anchor in s
          s = s.replace(anchor, fn + anchor, 1)

          old = '''                final_tags, _long_name_added = enrich_long_name_tags(decision.tags)\n'''
          new = '''                final_tags, place_admin_added = enrich_place_admin_tags(decision.tags)\n                if place_admin_added:\n                    counters["place_admin_enriched"] += 1\n                final_tags, _long_name_added = enrich_long_name_tags(final_tags)\n'''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('"schema_version": 6,', '"schema_version": 7,', 1)
          old = '''            "tags_removed": counters["tags_removed"],\n            "geographic_labels_enriched": counters["geographic_labels_enriched"],\n'''
          new = '''            "tags_removed": counters["tags_removed"],\n            "place_admin_enriched": counters["place_admin_enriched"],\n            "geographic_labels_enriched": counters["geographic_labels_enriched"],\n'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('uralla_build/build_plan.py')
          s = p.read_text()
          old = '''    transform = repo_path(\n        repo,\n        _text(defaults.get("transform_places"), "defaults.transform_places"),\n    )\n'''
          assert old in s
          s = s.replace(old, '', 1)
          s = s.replace('        transform_input = extract_output\n', '        splitter_input = extract_output\n', 1)
          s = s.replace('        transform_input = source_path\n', '        splitter_input = source_path\n', 1)
          start = s.index('    transformed = build_root / "transform" / "transformed.osm.pbf"\n')
          end = s.index('    warnings: list[str] = []\n', start)
          s = s[:start] + s[end:]
          old = '''    # Split OSM before semantic preprocessing so independent tiles can use all CPU cores.\n    splitter_input = transformed\n\n'''
          assert old in s
          s = s.replace(old, '', 1)
          p.write_text(s)

          p = Path('config/maps.yaml')
          s = p.read_text()
          s = s.replace('  transform_places: scripts/transform_places.xml\n', '', 1)
          p.write_text(s)

          p = Path('tests/test_preprocessor.py')
          s = p.read_text()
          s = s.replace('    enrich_long_name_tags,\n', '    enrich_long_name_tags,\n    enrich_place_admin_tags,\n', 1)
          anchor = '''    def test_long_name_marker_uses_strict_30_character_limit(self) -> None:\n'''
          test = '''    def test_place_admin_enrichment_replaces_transform_places_xml(self) -> None:\n        cases = {\n            "city": "7",\n            "town": "7",\n            "village": "10",\n            "hamlet": "10",\n            "isolated_dwelling": "11",\n            "allotments": "11",\n        }\n        for place, level in cases.items():\n            with self.subTest(place=place):\n                tags, changed = enrich_place_admin_tags({"place": place, "name": "Test"})\n                self.assertTrue(changed)\n                self.assertEqual(tags["admin_level"], level)\n                self.assertEqual(tags["boundary"], "administrative")\n                self.assertEqual(tags["type"], "boundary")\n                self.assertEqual(tags["name"], "Test")\n\n        tags, changed = enrich_place_admin_tags({"place": "suburb", "name": "Test"})\n        self.assertFalse(changed)\n        self.assertNotIn("admin_level", tags)\n\n'''
          assert anchor in s
          s = s.replace(anchor, test + anchor, 1)
          p.write_text(s)

          Path('scripts/transform_places.xml').unlink()
          PY
      - name: Verify focused tests and syntax
        run: |
          python -m py_compile uralla_build/preprocessor.py uralla_build/build_plan.py
          python -m unittest discover -s tests -p 'test_preprocessor.py'
          ! grep -R "transform_places" -n uralla_build config
      - name: Commit migration
        run: |
          rm .github/workflows/migrate-place-transform.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Move place transforms into parallel preprocessor"
          git push
